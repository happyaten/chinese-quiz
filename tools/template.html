<title>國文選擇題庫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one centered column like an answer sheet; big tap targets, sticky footer action on the quiz screen */
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#1d2a2a; --muted:#5d6b6a; --line:#d8dfdd;
  --accent:#1f5f5b; --accent-ink:#ffffff; --accent-soft:#e1eeec;
  --ok:#1e7a46; --ok-soft:#e2f3e8; --bad:#b3362c; --bad-soft:#fbe7e4; --warn:#8a6414; --warn-soft:#f7efd9;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121817; --card:#1b2322; --ink:#e4ecea; --muted:#9aaba8; --line:#2e3a38;
  --accent:#5fb3aa; --accent-ink:#0d1716; --accent-soft:#1f3532;
  --ok:#5cc98a; --ok-soft:#173326; --bad:#f08070; --bad-soft:#3a1d1a; --warn:#e0b45a; --warn-soft:#352b14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --card:#1b2322; --ink:#e4ecea; --muted:#9aaba8; --line:#2e3a38;
  --accent:#5fb3aa; --accent-ink:#0d1716; --accent-soft:#1f3532;
  --ok:#5cc98a; --ok-soft:#173326; --bad:#f08070; --bad-soft:#3a1d1a; --warn:#e0b45a; --warn-soft:#352b14; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0}
h1{font-size:30px;letter-spacing:.04em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.section-label{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:28px 0 10px;font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:15px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.round{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.round:active{transform:scale(.98)}
.round b{font-family:var(--serif);font-size:20px;font-weight:700}
.round span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.round.all{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.round.all span{color:inherit;opacity:.85}
.round.wrong{border-color:var(--bad)}
.round:disabled{opacity:.45}
.note{font-size:13px;color:var(--muted);margin-top:24px;line-height:1.7}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:13px}

/* quiz */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.iconbtn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;min-width:44px;height:44px;padding:0 12px;font-size:15px}
.prog{flex:1;min-width:0}
.prog .bar{height:8px}
.prog .bar i{background:var(--accent)}
.prog small{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin-top:3px}
.passage{background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-bottom:14px}
.passage summary{padding:12px 16px;font-weight:500;color:var(--accent);list-style:none;display:flex;justify-content:space-between;min-height:44px;align-items:center}
.passage summary::-webkit-details-marker{display:none}
.passage summary::after{content:"展開";font-size:13px;color:var(--muted)}
.passage[open] summary::after{content:"收合"}
.passage div{padding:0 16px 16px;font-family:var(--serif);font-size:calc(var(--fs) - 1px);line-height:1.9;white-space:pre-wrap;max-height:50vh;overflow:auto}
.qmeta{font-size:13px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.stem{font-family:var(--serif);font-size:calc(var(--fs) + 2px);line-height:1.8;font-weight:500;margin:0 0 18px;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 14px;min-height:56px;font-size:var(--fs);line-height:1.6;transition:background .15s,border-color .15s}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;font-family:var(--sans)}
.opt .t{min-width:0;overflow-wrap:anywhere;padding-top:2px}
@media (hover:hover){.opt:not(:disabled):hover{border-color:var(--accent)}}
.opt:not(:disabled):active{transform:scale(.99)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.dim{opacity:.55}
.fb{margin-top:14px;border-radius:12px;padding:12px 16px;font-weight:700;font-size:17px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.na{background:var(--warn-soft);color:var(--warn);font-weight:500;font-size:15px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.primary{flex:1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;min-height:54px;font-size:18px;font-weight:700}
.primary:disabled{opacity:.35}
.secondary{background:var(--card);border:1.5px solid var(--line);border-radius:14px;min-height:54px;padding:0 18px;font-size:16px}

/* result */
.score{font-family:var(--serif);font-size:64px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.rv{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.rv p{margin:0 0 6px;font-family:var(--serif);font-size:17px}
.rv .a{font-size:15px}
.rv .a .y{color:var(--bad)}
.rv .a .c{color:var(--ok);font-weight:700}
.empty{color:var(--muted);padding:20px 0}
/* subject tabs */
.stages{margin-top:16px}
.subjects{display:flex;gap:4px;margin-top:18px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.subj{flex:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;padding:10px 16px;font-size:17px;font-weight:500;color:var(--muted);min-height:48px}
.subj[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
/* bank switcher & import */
.banks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:16px;scrollbar-width:thin}
.banks .chip{flex:none;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.add{border-style:dashed;color:var(--accent);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.field input[type=text],.field textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.field textarea{min-height:160px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:22px 16px;background:var(--card);cursor:pointer;min-height:110px}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--accent);font-size:17px}
.drop span{color:var(--muted);font-size:13px}
.or{text-align:center;color:var(--muted);font-size:13px;margin:14px 0 4px}
.status{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:15px}
.status.info{background:var(--accent-soft);color:var(--accent)}
.status.err{background:var(--bad-soft);color:var(--bad)}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.prev{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}
.prev p{margin:0 0 4px;font-family:var(--serif)}
.prev ol{margin:0;padding-left:0;list-style:none;color:var(--muted)}
.prev .c{color:var(--ok);font-weight:700}
.fmt{font-size:14px;color:var(--muted);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:10px}
.fmt pre{font-family:var(--sans);white-space:pre-wrap;margin:8px 0 0;color:var(--ink);font-size:14px;line-height:1.7}
.danger{background:none;border:0;color:var(--bad);text-decoration:underline;padding:0;font-size:13px}
.fig{display:block;max-width:min(100%,360px);margin:0 auto 18px;background:#fff;border-radius:10px;padding:8px}
mjx-container{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}
.exp{margin-top:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;font-size:calc(var(--fs) - 2px);line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.card-ans{margin-top:14px;background:var(--ok-soft);border:2px solid var(--ok);border-radius:14px;padding:14px 16px;font-size:var(--fs);line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.card-ans b{display:block;font-size:13px;letter-spacing:.12em;color:var(--ok);margin-bottom:4px;font-family:var(--sans)}
.card-hint{margin-top:14px;color:var(--muted);font-size:15px}
.exp b{display:block;font-size:13px;letter-spacing:.12em;color:var(--accent);margin-bottom:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.opt:active,.round:active{transform:none}}
</style>

<script>
const BUILTIN=(()=>{const d=JSON.parse(document.getElementById('data').textContent);return {id:'builtin',subj:'國文',name:'國文選擇題 3000 題',source:'朱源葆博士彙編',...d}})();
const BUILTINS=[BUILTIN,...['data-zh2','data-math','data-ph2','data-gt','data-phys','data-geo','data-ja','data-his','data-civ','data-en','data-enc','data-m2zh','data-m2ma','data-m2er','data-m2el','data-m2sci','data-m2soc','data-m3zh','data-m3en','data-m3sci','data-m3soc','data-m4zh','data-m4ma','data-m4en','data-m4sci','data-m4soc','data-m5zh','data-m5ma','data-m5en','data-m5el','data-m5sci','data-m5soc','data-m6zh','data-m6ma','data-m6en','data-m6el','data-m6sci','data-m6soc','data-m7zh','data-m7ma','data-m7en','data-m7el','data-m7sci','data-m7soc','data-m8zh','data-m8ma','data-m8en','data-m8sci','data-m8soc','data-m9zh','data-m9ma','data-m9en','data-m9el','data-m9sci','data-m9soc','data-e5zh','data-e5ma','data-e5sci','data-e5bzhkh','data-e5bzhhl','data-e5bsciny','data-e5bscikh','data-e5bscihl','data-e5bsocny','data-e5bsochl','data-e5bsocman','data-g8zhkha','data-g8zhkhb','data-g8zhkhc','data-g8zhhla'].map(id=>JSON.parse(document.getElementById(id).textContent))];
const BKEY='quiz-banks-v1', SKEY='quiz-state-v2';
let banks=[];
try{banks=JSON.parse(localStorage.getItem(BKEY)||'[]')}catch(e){}
let store={banks:{},fs:18,mode:'seq',size:0,cur:'builtin',subj:'國文'};
const SUBJS=['國文','國語','數學','理化','自然','地理','歷史','公民','英文','英語','社會','其他'];
const STAGES=['國中','國小'];
const subjOf=b=>b.subj||'其他';
const stageOf=b=>b.stage||'國中';
const sameStage=b=>stageOf(b)===stageOf(B);
const skey=(st,s)=>st==='國中'?s:st+'/'+s;
try{Object.assign(store,JSON.parse(localStorage.getItem(SKEY)||'{}'))}catch(e){}
try{const old=JSON.parse(localStorage.getItem('zh-quiz-v1')||'null');
  if(old&&!store.banks.builtin){store.banks.builtin={wrong:old.wrong||{},done:old.done||{}};['fs','mode','size'].forEach(k=>{if(old[k]!=null)store[k]=old[k]})}}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(store))}catch(e){}}
function saveBanks(){try{localStorage.setItem(BKEY,JSON.stringify(banks));return true}catch(e){return false}}
const allBanks=()=>[...BUILTINS,...banks];
let B; // current bank
function useBank(id){
  B=allBanks().find(b=>b.id===id)||BUILTIN; store.cur=B.id;
  store.lastBySubj=Object.assign(store.lastBySubj||{},{[skey(stageOf(B),subjOf(B))]:B.id});
  store.lastByStage=Object.assign(store.lastByStage||{},{[stageOf(B)]:B.id});
  B.questions.forEach((q,i)=>{q.id=i});
  if(!store.banks[B.id]) store.banks[B.id]={wrong:{},done:{}};
  save();
}
const prog=()=>store.banks[B.id];
function applyFs(){document.documentElement.style.setProperty('--fs',store.fs+'px')}
applyFs(); useBank(store.cur);
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hasAns=q=>!!q.card||(q.a&&q.a.length>0);
const L='ABCDEFGH';
let S=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function clearFoot(){document.getElementById('foot')?.remove()}
// 數學題用 MathJax 排版（只在需要時載入）
let mathReady=null;
function typeset(){
  if(B.math==null) B.math=B.questions.some(q=>/\\\(/.test(q.q+(q.o||[]).join('')+(q.e||'')+(q.ans||'')+((B.passages||[])[q.p]||'')));
  if(!B.math) return;
  if(!mathReady){
    window.MathJax={tex:{inlineMath:[['\\(','\\)']]},svg:{fontCache:'global'},startup:{typeset:false}};
    mathReady=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js';s.onload=()=>MathJax.startup.promise.then(ok);s.onerror=no;document.head.appendChild(s)});
  }
  mathReady.then(()=>MathJax.typesetPromise([app])).catch(()=>{});
}

function home(){
  S=null; window.scrollTo(0,0); clearFoot();
  const Q=B.questions, pr=prog();
  const bySec=B.sections.map(()=>[]);Q.forEach(q=>bySec[q.s]&&bySec[q.s].push(q));
  const wrongN=Object.keys(pr.wrong).length, doneAll=Q.filter(q=>pr.done[q.id]).length;

function start(r){
  const Q=B.questions, pr=prog();
  let pool,label;
  if(r==='all'){pool=Q.filter(hasAns);label='全部混合'}
  else if(r==='wrong'){pool=Q.filter(q=>pr.wrong[q.id]);label='錯題複習'}
  else {pool=Q.filter(q=>q.s==+r);label=B.sections[+r]}
  if(store.mode==='rand'||r==='all') pool=shuffle(pool);
  if(store.size&&pool.length>store.size){
    if(store.mode==='seq'&&r!=='all'&&r!=='wrong'){
      let i=pool.findIndex(q=>!pr.done[q.id]); if(i<0)i=0;
      const all=pool; pool=all.slice(i,i+store.size);
      if(pool.length<store.size) pool=pool.concat(all.slice(0,store.size-pool.length));
    } else pool=pool.slice(0,store.size);
  }
  S={label,list:pool,i:0,ans:[]};
  renderQ();
}

function renderQ(){
  window.scrollTo(0,0);
  const q=S.list[S.i];
  const scored=S.ans.filter(a=>a&&a.scored), right=scored.filter(a=>a.ok).length;
  let h=`<div class="top"><button class="iconbtn" id="back" aria-label="回首頁">← 首頁</button>
    <div class="prog"><div class="bar"><i style="width:${S.i/S.list.length*100}%"></i></div>
    <small><span>${esc(S.label)}　第 ${S.i+1} / ${S.list.length} 題</span><span>答對 ${right} / ${scored.length}</span></small></div></div>`;
  if(q.p!=null) h+=`<details class="passage" open><summary>閱讀文章</summary><div>${esc(B.passages[q.p])}</div></details>`;
  h+=`<div class="qmeta">${B.sections.length>1?esc(B.sections[q.s])+'・':''}${q.card&&q.kind?esc(q.kind)+'・':''}第 ${q.n} 題</div><p class="stem">${esc(q.q)}</p>${q.img?`<img class="fig" src="${q.img[0]==='#'?B.imgs[+q.img.slice(1)]:q.img}" alt="題目附圖">`:''}`;
  if(q.card){
    h+=`<div class="card-hint">先在心裡或紙上寫出答案，再按「看答案」。</div><div id="fb"></div>`;
    app.innerHTML=h;
    document.getElementById('back').onclick=home;
    let f=document.getElementById('foot');
    if(!f){f=document.createElement('div');f.id='foot';f.className='foot';document.body.appendChild(f)}
    f.innerHTML=`<div class="in"><button class="secondary" id="skip">跳過</button><button class="primary" id="reveal">看答案</button></div>`;
    document.getElementById('skip').onclick=next;
    document.getElementById('reveal').onclick=reveal;
    return;
  }
  h+=`<div class="opts">`;
  q.o.forEach((o,k)=>{h+=`<button class="opt" data-k="${k}"><span class="k">${L[k]}</span><span class="t">${esc(o||'（原檔此選項空白）')}</span></button>`});
  h+=`</div><div id="fb"></div>`;
  app.innerHTML=h;
  document.getElementById('back').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  let f=document.getElementById('foot');
  if(!f){f=document.createElement('div');f.id='foot';f.className='foot';document.body.appendChild(f)}
  f.innerHTML=`<div class="in"><button class="secondary" id="skip">跳過</button><button class="primary" id="next" disabled>請點選答案</button></div>`;
  document.getElementById('skip').onclick=next;
  document.getElementById('next').onclick=next;
  typeset();
}

function pick(k){
  const q=S.list[S.i], pr=prog();
  if(S.ans[S.i])return;
  const scored=hasAns(q), ok=scored&&q.a.includes(k);
  S.ans[S.i]={k,ok,scored};
  pr.done[q.id]=1;
  if(scored){ if(ok) delete pr.wrong[q.id]; else pr.wrong[q.id]=1; }
  save();
  app.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true;
    if(scored&&q.a.includes(i)) b.classList.add('ok');
    else if(i===k) b.classList.add(scored?'bad':'ok');
    else b.classList.add('dim');
  });
  const fb=document.getElementById('fb');
  const ansTxt=scored?q.a.map(i=>L[i]).join('、'):'';
  fb.innerHTML=!scored?`<div class="fb na">原檔未附這題的答案，這題不計分。</div>`
    : ok?`<div class="fb ok">答對了！正確答案是 ${ansTxt}</div>`:`<div class="fb bad">答錯了，正確答案是 ${ansTxt}</div>`;
  if(q.e) fb.innerHTML+=`<div class="exp"><b>解析</b>${esc(q.e)}</div>`;
  const nb=document.getElementById('next');
  nb.disabled=false; nb.textContent=S.i+1<S.list.length?'下一題 →':'看成績';
  document.getElementById('skip').hidden=true;
  typeset();
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function reveal(){
  const q=S.list[S.i];
  const fb=document.getElementById('fb');
  fb.innerHTML=`<div class="card-ans"><b>答案</b>${esc(q.ans)}</div>`+(q.e?`<div class="exp"><b>解析</b>${esc(q.e)}</div>`:'');
  document.querySelector('.card-hint')?.remove();
  const f=document.getElementById('foot');
  f.innerHTML=`<div class="in"><button class="secondary" id="miss">還不熟</button><button class="primary" id="got">我答對了</button></div>`;
  const mark=ok=>{const pr=prog();S.ans[S.i]={ok,scored:true,card:true};pr.done[q.id]=1;if(ok)delete pr.wrong[q.id];else pr.wrong[q.id]=1;save();next()};
  document.getElementById('miss').onclick=()=>mark(false);
  document.getElementById('got').onclick=()=>mark(true);
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function next(){ S.i++; if(S.i<S.list.length) renderQ(); else result(); }

function result(){
  window.scrollTo(0,0); clearFoot();
  const scored=S.ans.map((a,i)=>({a,q:S.list[i]})).filter(x=>x.a&&x.a.scored);
  const right=scored.filter(x=>x.a.ok).length, wrong=scored.filter(x=>!x.a.ok);
  const pct=scored.length?Math.round(right/scored.length*100):0;
  let h=`<div class="top"><button class="iconbtn" id="back">← 首頁</button></div>
  <h2>${esc(S.label)}　成績</h2>
  <div style="margin:18px 0 6px" class="score">${pct}<small> 分</small></div>
  <div class="sub">答對 ${right} 題・答錯 ${wrong.length} 題${S.list.length>scored.length?`・未作答或不計分 ${S.list.length-scored.length} 題`:''}</div>
  <div class="section-label">答錯的題目</div><div class="review">`;
  if(!wrong.length) h+=`<div class="empty">這次全部答對，太厲害了！</div>`;
  wrong.forEach(({a,q})=>{h+=`<div class="rv"><p>${B.sections.length>1?esc(B.sections[q.s])+' ':''}${q.n}. ${esc(q.q)}</p>
    <div class="a">${q.card?`答案 <span class="c">${esc(q.ans)}</span>`:`你選 <span class="y">${L[a.k]}　${esc(q.o[a.k])}</span><br>正解 <span class="c">${q.a.map(i=>L[i]+'　'+esc(q.o[i])).join('<br>')}</span>`}</div>${q.e?`<div class="exp"><b>解析</b>${esc(q.e)}</div>`:''}</div>`});
  h+=`</div>`;
  app.innerHTML=h;
  document.getElementById('back').onclick=home;
  const f=document.createElement('div');f.id='foot';f.className='foot';
  f.innerHTML=`<div class="in"><button class="secondary" id="home2">回首頁</button>${wrong.length?'<button class="primary" id="redo">重做這次答錯的題目</button>':'<button class="primary" id="again">再來一組</button>'}</div>`;
  document.body.appendChild(f);
  document.getElementById('home2').onclick=home;
  const redo=document.getElementById('redo'); if(redo) redo.onclick=()=>{S={label:'錯題重做',list:wrong.map(x=>x.q),i:0,ans:[]};renderQ()};
  const again=document.getElementById('again'); if(again) again.onclick=home;
  typeset();
}

const loaded={};
function loadScript(src){return loaded[src]||(loaded[src]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('無法載入讀檔工具，請確認網路連線'));document.head.appendChild(s)}))}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function pdfText(buf){
  await loadScript(PDFJS+'pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:buf,isEvalSupported:false}).promise;
  let out=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent();
    const rows=[];
    tc.items.forEach(it=>{if(!it.str)return;const y=it.transform[5],x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rows.push(r)}r.items.push({x,s:it.str})});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join('')));
  }
  return out.join('\n');
}
async function docxText(buf){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
  return (await mammoth.extractRawText({arrayBuffer:buf})).value;
}
async function fileText(file){
  const name=file.name.toLowerCase(), buf=await file.arrayBuffer();
  if(name.endsWith('.pdf')) return pdfText(buf);
  if(name.endsWith('.docx')) return docxText(buf);
  if(name.endsWith('.doc')) throw new Error('舊版 Word（.doc）檔讀不到，請在 Word 另存成 .docx 或 .txt 再上傳');
  let t=new TextDecoder('utf-8').decode(buf);
  if((t.match(/\uFFFD/g)||[]).length>5){try{t=new TextDecoder('big5').decode(buf)}catch(e){}}
  return t;
}

    const fails=r.fails.length?`<div class="section-label">略過的題目（前 5 題）</div>`+r.fails.slice(0,5).map(f=>`<div class="prev"><ol><li>${esc(f.sec)} 第 ${f.n} 題：${esc(f.text)}…</li></ol></div>`).join(''):'';
    document.getElementById('impPrev').innerHTML=`<div class="section-label">前幾題預覽</div><div class="review">${sample}</div>${fails}`;
    btn.textContent='儲存題庫並開始';
  };
  function saveImport(){
    const r=IMP.result;
    const name=nameIn.value.trim()||`我的題庫 ${banks.length+1}`;
    const bank={id:'b'+Date.now().toString(36),subj:IMP.subj,stage:stageOf(B),name,source:'自行匯入',sections:r.sections,passages:r.passages,questions:r.questions.map(({s,n,q,o,a,p,e})=>Object.assign({s,n,q,o,a},p!=null?{p}:{},e?{e}:{}))};
    banks.push(bank);
    if(!saveBanks()){banks.pop();status('err','這台裝置的瀏覽器儲存空間不夠，請先刪除用不到的題庫再試一次。');return}
    useBank(bank.id); home();
  }
}

document.addEventListener('keydown',e=>{
  if(!S||!S.list[S.i]) return;
  const m={'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6,'8':7,a:0,b:1,c:2,d:3,e:4,f:5,g:6,h:7}[e.key.toLowerCase()];
  if(m!=null&&!S.ans[S.i]&&m<(S.list[S.i].o||[]).length) pick(m);
  else if(e.key==='Enter'&&S.ans[S.i]) next();
});
home();
</script>
