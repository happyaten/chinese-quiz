<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>國文選擇題庫</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column like an answer sheet; big tap targets, sticky footer action on the quiz screen */
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#1d2a2a; --muted:#5d6b6a; --line:#d8dfdd;
  --accent:#1f5f5b; --accent-ink:#ffffff; --accent-soft:#e1eeec;
  --ok:#1e7a46; --ok-soft:#e2f3e8; --bad:#b3362c; --bad-soft:#fbe7e4; --warn:#8a6414; --warn-soft:#f7efd9;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --fs:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121817; --card:#1b2322; --ink:#e4ecea; --muted:#9aaba8; --line:#2e3a38;
  --accent:#5fb3aa; --accent-ink:#0d1716; --accent-soft:#1f3532;
  --ok:#5cc98a; --ok-soft:#173326; --bad:#f08070; --bad-soft:#3a1d1a; --warn:#e0b45a; --warn-soft:#352b14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --card:#1b2322; --ink:#e4ecea; --muted:#9aaba8; --line:#2e3a38;
  --accent:#5fb3aa; --accent-ink:#0d1716; --accent-soft:#1f3532;
  --ok:#5cc98a; --ok-soft:#173326; --bad:#f08070; --bad-soft:#3a1d1a; --warn:#e0b45a; --warn-soft:#352b14; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--serif);text-wrap:balance;margin:0}
h1{font-size:30px;letter-spacing:.04em}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.section-label{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:28px 0 10px;font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:15px;min-height:44px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.round{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px}
.round:active{transform:scale(.98)}
.round b{font-family:var(--serif);font-size:20px;font-weight:700}
.round span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.round.all{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.round.all span{color:inherit;opacity:.85}
.round.wrong{border-color:var(--bad)}
.round:disabled{opacity:.45}
.note{font-size:13px;color:var(--muted);margin-top:24px;line-height:1.7}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:13px}

/* quiz */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.iconbtn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;min-width:44px;height:44px;padding:0 12px;font-size:15px}
.prog{flex:1;min-width:0}
.prog .bar{height:8px}
.prog .bar i{background:var(--accent)}
.prog small{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;margin-top:3px}
.passage{background:var(--card);border:1.5px solid var(--line);border-radius:14px;margin-bottom:14px}
.passage summary{padding:12px 16px;font-weight:500;color:var(--accent);list-style:none;display:flex;justify-content:space-between;min-height:44px;align-items:center}
.passage summary::-webkit-details-marker{display:none}
.passage summary::after{content:"展開";font-size:13px;color:var(--muted)}
.passage[open] summary::after{content:"收合"}
.passage div{padding:0 16px 16px;font-family:var(--serif);font-size:calc(var(--fs) - 1px);line-height:1.9;white-space:pre-wrap;max-height:50vh;overflow:auto}
.qmeta{font-size:13px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.stem{font-family:var(--serif);font-size:calc(var(--fs) + 2px);line-height:1.8;font-weight:500;margin:0 0 18px;white-space:pre-wrap;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 14px;min-height:56px;font-size:var(--fs);line-height:1.6;transition:background .15s,border-color .15s}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:15px;font-family:var(--sans)}
.opt .t{min-width:0;overflow-wrap:anywhere;padding-top:2px}
@media (hover:hover){.opt:not(:disabled):hover{border-color:var(--accent)}}
.opt:not(:disabled):active{transform:scale(.99)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.dim{opacity:.55}
.fb{margin-top:14px;border-radius:12px;padding:12px 16px;font-weight:700;font-size:17px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.na{background:var(--warn-soft);color:var(--warn);font-weight:500;font-size:15px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.foot .in{max-width:760px;margin:0 auto;display:flex;gap:10px}
.primary{flex:1;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;min-height:54px;font-size:18px;font-weight:700}
.primary:disabled{opacity:.35}
.secondary{background:var(--card);border:1.5px solid var(--line);border-radius:14px;min-height:54px;padding:0 18px;font-size:16px}

/* result */
.score{font-family:var(--serif);font-size:64px;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.rv{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px}
.rv p{margin:0 0 6px;font-family:var(--serif);font-size:17px}
.rv .a{font-size:15px}
.rv .a .y{color:var(--bad)}
.rv .a .c{color:var(--ok);font-weight:700}
.empty{color:var(--muted);padding:20px 0}
/* bank switcher & import */
.banks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:16px;scrollbar-width:thin}
.banks .chip{flex:none;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.add{border-style:dashed;color:var(--accent);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.field input[type=text],.field textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.field textarea{min-height:160px;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:22px 16px;background:var(--card);cursor:pointer;min-height:110px}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--accent);font-size:17px}
.drop span{color:var(--muted);font-size:13px}
.or{text-align:center;color:var(--muted);font-size:13px;margin:14px 0 4px}
.status{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:15px}
.status.info{background:var(--accent-soft);color:var(--accent)}
.status.err{background:var(--bad-soft);color:var(--bad)}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.prev{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;font-size:15px}
.prev p{margin:0 0 4px;font-family:var(--serif)}
.prev ol{margin:0;padding-left:0;list-style:none;color:var(--muted)}
.prev .c{color:var(--ok);font-weight:700}
.fmt{font-size:14px;color:var(--muted);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:10px}
.fmt pre{font-family:var(--sans);white-space:pre-wrap;margin:8px 0 0;color:var(--ink);font-size:14px;line-height:1.7}
.danger{background:none;border:0;color:var(--bad);text-decoration:underline;padding:0;font-size:13px}
.fig{display:block;max-width:min(100%,360px);margin:0 auto 18px;background:#fff;border-radius:10px;padding:8px}
mjx-container{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}
.exp{margin-top:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;font-size:calc(var(--fs) - 2px);line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}
.exp b{display:block;font-size:13px;letter-spacing:.12em;color:var(--accent);margin-bottom:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.opt:active,.round:active{transform:none}}
</style>
</head>

<script id="data" type="application/json">{"sections":["第一回","第二回","第三回","第四回","第五回","第六回","第七回","第八回","第九回","第十回"],"passages":["世皆稱孟嘗君能得士，士以故歸之，而卒賴其力，以脫於虎豹之秦。嗟乎！孟嘗\n君特雞鳴狗盜之雄耳，豈足以言得士？不然，擅齊之彊，得一士焉，宜可以南面\n而制秦，尚何取雞鳴狗盜之力哉？夫雞鳴狗盜之出其門，此士之所以不至也。（王\n安石〈讀孟嘗君傳〉）","一、夫史者，民族之精神，而人群之龜鑑也。代之盛衰，俗之文野，政之得失，\n物之盈虛，均於是乎在。故凡文化之國，未有不重其史者也。古人有言：「國可\n滅而史不可滅。」是以郢書燕說，猶存其名；晉乘楚杌，語多可採。然則臺灣無\n史，豈非臺人之痛歟？","二、吾嘗終日而思矣，不如須臾之所學也。吾嘗跂而望矣，不如登高之博見也。\n登高而招，臂非加長也，而見者遠；順風而呼，聲非加疾也，而聞者彰。假輿馬\n者，非利足也，而致千里；假舟者，非能水也，而絕江河。君子生非異也，善\n假於物也。","三、我們搖籃的美麗島，是母親溫暖的懷抱。驕傲的祖先們正視著，正視著我\n們的腳步。他們一再重複地叮嚀，不要忘記，不要忘記；他們一再重複地叮嚀，\n篳路藍縷，以啟山林。婆娑無邊的太平洋，是我們自由的土地。溫暖的陽光照耀\n著，照耀著高山和田園。我們這裡有勇敢的人民，篳路藍縷，以啟山林；我們這\n裡有無窮的生命，水牛，稻米，香蕉，玉蘭花。\n（陳秀喜原詩，梁景峰改詞〈美麗島〉）","生而眇者不識日，問之有目者。或告之曰：「日之狀如銅盤」，扣盤而得其聲，\n他日聞鐘，以為日也。或告之曰：「日之光如燭」，捫燭而得其形，他日揣籥，\n以為日也。日之與鐘籥亦遠矣，而眇者不知其異，以其未嘗見而求之人也。道之\n難見也甚於日，而人之未達也，無以異於眇。達者告之，雖有巧譬善導，亦無以\n過於盤與燭也。自盤而之鐘，自燭而之籥，轉而相之，豈有既乎？故世之言道者，\n或即其所見而名之，或莫之見而意之，皆求道之過也。然則道卒不可求歟？蘇子\n曰：「道可致而不可求。」\n（蘇軾〈日喻〉）","夫物者有所宜，材者有所施。各處其宜，故上下無為。使雞司夜，令狸執鼠，\n皆用其能，上乃無事。上有所長，事乃不方。矜而好能，下之所欺。辯惠好生，\n下因其材。上下易用，國故不治。用一之道，以名為首，名正物定，名倚物徙。\n故聖人執一以靜，使名自命，令事自定。（《韓非子.揚權》）","古者，事業不二，利祿不兼，然後諸業不相遠，而貧富不相懸也。夫乘爵祿以謙\n讓者，名不可勝舉也；因權勢以求利者，入不可勝數也。食湖池，管山海，芻蕘\n者不能與之爭澤，商賈不能與之爭利。子貢以布衣致之，而孔子非之，況以勢位\n求之者乎？故古者大夫思其仁義以充其位，不為權利以充其私也。（桓寬《鹽鐵\n論》）","你我相遇於風中/彼此用手掌/小心翼翼的將這段相逢/呵護成唯一的序/早\n在遙遠的三千年前/便寫入〈蒹葭〉的傳說裡/如今/風翻開的每一頁/都不可\n圈點/是孤本，且永遠絕版（許悔之〈絕版〉）","宋人有曹商者，為宋王使秦。其往也，得車數乘；王說之，益車百乘。反於宋，\n見莊子，曰：「夫處窮閭阨巷，困窘織屨，槁項黃馘者，商之所短也；一悟萬乘\n之主而從車百乘者，商之所長也。」莊子曰：「秦王有病召醫。破癰潰痤者得車\n一乘，舐痔者得車五乘，所治愈下，得車愈多。子豈治其痔邪？何得車之多也？\n子行矣！」（《莊子.列禦寇》）","我在長江頭/你在長江尾/摺一只白色的小紙船/投給長江水/我投船時髮正\n黑/你拾船時髮已白/人恨船來晚/髮恨水流快/你拾船時頭已白（余光中〈紙\n船〉）","夫史者，民族之精神，而人群之龜鑑也。代之盛衰，俗之文野，政之得失，物之\n盈虛，均於是乎在。故凡文化之國，未有不重其史者也。古人有言：「國可滅而\n史不可滅。」是以郢書燕說，猶存其名；晉乘楚杌，語多可採。然則臺灣無史，\n豈非臺人之痛歟？（連橫〈臺灣通史序〉）","吾嘗終日而思矣，不如須臾之所學也。吾嘗跂而望矣，不如登高之博見也。登高\n而招，臂非加長也，而見者遠；順風而呼，聲非加疾也，而聞者彰。假輿馬者，\n非利足也，而致千里；假舟者，非能水也，而絕江河。君子生非異也，善假於\n物也。","我們搖籃的美麗島，是母親溫暖的懷抱。驕傲的祖先們正視著，正視著我們的腳\n步。他們一再重複地叮嚀，不要忘記，不要忘記；他們一再重複地叮嚀，篳路藍\n縷，以啟山林。婆娑無邊的太平洋，是我們自由的土地。溫暖的陽光照耀著，照\n耀著高山和田園。我們這裡有勇敢的人民，篳路藍縷，以啟山林；我們這裡有無\n窮的生命，水牛，稻米，香蕉，玉蘭花。","必其果有實邪，果有火證，則不得不為治標，然治標之法宜精簡輕銳，適當其可，\n及病則已，毫無犯其正氣，斯為高手。","黃帝曰：余聞上古有真人者，提挈天地，把握陰陽，呼吸精氣，獨立守神，肌肉\n若一，故能壽敝天地，無有終時，此其道生。中古之時，有至人者，淳德全道，\n和於陰陽，調於四時，去世離俗，積精全神，游行天地之間，視聽八達之外，此\n蓋益其壽命而強者也，亦歸於真人。其次有聖人者，處天地之和，從八風之理；\n適嗜欲於世俗之間，無恚嗔之心，行不欲離於世，被服章，舉不欲觀於俗，外不\n勞形於事，內無思想之患，以恬愉為務，以自得為功，形體不敝，精神不散，亦\n可以百數。其次有賢人者，法則天地，象似日月，辯列星辰，逆從陰陽，分別四\n時，將從上古，合同於道，亦可使益壽而有極時。","聖人無常心，以百姓心為心。善者吾善之，不善者吾亦善之，德善。信者吾信之，\n不信者吾亦信之，德信。聖人在天下，歙歙焉，為天下渾其心。百姓皆注其耳目，\n聖人皆孩之。（《老子》第四十九章）","如何讓你遇見我\n在我最美麗的時刻為這\n我已在佛前求了五百年\n求祂讓我們結一段塵緣\n佛於是把我化作一棵樹\n長在你必經的路旁\n陽光下慎重地開滿了花\n朵朵都是我前世的盼望\n當你走近請你細聽\n那顫抖的葉是我等待的熱情\n而當你終於無視地走過\n在你身後落了一地的\n朋友啊那不是花瓣\n是我凋零的心（席慕蓉〈一棵開花的樹〉）","依下文回答第1題至第3題：\n古者，事業不二，利祿不兼，然後諸業不相遠，而貧富不相懸也。夫\n乘爵祿以謙讓者，名不可勝舉也；因權勢以求利者，入不可勝數也。食湖\n池，管山海，芻蕘者不能與之爭澤，商賈不能與之爭利。子貢以布衣致之，\n而孔子非之，況以勢位求之者乎？故古者大夫思其仁義以充其位，不為權\n利以充其私也。（桓寬《鹽鐵論》）","依下文回答第4題至第5題：\n你我相遇於風中/彼此用手掌/小心翼翼地將這段相逢/呵護成唯一\n的序/早在遙遠的三千年前/便寫入〈蒹葭〉的傳說裡/如今/風翻開的\n每一頁/都不可圈點/是孤本，且永遠絕版（許悔之〈絕版〉）","夫人與禽各為一類，邪與正各為一類，此不可不分。乃同此血氣，同此官骸，\n同為國家之良民，同為鄉閭之善人，無分土、無分民，即子夏所言四海皆兄弟是\n也，況當共處一隅。揆諸出入相友之義，即古聖賢所謂同鄉共井者也。在字義，\n友從兩手，朋從兩肉。是朋友如一身左右手，即吾身之肉也。今試執塗人而語之\n曰：「爾其自戕爾手！爾其自噬爾肉！」鮮不拂然而怒，何今分類至於此極耶？\n（鄭用錫「勸和論」）","今農夫五口之家，其服役者，不下二人；其能耕者，不過百畝；百畝之收，不過百\n石。春耕夏耘，秋穫冬藏；伐薪樵，治官府，給徭役。春不得避風塵，夏不得避暑熱，\n秋不得避陰雨，冬不得避寒凍；四時之間，無日休息。又私自送往迎來，弔死問疾，\n養孤長幼在其中，勤苦如此。尚復被水旱之災，急政暴虐，賦斂不時。朝令而暮當\n具，有者半價而賣，亡者取倍稱之息。於是有賣田宅，鬻子孫，以償債者矣。而商賈\n大者，積貯倍息；小者坐列販賣，操其奇贏。日游都市，乘上之急，所賣必倍。\n故其男不耕耘，女不蠶織，衣必文采，食必粱肉。亡農夫之苦，有阡陌之得。\n因其富厚，交通王侯；力過吏勢，以利相傾。千里游敖，冠蓋相望，乘堅策\n肥，履絲曳縞，此商人所以兼併農人，農人所以流亡者也。（鼂錯‧論貴粟疏）","吳王欲伐荊，告其左右曰：「敢有諫者，死！」舍人有少孺子者，欲諫不敢， 則\n懷丸操彈，遊於後園，露沾其衣，如是者三旦。吳王曰：「子來！何苦沾衣如此？」\n對曰：「園中有樹，其上有蟬，蟬高居，悲鳴飲露，不知螳螂在其後也！螳螂委\n身曲跗，欲取蟬，而不知黃雀在其傍也！黃雀延頸欲啄螳螂，而不知彈丸在其\n下也！ 此三者皆務欲得其前利，而不顧其後之有患也。」吳王曰：「善哉！」\n乃罷其兵。\n（劉向《說苑.正諫》）","14-15為題組\n閱讀下列短文，回答 14-15題。\n其後，京兆尹將飾官署，余往過焉。委群材，會眾工。或執斧斤，\n或執刀鋸，皆環立嚮之。梓人左持引（長尺），右執杖（木杖）,\n而中處焉。量棟宇之任，視木之能舉，揮其杖曰：「斧！」彼執\n斧者奔而右。顧而指曰：「鋸！」彼執鋸者趨而左。俄而，斤者\n斲，刀者削，皆視其色，俟其言，莫敢自斷者。其不勝任者，怒\n而退之，亦莫敢慍焉。畫宮於堵，盈尺而曲盡其制，計其毫釐而\n構大廈，無進退焉。既成，書於上棟曰：「某年某月某日某建。」\n則其姓字也，凡執用之工不在列。余圜視大駭，然後知其術之工\n大矣。（柳宗元〈梓人傳〉）","路矣！復奚言！』罷弈請去。既出，謂虬髯曰：『此世界非公世\n界，他方可也。勉之，勿以為念！』」顯現道士由失望惆悵，轉\n而寬慰、勸勉虬髯客重新振作的心情轉折","吳王欲伐荊，告其左右曰：「敢有諫者，死！」舍人有少孺子者，欲諫不敢，\n則懷丸操彈，遊於後園，露沾其衣，如是者三旦。吳王曰：「子來！何苦沾衣如\n此？」對曰：「園中有樹，其上有蟬，蟬高居，悲鳴飲露，不知螳螂在其後也！\n螳螂委身曲跗，欲取蟬，而不知黃雀在其傍也！黃雀延頸欲啄螳螂，而不知彈丸\n在其下也！此三者皆務欲得其前利，而不顧其後之有患也。」吳王曰：「善哉！」\n乃罷其兵。\n（劉向《說苑.正諫》）","不尚賢，使民不爭；不貴難得之貨，使民不為盜\n聖人以治天下為事者也，惡得不禁惡而勸愛？故天下兼相愛則治，交相惡則亂\n賞厚而信，刑重而必。是以其民用力勞而不休，逐敵危而不卻，故其國富而兵\n強  明君制民之產，必使仰足以事父母，俯足以畜妻子。樂歲終身飽，凶年免\n於死亡，然後驅而之善","古人云：「千載一聖，猶旦暮也；五百年一賢，猶比髆也。」言聖賢之難得，疏\n闊如此。儻遭不世明達君子，安可不攀附景仰之乎？吾生於亂世，長於戎馬，流\n離播越，聞見已多；所值名賢，未嘗不心醉魂迷向慕之也。人在年少，神情未定，\n所與款狎，熏漬陶染，言笑舉動，無心於學，潛移暗化，自然似之；何況操履藝\n能，較明易習者也？是以與善人居，如入芝蘭之室，久而自芳也；與惡人居，如\n入鮑魚之肆，久而自臭也。墨子悲於染絲，是之謂矣。（顏之推〈慕賢〉）","※王天下有三重焉，其寡過矣乎！上焉者，雖善無徵；無徵，不信；不信，民弗\n從。下焉者，雖善不尊；不尊，不信；不信，民弗從，故君子之道，本諸身，徵\n諸庶民，考諸三王而不繆，建諸天地而不悖，質諸鬼神而無疑，百世以俟聖人而\n不惑。\n（《四書‧中庸》）","※自是以來，俗儒記誦詞章之習，其功倍於小學而無用；異端虛無寂滅之教，其\n高過於大學而無實。其他權謀術數，一切以就功名之說，與夫百家眾技之流，\n所以惑世誣民，充塞仁義者，又紛然雜出乎其間，使其君子不幸而不得聞大道\n之要，其小人不幸而不得蒙至治之澤，晦盲否塞，反覆沉痼，以及五季之衰，\n而壞亂極矣。\n（朱熹<大學章句序>)","※古者天下之人，愛戴其君，比之如父，擬之如天，誠不為過也。今也天下之\n人，怨惡其君，視之如寇讎，名之為獨夫，固其所也。而小儒規規焉，以君\n臣之義，無所逃於天地之間，至桀、紂之暴，猶謂湯、武不當誅之，而妄傳\n伯夷、叔齊無稽之事；視兆人萬姓崩潰之血肉，曾不異夫腐鼠。豈天地之大，\n於兆人萬姓之中，獨私其一人一姓乎？\n（黃宗羲<原君>)","※天子之所是未必是，天子之所非未必非。天子亦遂不敢自為非是，而公其非是\n于學校。是故，養士為學校之一事，而學校不僅為養士而設也。\n（黃宗羲《明夷待訪錄》（學校）)","※古者，以天下為主，君為客，凡君之所畢世而經營者，為天下也。今也，以君\n為主，天下為客，凡天下之無地而得安寧者，為君也。\n（黃宗羲《明夷待訪錄》（原君）)","※石井\n漫將遺事訪延平，故老酸辛說有明。五馬江中沙已漲，餘潮猶自作軍聲。不信\n芝龍為豪傑，咸知有子是英雄。艸雞未應真王讖，俯仰江山落照中。\n《賴和全集‧漢詩卷》","卷上》）/置於市，賈十倍，人爭「鬻」之，予貿得其一（劉基〈賣柑者言〉）\nBDDAC BCBDC CDBCA","相同的選項是：\n(A）「狙」擊/崩「殂」 (B）結「痂」/「袈」裟\n(C）標「籤」/一語成「讖」 (D）「溽」暑/深耕易「耨」\n，無情巨浪吞噬數十萬人的生命，倖存的災民除遭親人離散之\n痛，尚得面對滿目瘡痍的家園，處境極為艱難","12-13為題組\n請先閱讀下列短文，然後回答以下問題：\n龐恭與太子質於邯鄲，謂魏王曰 ：「今一人言巿有虎，王信之\n乎？」曰：「不信。」「二人言巿有虎，王信之乎？」曰：「不信。」\n「三人言巿有虎，王信之乎？」王曰：「寡人信之。」龐恭曰：「夫\n巿之無虎也明矣，然而三人言而成虎。今邯鄲之去魏也遠於巿，議\n臣者過於三人，願王察之。」龐恭從邯鄲反，竟不得見。","14-15為題組\n請先閱讀下列詩歌，然後回答以下問題：\n你如果/如果你對我說過/一句一句/真純的話/我早晨醒來\n/我便記得它\n年少的歲月/簡單的事/如果你說了/一句一句/淺淺深深/\n雲飛雪落的話\n關切是問/而有時/關切/是/不問\n倘或一無消息/如沈船後靜靜的/海面，其實也是/靜靜的記得\n倘或在夏季之末/秋季之初/寫過一兩次/隱晦的字/影射那偶\n然/像是偶然的/\n落雨──也是記得","/不要問我為什麼/我們承認吧/我們的愛情已遠離\nDBCAD DBABB DCADC CDADC","以下是蘇軾貶謫惠州時期寫給蘇轍的一封書信，請閱讀後回答下列\n問題：\n「惠州市井寥落，然猶日殺一羊，不敢與仕者爭買，時囑屠者\n買其脊骨耳。骨間亦有微肉， 熟煮熱漉出（自注：不乘熱出，則抱\n水不乾），漬酒中，點薄鹽炙微燋食之。終日抉剔，得銖兩於肯綮之\n間，意甚喜之，如食蟹螯；率數日輒一食，甚覺有補。子由三年食\n堂庖，所食芻豢，沒齒而不得骨，豈復知此味乎？戲書此紙遺之，\n雖戲語，實可施用也。然此說行，則眾狗不悅矣。」（蘇軾〈與子由\n書〉）","不自得\n甲、宋之野人耕而得玉，獻之司城子罕，子罕不受。野人請曰：「此\n野人之寶也，願相國為之賜而受之也。」子罕曰：「子以玉為\n寶，我以不受為寶。」故宋國之長者曰：「子罕非無寶也，所\n寶者異也。」（《呂氏春秋.紀部.異寶》）\n乙、解扁為東封，上計而入三倍，有司請賞之。文侯曰：「吾土地\n非益廣也，人民非益眾也，入何以三倍？」對曰：「以冬伐木\n而積之，於春浮之河而鬻之。」文侯曰：「民春以力耕，夏以\n強耘，秋以收斂；冬間無事，又伐林而積之，負軛而浮之河，\n是用民不得休息也。民以敝矣，雖有三倍之入，將焉用之？」\n（《淮南子.人間訓》）","力行以待取，其自立有如此者\n請先閱讀下列短文，然後回答下列問題：\n「她們往往寧願以一趟計程車費，換得小獸可以快樂尖叫的\n坐十幾次電動車，不然或可換取一份各速食店所推出的夏日套\n餐，可在冷氣間消磨好久，任小獸玩那蕃茄醬或可樂裡的冰塊或\n套餐所附贈的玩具，暫時不用纏母獸 ，母獸可發呆或偷偷打量張\n望陌生的周圍其他人，好奇那些無聊情話說不完的年輕男女，年\n紀差距與她最近卻是她最感遙遠的一群；也可能她剛剛狠心又幫\n小獸買了一雙史努比鞋（鞋並不貴， 但問題是小獸已有四、五雙\n了），以為一趟計程車費可以抵銷一半鞋價......等等，但請不要\n誤會她們是貧窮、所以必須斤斤計較的一群。\n其實，在並不很久以前，她們亦曾經是一群以一套當季流行\n服裝、一份下午茶、一本時尚雜誌作為貨幣計算單位的族群。這\n是不是拉近了一點你與她們的距離， 使你漸漸想起她們也曾經是\n人，曾經如同你目前已熱烈追求、神祕莫測的女孩。」（朱天心\n〈袋鼠族物語〉）","的女孩」，強調一般人容易把當媽媽的人侷限於「母親」角色，\n忽略她們也曾有豐富的人生面向","太公其上，告漢王曰：今不急下，吾烹太公。漢王曰：吾與\n項羽俱北面受命懷王，曰：約為兄弟。吾翁即若翁；必欲烹\n而翁，則「幸」分我一杯羹","在國外跑了一圈，回到臺灣，才發現臺灣的山水真美。恆春豔藍的晴空；嘉\n南一望無際的平原；東部縱深陡急的谿谷，在龐然巨石間流竄；南迴公路一帶，\n則是層巒交疊，一片蒼綠；蘭陽多雨，山嵐煙障，比起南宋畫中的江南，有過之\n而無不及。\n三百年來，移民陸續開創它的歷史，學者用「婆娑之洋，美麗之島」來歌詠\n這塊土地，然而在繪畫上，仍是一片有待開發的新山川。\n日據時代，少數畫家如陳澄波等，畫出了一部分的臺灣；洪瑞麟以礦工為主\n題的作品，則真正掌握了臺灣極富生命力的線條；至於黃土水所雕塑的水牛群\n像，在靜靜的香蕉林中，透著彷彿是夏夜的清涼，彷彿繞飛的蚊蚋，有青蛙的咕\n嘓聲..\n少數幾個畫家讓我感覺到了臺灣，可惜大部分的人似乎在中國或西方的技巧\n中迷失了，沒能深入生活，在真實的風景裡求證，結果這些技法反而成了瑣碎的\n累贅，遮掩了臺灣本然的面貌。\n畫家最後需要的不只是技巧，而是超越在技巧之上，對土地的真實情感吧！\n──改寫自蔣勳《歡喜讚歎》","宣王好射，說人之謂己能用強也，其實所用不過三石。以示左右，左右皆引試之，\n中關而止，皆曰：「不下九石，非大王孰能用是！」宣王悅之。然則宣王用不過\n三石，而終身自以為九石。三石實也，九石名也。宣王悅其名而喪其實。\n──《尹文子‧大道上》","庾公乘馬有的盧，或語令賣去。庾云：「賣之必有買者，即當害其主。寧有不安\n己而移於他人哉？昔孫叔敖殺兩頭蛇以為後人，古之美談。效之，不亦達乎？」\n──《世說新語.德行》","河之魚，有豚其名者，游於橋間，而觸其柱。不知遠去，怒其柱之觸己也，則張\n頰植鬣，怒腹而浮於水，久之莫動。鳶飛過而攫之，磔其腹而食之。\n──《柳河東集.附錄卷下》","「脫靶」是許多射箭選手都有的經驗，但發生在關鍵時刻，卻會造成勝負逆\n轉的結果。這次強弩隊與神箭隊的冠亞軍爭奪戰，強弩隊與神箭隊互有領先，輪\n到神箭隊的王牌射手后羿登場，后羿射出的前兩枝箭都正中紅心，獲得滿堂彩；\n最後一箭只要落在靶上便能替神箭隊拿下冠軍。\n此時，神箭隊無不額手稱慶，后羿更是洋洋得意，一度停頓後，最後一箭出\n手卻是無聲無息。當大家在箭靶上看不到箭時，「脫靶」聲一出，賽場出現兩極\n化反應。\n強弩隊是擁抱慶祝，神箭隊是滿臉愕然，難以想像是怎麼發生的。","以下短文節錄自某產品說明書，請仔細閱讀並回答下列問題：\n電池充電座一般可分為 A、B、C、D 等四種類型，並且有單雙槽之分。所謂\nA 型是指充電座具有液晶顯示面板，可清楚顯示電池的充電狀況；B 型則是以燈\n號顯示充電狀況；C 型雖無法顯示充電狀況，卻有快速充電、便於攜帶的優點。\n這三者都必須搭配專屬的變壓器供應電源，不可隨意更換變壓器。國內電壓規格\n為 110V，所以若有出國需求且須充電時，必須了解當地的電壓規格，並選用合\n適的變壓器，才能有效供應電力。此外，D 型可自動調節電壓，沒有更換變壓器\n的問題，也是另一項選擇。",". ( D )86.「王者不卻眾庶，故能明其德。」「不卻眾庶」意謂王者： (A）不畏\n懼人民 (B）不犧牲人民利益 (C）不希望國內人口太多 (D）不拒絕各國的人民\n來歸。","世皆稱孟嘗君能得士，士已故歸之，而卒賴其力，以脫於虎豹之秦。嗟乎！孟嘗\n君特雞鳴狗盜之雄耳，豈足以言得士？不然，擅齊之彊，得一士焉，宜可以南面\n而制秦，尚何取雞鳴狗盜之力哉？夫雞鳴狗盜之出其門，此士之所以不至也。（王\n安石<讀孟嘗君傳>)","謝公與人圍棋，俄而謝玄淮上信至。看書竟，默然無言，徐向局。\n客問淮上利害，答曰：「小兒輩大破賊。」意色舉止，不\n異於常。\n既罷，還內，過戶限，心甚喜，不覺屐齒之折。\n──〈晉書‧謝安傳〉\n謝公：即謝安戶限：門檻","悽悽去親愛，泛泛入煙霧。歸棹洛陽人，殘鐘廣陵樹。\n今朝為此別，何處還相遇。世事波上舟，沿洄安得住。\n──韋應物\n〈初發揚子寄元大校書〉\n泛泛：上浮\n貌洄：水流迴旋貌\n揚子：即揚子江，近江蘇鎮江的一段元大：\n即元結","毛毛習作「遊二郎廟」，文章如下：\n夫二郎廟者，二郎之廟也。二郎者，三郎之兄，大郎之弟\n而老郎\n之子也。人云廟外有一樹，或謂廟在樹之前，或謂樹在廟\n之後；\n或謂廟在樹之左，或謂樹在廟之右；某謂樹在廟之後與\n右，人則\n謂廟在樹之前與左。此即廟與樹也。","以下為郵局劃撥單上的注意事項，請仔細閱讀並回答下列問題：\n（一）帳號、戶名及寄款人姓名、通訊處請詳細填明，以免誤寄。\n抵付票據\n之存款，務請於交換前一天存入。\n（二）每筆存款至少須在新臺幣十元以上，且限填至元位為止。\n（三）倘金額塗改時請更換存款單重新填寫。\n（四）本存款單不得黏貼或附寄任何文件。\n（五）本存款金額業經電腦登帳後，不得申請撤回。\n（六）本存款單以機器分揀，請勿折疊。帳戶如需自印存款單，各\n欄文字及\n規格必須與本單完全相符。如有不符，各局應婉請寄款人\n更換郵局印\n製之存款單填寫，以利處理。\n附註：通訊欄只限說明與本次劃撥相關的事項，不得作書信使\n用。","上的金額如有錯誤，可以塗改修正。\n據說上古時，有兩兄弟，一個叫神荼，一個叫鬱壘，住在\n東海度朔山\n上，兩人常站在大桃樹下，檢閱百鬼。對於無故害人的惡鬼，就用繩\n索綁起\n來，去餵老虎。\n後來，人們或用兩塊桃木板立在門旁，或用紙板畫上神荼、\n鬱壘的像，\n用來鎮邪，稱為門神。這就是桃符的來歷。\n到五代時，後蜀國君孟昶才開始在桃符上書寫聯語。有一\n年除夕，他親\n自題寫了一副春聯：「新年納餘慶；佳節號長春。」貼在臥室門側，\n這就是\n我國最早的春聯。\n明太祖建都金陵後，下旨命令所有的公卿士庶，除夕時都\n要在門上貼春\n聯。太祖還微服出來觀賞。經他提倡，貼春聯的人更多了。從此，相\n沿成\n俗，流傳至今。\n──改寫自民間故事","黑色的火車穿過黑漆漆的隧道\n撞上不知名的小站的夜\n夜就變得更夜了\n站長手上的粉筆被黑煙染成炭筆\n在夜空的黑板上寫黑黑的字：\n「×時×分，一列沒有車次的禍車\n戴著不詳的貨霧，從火車時瞌表外\n闖過夢的瓶交道，進入笨站... ... 」\n路過的精靈看到打瞌睡的他\n黑暗中寫錯了許多字，好心地\n拿起立可白，幫他把錯字塗掉\n我們於是在天空中看見一些閃爍的星\n──陳黎〈夏夜微笑──立可白的夜〉","二、閱讀測驗\n蘇東坡、黃山谷、佛印三人在杭州，日日飲食徵逐，惟佛印食量之大，尚過於\n魯智深，酒餚輒為所先盡，坡、谷苦之。一日相與謀曰：「我們何不瞞著這老禿，\n樂一天呢？」乃悄蹴一舟，背佛印，備小酌以遊西湖。不料佛印神通廣大，早偵知\n之，瞷二人之未登舟也，先登而自匿於船板下，囑舟子勿洩焉。既而坡、谷至，泛\n舟容與，放乎中流。時月夕也，坡謂谷曰：「老禿不在座，使人整暇，我輩何不淺\n斟緩酌，行一雅令，以消永夕？」谷沉吟一晌曰：「浮萍撥開，游魚出來；得其所\n哉！得其所哉！」坡擊節嘆賞，旋應令曰：「浮雲撥開，明月出來；天何言哉！天\n何言哉！」谷方欲擊節，詎料佛印已搔著心癢，按捺不住，即在艙下，一面開口，\n一面昂頭，大聲喊道：「浮板撥開，佛印出來；人焉廋哉！人焉廋哉！」遂據觴奪\n箸，頃刻之間，盤盂四大皆空。（改寫自梁啟超《飲冰室文集‧雜著‧笑林》）","▲閱讀下文，回答29-31題國破山河在，城春草木深。感時花濺淚，恨別鳥驚心。烽\n火連三月，家書抵萬金。白頭搔更短，渾欲不勝簪。（杜甫〈春望〉）","四言敝而有楚辭，楚辭敝而有五言，五言敝而有七言，古詩敝而有律絕，律絕\n敝而有詞。蓋文體通行既久，染指遂多，自成習套。豪傑之士，亦難於其中自出新\n意，故遁而作他體，以自解脫。一切文體所以始盛終衰者，皆由於此。 （王國維《人\n間詞話》）","我乃曠野裡獨來獨往的一匹狼。\n不是先知，沒有半個字的嘆息。\n而恆以數聲悽厲已極之長嗥，\n搖撼彼空無一物之天地，\n使天地戰慄如同發了瘧疾；\n並刮起涼風颯颯的，颯颯颯颯的：\n這就是一種過癮。（ 紀弦〈狼之獨步〉）","我熱愛鄉村的冬天。我無法理解富翁們在一年當中最不適於舉行舞會、講究穿\n著和奢侈揮霍的季節，將巴黎當作狂歡的場所。大自然在冬天邀請我們到火爐邊，\n享受天倫之樂；而且正是在鄉村，才能領略這個季節罕見的明朗陽光。在我國的大\n都市裡，臭氣熏天的爛泥，幾乎永無乾燥之日；但在鄉下，一片陽光或者刮幾小時\n風，就能使空氣清新，地面乾爽。可憐的城市工人對此十分瞭解，他們滯留在這個\n垃圾場裏，實在是由於無可奈何；但我們的富翁們卻過著人為的、悖謬的生活，違\n背大自然的安排。英國人比較明智，他們到鄉下別墅裏過冬。（喬治‧桑〈冬天之\n美〉；喬治‧桑，法國十九世紀女作家）","復奚言！』罷弈請去。既出，謂虬髯曰：『此世界非公世界，他方可\n也。勉之，勿以為念！』」顯現道士由失望惆悵，轉而寬慰、勸勉虬\n髯客重新振作的心情轉折","其上，告漢王曰：今不急下，吾烹太公。漢王曰：吾與項羽俱北\n面受命懷王，曰：約為兄弟。吾翁即若翁；必欲烹而翁，則「幸」\n分我一杯羹","寶釵兩人聯手施計，挑撥離間，致使寶、黛情海生變，黛玉終憂\n憤成疾，香消玉殞，寶玉則看破紅塵，修道成仙\n14-15為題組\n閱讀下列文字後，回答 14-15題。\n順治間，滕、嶧之區，十人而七盜，官不敢捕。後受撫，邑宰別之為「盜\n戶」。凡值與良民爭，則曲意左袒之，蓋恐其復叛也。後訟者輒冒稱盜戶，\n而怨家則力攻其偽，每兩造具陳，曲直且置不辨，而先以盜之真偽，反復\n相訐，煩有司稽籍焉。適官署多狐，宰有女為所惑，聘術士來，符捉入瓶，\n將熾以火。狐在瓶內大呼曰：「我盜戶也！」聞者無不匿笑。（《聊齋志異‧\n盜戶》）","16-17為題組\n閱讀下列文字後，回答 16-17題。\n甲、王太尉不與庾子嵩交，庾卿之不置。王曰：「君不得為爾！」庾曰：\n「卿自君我，我自卿卿；我自用我法，卿自用卿法。」（《世說新語‧\n方正》）\n乙、王安豐婦，常卿安豐。安豐曰：「婦人卿婿，於禮為不敬，後勿復爾！」\n婦曰：「親卿愛卿，是以卿卿；我不卿卿，誰當卿卿？」遂恆聽之。\n（《世說新語‧惑溺》）","「讀」和「寫」需要用到大腦的視覺（如果是盲人點字則用觸覺）區域，加上細緻的手指控\n制以運用各種書寫工具。在大腦威尼基區的後上方，有一個地方叫做「角迴」，它\n位於枕葉、頂葉、顳葉三者交會處，是將視覺文字辨識結果送往語言區的要衝；若\n這個地方受傷，會嚴重影響讀寫能力；假如只是附近地方受傷，病人或許仍可以寫，\n但不能默讀自己所寫的東西。有一位病人J.O.可以聽寫，卻無法默讀自己所寫的字，\n然而當她大聲唸出來，她聽到字音之後，便知道字的意思了。她說：「我看到字，\n但意義沒有跟著出現。」這是因為受損，所以字的視覺訊息無法對應到它的意義上\n去。（ 改寫自Rita Carter著，洪蘭譯，《大腦的秘密檔案》第六章，〈跨越演化的\n鴻溝〉）"],"questions":[{"s":0,"n":1,"q":"朵思〈士林夜市〉：「鹽酥雞是沒有屬性的/蜜餞有宜蘭的風光」，「沒有屬性」意謂：","o":["沒有特殊口味","沒有特定產地","沒有固定客源","沒有特製招牌"],"a":[2]},{"s":0,"n":2,"q":"報載「中山高子夜發生大車禍」，「子夜」相當於什麼時間？","o":["晚上九點到晚上十一點","晚上十一點到凌晨一點","凌晨一點到凌晨三點","凌晨三點到五點"],"a":[1]},{"s":0,"n":3,"q":"「好鳥枝頭亦朋友，落花水面皆文章」的涵義，與下列何者最接近？","o":["萬物靜觀皆自得","退一步海闊天空","行萬里路勝讀萬卷書","讀書破萬卷，下筆如有神"],"a":[0]},{"s":0,"n":4,"q":"下列各組詞語「」內的字，所指顏色相近的是：","o":["「黔」首黎民/「翠」消紅減","「鶴」髮童顏/天地「玄」黃","「紫」袍玉帶/白冠「縞」衣","「丹」楓映水/「赤」膽忠心"],"a":[3]},{"s":0,"n":5,"q":"下列 "s":0,"n":84,"q":"下列修辭技巧何者錯誤？","o":["晚來天欲雪，能飲一杯無/設問法","桃李春風一杯酒，江湖夜雨十年燈/對偶法","崑山玉碎鳳凰叫，芙蓉泣露香蘭笑/摹寫之聽覺法","有情芍藥含春淚，無力薔薇臥曉枝/譬喻法"],"a":[3]},{"s":0,"n":85,"q":"下列文句中，「」內的字，意義相同的是：","o":["人「而」無信，不知其可也/吾日三省吾身，為人謀「而」不忠乎？","伯夷、叔齊不念舊惡，怨是「用」希/先王有至德要道，以順天下，民「用」和睦，上下無怨","楚莊王伐鄭，鄭伯肉袒牽羊以「逆」/堯舜之治，必本於人情，不立異以為高，不「逆」情以干譽","居上而驕則亡，為下而亂則「刑」，在醜而爭則兵/愛敬盡於事親，而德"],"a":[1]},{"s":0,"n":86,"q":"下列文句中，「」內的詞語使用正確的選項為：","o":["文化中心主任新官上任，在既有基礎上「踵事增華」，獲得藝文界的一致好評","母親做菜的手藝高超，經過一番「折衝尊俎」，總能擺出一桌色香味全的美食","接到詐騙電話，切勿驚慌，一定要保持鎮靜，與歹徒「虛左以待」，再報請警方處理","劉先生為人「色厲內荏」，不僅態度嚴厲，而且內心狠毒，令人畏懼"],"a":[0]},{"s":0,"n":87,"q":"下列柬帖用語的說明，正確的是：","o":["「敬使」是指付送禮人之小費","「踵謝」是指親自下跪答禮","「文定」是指結婚之酒席","「桃觴」是指謝師宴"],"a":[0]},{"s":0,"n":88,"q":"孔子曳杖而歌曰：「泰山其頹兮，梁木其壞乎，哲人其萎乎」，此歌之意在感嘆：","o":["時光飛逝","天地異變","賢人喪亡","惡人作亂"],"a":[2]},{"s":0,"n":89,"q":"「誇飾」是文學作品常使用的寫作手法，下列選項中，未使用誇示法的是：","o":["五臟六腑裏，像熨斗燙過，無一處不伏貼，三萬六千個毛孔，像吃了人參果，無一個毛孔不暢快","今也天下之人怨惡其君，視之如寇讎，名之為獨夫，固其所也","見二蟲鬥草間，觀之，興正濃，忽有龐然大物，拔山倒樹而來，蓋一癩蛤蟆","歌吹為風，粉汗為雨，羅紈之盛，多餘隄畔之草"],"a":[1]},{"s":0,"n":90,"q":"下列那一句中「為」字的意義，和其他三者不同？","o":["仲尼曰：「始作俑者，其無後乎！」「為」其象人而用之也（《孟子‧梁惠王》）","神仙之說，所謂「為」蛇畫足（全祖望<梅花嶺記>)","余思粥，擔者即「為」買米煮之，果腹而歸（沈復<閒情記趣>)","善「為」我辭焉（《論語‧雍也篇》）"],"a":[0]},{"s":0,"n":91,"q":"下列敘述何者正確？","o":["「他寫這篇文章，只為文過飾非而已。」句中兩個「文」字，音同義異","「媽媽對我常去同學家叨擾，嘮叨不已。」句中兩個「叨」字，音義皆異","「這棟大樓如期興建完成，業主非常高興。」句中兩個「興」字，音義皆同","「桂冠詩人的作品是一時之冠。」句中兩個「冠」字，音異義同"],"a":[1]},{"s":0,"n":92,"q":"下列各組「」內的字，所指色系完全不同的是：","o":["「碧」海青天/金魄「翠」玉","青紅「皂」白/「玄」端章甫","「縞」衣白冠/晨若塗「朱」","「緇」衣青燈/「黔」首黎民"],"a":[2]},{"s":0,"n":93,"q":"下列各組「」內的字，意義前後相同的是：","o":["縱一葦之所「如」，凌萬頃之茫然/聲聲宛轉，「如」新鶯出谷","會「數」而禮勤，物薄而情厚/勝負之「數」，存亡之理","寄身於翰墨，「見」意於篇籍/時窮節乃「見」，一一垂丹青","如得其情，則哀「矜」而勿喜/「矜」寡孤獨廢疾者，皆有所義"],"a":[2]},{"s":0,"n":94,"q":"「水色山光皆畫本/□□□□是詩情」—這副懸掛在庭院的對聯，□□□□處最適合填入的是：","o":["花香鳥語","萬紫千紅","樓前花草","星辰日月"],"a":[0]},{"s":0,"n":95,"q":"下列文句，沒有錯別字的是：","o":["他做事一向率性而為，從不按步就班，令人惋惜","每次問他，他總是模棱兩可，沒有肯定的答案","這棟別墅美輪美奐，路過的人都忍不住贊嘆","年輕人是社會的中流柢柱，凡事不應該自暴自棄"],"a":[1,2]},{"s":0,"n":96,"q":"下列文句「」中成語的使用，完全正確的是：","o":["影視明星在記者會中，提起自己的拍片計畫，說得頭頭是道；當被問及緋聞事件時，常常閃爍其詞，「諱莫如深」","動物園中的無尾熊，每當見到尤加利樹，趕忙「行將就木」，準備飽餐一頓", 篤厚，尤能□□□□，從不說人是非，所以頗受鄉人稱譽。」句中□□□□，應填入那一個成語：","o":["周於世用","枉道速禍","嘉善矜惡","不顧流俗"],"a":[2]},{"s":2,"n":13,"q":"「由於經濟不景氣，公司正在裁員，所以他懷著□□□□的心情，全力以赴，希望能保住自己的工作。」句中□□□□，應填入那一個成語：","o":["臨淵履冰","補弊扶偏","任重道遠","苗而不秀"],"a":[0]},{"s":2,"n":14,"q":"下列引號中的詞語，用法正確的是：","o":["李家姐妹手足情深，堪稱一對「賢伉儷」","李家小姐今日歸寧，喜宴上李先生因得一「東床快婿」，而喜上眉梢","「尊翁」年事已高，我卻羈旅異鄉，所以常憂心會有子欲養而親不待的遺憾","張君與我久別重逢，想當年我們可是人人稱羨的「賢喬梓」呢！"],"a":[1]},{"s":2,"n":15,"q":"下列各引號中的字音，讀音相同的是：","o":["「皈」依佛門；沿門托「缽」","「覬」覦之心；「愷」切之詞","病入膏「肓」；「盲」目信從","一丘之「貉」；「閤」家光臨"],"a":[3]},{"s":2,"n":16,"q":"下列字詞，何者完全無誤：","o":["破釜沈舟","忸妮不安","嘔心歷血","裕蓋瀰彰"],"a":[0]},{"s":2,"n":17,"q":"「母親的臉是□□□□的滿月無論汗水如何□□無論陽光或寒風，如何欺凌仍然□□，仍然明朗」~節引自吳晟：〈臉〉上列詩句的缺空處，最適合填入選項是：","o":["支離破碎；澆灌；明亮","圓圓滿滿；侵蝕；豐潤","無可言喻；流淌；堅強","未曾或忘；侵襲；嫵媚"],"a":[1]},{"s":2,"n":18,"q":"下列何者不適用於輓聯：","o":["口若懸河","駕鶴西歸","痛失英才","母範長存"],"a":[0]},{"s":2,"n":19,"q":"下列「」中的字義，何者為是：","o":["過勿「憚」改：同「彈」字，為彈劾之意","「踰矩」：超過了規定的時間","身無「長」物：多餘之意","「弄璋之喜」：恭喜他人喜獲殊榮之意"],"a":[2]},{"s":2,"n":20,"q":"「莫聽穿林打葉聲，何妨吟嘯且徐行。竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生。料峭春風吹酒醒，微冷，山頭斜照卻相迎。回首向來蕭瑟處，歸去，也無風雨也無晴。」（蘇軾〈定風坡〉）下列何者為非：","o":["「竹杖芒鞋輕勝馬，誰怕？一蓑煙雨任平生。」指出面對風雨，即使忘了帶雨具，仍可本著遊戲人間、無視他人存在的態度走完全程","由「莫聽穿林打葉聲，何妨吟嘯且徐行」，我們可以看出東坡神閑氣定，不為外界變幻所干擾，由此更顯其瀟灑自若的生命境界","「料峭春風吹酒醒，微冷，山頭斜照卻相迎」寓意相近於：「山窮水盡疑無路，柳暗花明又一村」","全詞表現出東坡達觀自得的性格，且以途中遭雨的境況，隱喻人生路途之風雨波折，及東坡據以自處的心態"],"a":[0]},{"s":2,"n":21,"q":"下列各句中，何者沒有「物是人非」之感？","o":["同是天涯淪落人，相逢何必曾相識","吳宮花草埋幽徑，晉代衣冠成古丘","昔人已乘黃鶴去，此地空餘黃鶴樓","舊時王謝堂前燕，飛入尋常百姓家"],"a":[0]},{"s":2,"n":22,"q":"下列何者最能表達戰士勇往直前，死而無悔的決心？","o":["車錯轂兮短兵接","天時墜兮威靈怒","出不入兮往不反","旌蔽日兮敵若雲"],"a":[2]},{"s":2,"n":23,"q":"下列各組詞語，沒有錯別字的是：","o":["涓滴歸公、為人作嫁、百步穿楊","甚囂塵上、竭澤而漁、無與輪比","率爾操觚、工成名就、桃之夭夭","浩大喜功、深文周納、甘之如飴"],"a":[3]},{"s":2,"n":24,"q":"下列「」中，以「二數相乘」的手法表示數量的詞語是：","o":["「二三」其德","「三五」之夜","「九五」之尊","「九九」登高"],"a":[1]},{"s":2,"n":25,"q":"下列文句，何者最能明確闡述「不以物喜，不以己悲」的涵義？","o":["自其變者而觀之，則天地曾不能以一瞬；自其不變者而觀之，則物與我皆無盡也（蘇軾<赤壁賦>)","士生於世，使其中不自得，將何往而非病？使其中坦然，不以物傷性，將何適而非快（蘇轍<黃州快哉亭記>)","禽鳥知山林之樂，而不知人之樂；人知從太守遊而樂，而不知太守之樂其樂也（歐陽脩<醉翁亭記>)","蒼然暮色，自遠而至，至無所見，而猶不欲歸。心凝形釋，與萬化冥合（柳宗元<始得西山宴遊記>)"],"a":[0]},{"s":2,"n":26,"q":"下列各文句成語的使用，正確的是：","o":["春天繁花盛開，公園裡人群椿萱並茂，一片花木扶疏的景象","出身蓬戶甕牖的人，只要勤奮不懈，一樣可以飛黃騰達","為使居家生氣盎然，插花時需把握薰蕕同器的道理","政府官員一旦視民如傷，將導致國家哀鴻遍野，民不聊生"],"a":[1]},{"s":2,"n":27,"q":"「關於史書的體例，編年體以年次為序，編列史事；紀傳體以□為主；紀事本末以□為主，使紀傳、編年貫通為一」。這段話□中依序當為：","o":["人物傳記/地理","經濟/典章制度","典章制度/地理","人物傳記/事件"],"a":[3]},{"s":2,"n":28,"q":"為古書配上可以概括其內容的新標題，是一種「古典新詮」的作法，藉此可以拉近讀者閱讀的視角。如果你要製作「古籍推廣」活動的海報，請問下列那一個標題與書的內容最不相符？","o":["《荀子》──人性的批判","《楚辭》──澤畔的悲歌","《封神榜》──東周英雄傳奇","《韓非子》──國家的秩序"],"a":[2]},{"s":2,"n":29,"q":"甲寫信給乙，信上的提稱語使用「壇席」二字，由此可判斷此二人的關係應為：","o":["老師與學生","父親與兒子","醫師與病患","長官與部屬"],"a":[0]},{"s":2,"n":30,"q":"下列各組詞語，不完全適合用於評論文章者為：","o":["爐火純青/片言折獄/鐵畫銀鉤","鞭辟入裏/顛撲不破/自出機杼","絕妙好辭/流水行雲/妙筆生花","條分縷析/畫龍點睛/字字珠璣"],"a":[0]},{"s":2,"n":31,"q":"「朱門酒肉臭，路有凍死骨」，句中「朱門」指富貴之家，在修辭上屬借代用法。下列各組文句「」中的詞語，都使用借代的是：","o":["邑人奇之，稍稍「賓客」其父/何以解憂？唯有「杜康」","潯陽地僻無音樂，終歲不聞「絲竹」聲/六宮「粉黛」無顏色","濃眉大眼，「虎額」龍準/沙鷗翔集，「錦鱗」游泳","居「廟堂」之高，則憂其民/浮光躍金，靜影「沉璧」"],"a":[1]},{"s":2,"n":32,"q":"下列「」內的詞語，皆是書信用語，用法合宜的選項是：","o":["較正式的信函中，對人稱自己的長輩，可用「家」（如家父）；稱他人長輩可用「令」（如令堂）；稱自己的晚輩，宜用「舍」（如舍侄）","稱對方女兒為「令媛」、「令倩」、「令千金」","用於平輩的提稱語，可用「惠鑒」、「足下」、「膝下」","受信人的稱呼如「林校長」、「趙先生」的「校長」、「先生」應用較小字體寫在右側"],"a":[0]},{"s":2,"n":33,"q":"「子謂顏淵曰：『用之則行，舍之則藏，惟我與爾有是夫！』」句中「用之則行，舍之則藏」的意思與下列何句相同？","o":["窮則獨善其身，達則兼善天下","學如不及，猶恐失之","見善如不及，見惡如探湯","君子成人之美，不成人之惡"],"a":[0]},{"s":2,"n":34,"q":"「操千曲而後曉聲，觀千劍而後識器」意謂：","o":["以管窺天","井底之蛙","夏蟲語冰","見多識廣"],"a":[3]},{"s":2,"n":35,"q":"〈鴻門之宴〉中，樊噲言：「大行不顧細謹，大禮不辭小讓」意謂：","o":["庸德之行，庸言之謹；有所不足，不敢不勉；有餘不敢盡","處事當以大局著眼，無須拘泥小節","泰山不讓土壤，故能成其大；河海不擇細流，故能就其深","知其雄，守其雌，為天下谿"],"a":[1]},{"s":2,"n":36,"q":"下列「」內的詞語，皆是生活中常用的祝頌語，用法合宜的選項是：","o":["「瓜瓞綿綿」用於祝賀農產豐收","「椿萱並茂」用於祝賀子孫滿堂","「弄瓦徵祥」用於祝賀生男","「近悅遠來」用於祝賀飯店或旅社開幕"],"a":[3]},{"s":2,"n":37,"q":"杜牧〈山行〉：「霜葉紅於二月花。」意謂：","o":["春花賽楓紅","秋霜照楓紅","楓紅勝春花","楓葉紅花相映照"],"a":[2]},{"s":2,"n":38,"q":"下列那一個成語與「緣木求魚」的意思最為相近？","o":["黔驢技窮","指鹿為馬","刻舟求劍","踏雪尋梅"],"a":[2]},{"s":2,"n":39,"q":"下列那一選項的「之」字作動詞用？","o":["陳涉少時，嘗與人傭耕，輟耕之壟上","悵恨久之，曰：「茍富貴，勿相忘」","時諸將之徇地者，不可勝數","陳涉太息曰：「嗟乎！燕雀安知鴻鵠之志哉！」"],"a":[0]},{"s":2,"n":40,"q":"白居易〈與元微之書〉：「況以膠漆之心，置於胡越之身。」意在強調白居易和元稹二人：","o":["形影不離， "o":["蜩螗，是蟬的別稱，鳴聲嘹亮，因此「國事蜩螗」，就是以蟬鳴聲比喻國事紛擾不安","蚍蜉，是指一種大螞蟻，力量微弱，因此「蚍蜉撼樹」是比喻不自量力","夏蟲是指只存活於夏季的蟲類，因此「夏蟲不可語冰」，指的是不要強人所難","蝤蠐是天牛的幼蟲，色白豐美，因此「領如蝤蠐」是用以形容美女的頸項潔白"],"a":[2]},{"s":2,"n":85,"q":"1「黔」首黎民/青紅「皂」白 2「絳」脣玉貌/「赤」膽忠心3「赭」衣滿道/「緇」衣羔 4「紫」氣東來/「丹」楹刻桷5「皓」首窮經/「縞」衣白冠 6天地「玄」黃/「白」駒過隙上列各組詞語「」內的字，所指顏色相同或相近的選項是：","o":["1 2 5","2 3 6","3 4 5","1 4 6"],"a":[0]},{"s":2,"n":86,"q":"1「願天下有情人，都成了眷屬；是前生註定事，莫錯過姻緣。」2「海靜波恬， 共仰神光普照；民安物阜，咸沾德被無私。」3「明月皓無邊，安排鐵板銅琵， 我欲唱大江東去；春風睡正美，迢遞珠崖瓊島，更誰憐孤鶴南飛。」4「尊王言必稱堯舜，憂世心同切孔顏。」依內容分析，此四聯所指涉的依序是：","o":["月下老人/觀音菩薩/關漢卿/孔子","土地公/媽祖娘娘/蘇東坡/顏回","月下老人/媽祖娘娘/蘇東坡/孟子","土地公/觀音菩薩/關漢卿/子貢"],"a":[2]},{"s":2,"n":87,"q":"甲：「昏旦變氣候，山水含清暉。清暉能娛人，遊子憺忘□。」（謝靈運）乙：「白日麗飛甍，參差皆可見。餘霞散成綺，澄江靜如□。」（謝朓）丙：「疾風沖塞起，沙礫自飄揚。馬毛縮如蝟，角弓不可□。」（鮑照）以上詩文，最適合填入空格的字詞依序為：","o":["返/月/開","歸/月/開","返/樹/張","歸/練/張"],"a":[3]},{"s":2,"n":88,"q":"文中「亡者取倍稱之息」的意思是：","o":["逃稅者加倍罰款","沒錢繳稅者只好借高利貸","稅吏苛暴，死亡者照樣收稅","沒錢的人，稅吏還故意科以重稅"],"a":[1],"p":20},{"s":2,"n":89,"q":"文中「乘上之急，所賣必倍」的意思是：","o":["長官喜歡什麼，什麼就會賣得好價錢","官府裡急需什麼，商人就乘機抬高價錢","打聽好官府的急需，大量進貨，賣得更多","看準商機，薄利多銷，賺得更多"],"a":[1],"p":20},{"s":2,"n":90,"q":"商人之所以能「力過吏勢，以利相傾。」主要是因為：","o":["收買高官貴族","財大氣粗","交遊廣闊","聯合壟斷商機"],"a":[0]},{"s":2,"n":91,"q":"文中螳螂「委身曲跗」，意在：","o":["委曲求全","隱藏實力","準備攻擊","左右觀望"],"a":[2],"p":21},{"s":2,"n":92,"q":"文中「務欲得其前利，而不顧其後之有患也」，意謂：","o":["勇往直前","見利忘身","斤斤計較","因小失大"],"a":[1],"p":21},{"s":2,"n":93,"q":"文化局為舉辦節令歡慶會，撰寫了四副對聯準備張貼在歡慶會會場。四副對聯分別是：「光天滿月，火樹銀花」、「冰壺含雪魄，銀漢漾金波」、「做人抱負先三立，造物生機首一陽」、「羽射談經天高氣爽，佩萸插菊人壽花香」。張貼以上對聯的歡慶會場依序各在慶祝那些節令？","o":["中秋、七夕、重陽、端午","元宵、中秋、春節、重陽","元宵、春節、重陽、中秋","中秋、元宵、端午、重陽"],"a":[1]},{"s":2,"n":94,"q":"下列文句，沒有錯別字的是：","o":["他做事一向率性而為，從不按步就班，令人惋惜","每次問他，他總是模棱兩可，沒有肯定的答案","這棟別墅美輪美奐，路過的人都忍不住贊歎","年輕人是社會的中流柢柱，凡事不應該自暴自棄"],"a":[1,2]},{"s":2,"n":95,"q":"下列文句「」中成語的使用，完全正確的是：","o":["影視明星在記者會中，提起自己的拍片計畫，說得頭頭是道；當被問及緋聞事件時，常常閃爍其詞，顯得「諱莫如深」","動物園中的無尾熊，每當見到尤加利樹，趕忙「行將就木」，準備飽餐一頓","在工作上能「一暴十寒」，焚膏繼晷，堅持到底的人，終究可以享受豐碩的成果","大屯山上每到秋日「風塵僕僕」之時，滿山芒花隨風招搖，極富詩情畫之美"],"a":[0]},{"s":2,"n":96,"q":"在動詞前加「相」字，有表示其動作、事況、情態是彼此雙向意涵的，如「相見時難別亦難」的「相」意指互相；也有表示單向意涵，如「山中相送罷，日暮掩柴扉」的「相」指對方。下列文句「」內的「相」字，表示雙向意涵的是：","o":["獨坐幽篁裡，彈琴復長嘯。深林人不知，明月來「相」照","寒雨連江夜入吳，平明送客楚山孤。洛陽親友如「相」問，一片冰心在玉壺","煮豆持作羹，漉菽以為汁。萁在釜下燃，豆在釜中泣。本自同根生「相」煎何太急","漢家宮女春未闌，愛此芳香朝暮看。看來看去心不忘，攀折將安鏡臺上雙雙素手剪不成，兩兩紅妝笑「相」向"],"a":[3]},{"s":2,"n":97,"q":"匡國泰〈一天—巳時：變幻〉：「母親在裡屋/打開箱子翻衣服/一件藍的/又一件綠的/不斷地翻下去/窗外的山就漸漸有了層次/（隱隱傳來播種冬小麥的歌謠）」，這首詩中，從母親翻衣服過渡到窗外的山，請問其憑藉為何？","o":["歌聲從窗外傳到窗內","母親的眼光望向窗外","衣服與山的顏色皆由藍、綠二色形成層次","時光的流逝"],"a":[2]},{"s":2,"n":98,"q":"下列各組「」中的字，前後音義皆相同的是：","o":["一朝蒙霧露，「分」作溝中瘠/自「分」已死久矣","術者，因「任」而授官，循名而責實/百鳥豈無母？爾獨哀怨深；應是母慈重，使爾悲不「任」","天下雲集而響應，贏糧而「景」從/返「景」入深林，復照青苔上","撒鹽空中「差」可擬/母微笑曰：病少「差」矣"],"a":[0]},{"s":2,"n":99,"q":"下列「適」字的意義，何者與「適彼樂土」的「適」字相同？","o":["削足「適」履","「適」得其反","無「適」也，無莫也","子「適」衛，冉有僕"],"a":[3]},{"s":2,"n":100,"q":"下列書信的提稱詞，有誤的是：","o":["硯右：用於同學","鈞座：用於軍政界","禮席：用於弔唁","青鑒：用於長輩"],"a":[3]},{"s":3,"n":1,"q":"下列文句，用字完全正確的選項是：","o":["這樁貪污事件被媒體批露後，一時之間群情譁然","說話措詞不當、寫文章誤用成語，都可能會貽笑大方","這個案件千頭萬緒，想徹底解決，勢必曠日會時","他凡事斤斤計較，一心盤算私利，真是個不視大體的人"],"a":[1]},{"s":3,"n":2,"q":"「大禹為拯救生民於水患，櫛風沐雨，無暇安席」，句中「櫛風沐雨」一詞，字面上雖無「髮」字，卻與「頭髮」密切相關。下列各句，敘述重點不在「頭髮」的選項是：","o":["童山濯濯","朝如青絲暮成雪","首如飛蓬","俯首甘為孺子牛"],"a":[3]},{"s":3,"n":3,"q":"閱讀下文，選出□□內最適合填入的選項：尺直的地平線/把□□割分為二/下面是粗筆快墨的茫茫/上面是無邊若夢的醉紅/點點飛揚的閃光/忽上忽下、□□似的/正沉默地/□□著夕陽/啊，久違了/比翼群飛的白鷺！（葉維廉〈夕陽與白鷺〉）","o":["天空；水花；噴灑","天空；精靈；歡送","景色；火花；烘托","景色；音符；演奏"],"a":[3]},{"s":3,"n":4,"q":"下文中，作者認為托爾斯泰給沙皇的信之所以偉大，是因為：托爾斯泰是一位伯爵，擁有很大很大的農莊，但是在他的作品《復活》中，他重新回顧成長過程中身為貴族的沉淪，以及擁有土地和農奴帶給他的不安與焦慮，他決定出走。我認為托爾斯泰最偉大的作品不是《復活》也不是《戰爭與和平》，而是在他垂垂老矣時，寫的一封給俄國沙皇的信。信中，他沒有稱沙皇為皇帝，而是稱他為「親愛的兄弟」，他寫到：「我決定放棄我的爵位，我決定放棄我的土地，我決定讓土地上所有的農奴恢復自由人的身分。」那天晚上把信寄出去之後，他收了幾件衣服，拎著簡單的包袱，出走了。最後他死於一個名不見經傳的小火車站，旁人只知道一個老人倒在月台上，不知道他就是大文豪托爾斯泰。（蔣勳《孤獨六講‧革命孤獨》）","o":["托爾斯泰體認民貴君輕，實踐民主思維","托爾斯泰目睹貧富差距，慷慨捐財助人","托爾斯泰揭露民生困苦，喚起社會關注","托爾斯泰展現悲憫情懷，追求人間公義"],"a":[3]},{"s":3,"n":5,"q":"人物描寫未必要正面白描，透過人物的言語，往往可以更自然地刻劃人物的真實性情。下列文字，作者透過記錄祖父的話，目的是要彰顯祖父的何種情懷？太陽慢慢地接近山頂，小米園又開始熱鬧了，像辦年貨一樣，成群的小鳥飛來像要飽餐一頓似的。我正要用力拉動手上的牽引繩，祖父叫住了我：「麥唉（不要之意），這些鳥都從很遠的地方來吃我的小米，有的從前山、高雄、台北和宜蘭、花蓮飛來，他們一大早就出門，為的就是想吃我種的小米，他們等了快一天的時間，都沒有吃東西。撒可努，不要趕他們了，讓他們吃吧，等吃飽了，才有力量再飛回很遠的地方；不然，等太陽下山，天暗了，小鳥就看不見，找不到回家的路，小鳥的家人就會擔心，為什麼爸爸和哥哥還不回來？」（亞榮隆‧撒可努〈小米園的故事〉）","o":["心懷惻隱，純真溫厚","安貧知命，樂在其中","敬重自然，不違農時","釣而不綱，取物有節"],"a":[0]},{"s":3,"n":6,"q":"閱讀下文，選出詮釋不恰當的選項：（發現兒子沒有告訴湯米，逕自取走湯米的玩具之後）我開車送兒子到湯米家巷口，要他自己一個人去。我看見他小小一個人拖長長一條身影慢吞吞往樹蔭蔽天的長巷中一戶鐵門嚴扃的深宅大院蹭去，我看見他猶豫徘徊了半天才往草地上死勁搬來一塊墊腳石踩上去按了電鈴，我看見他等了足足十分鐘沒有人應門便捨下那個塑膠玩具在郵箱裡然後轉身斜刺裡往樹叢中跑去。我趕到樹林裡已找不到他的踪影。（劉大任〈王紫萁〉）","o":["「拖」、「蹭」、「徘徊」等動作，顯示兒子的遲疑與焦慮","「捨下」、「轉身」、「跑去」等動作，顯示兒子拋卻壓力，開心釋懷","作者刻意使用未標點而不易讀的長句，暗示歸還玩具過程的艱難與漫長","「樹蔭蔽天」、「長巷」、「鐵門嚴扃」、「深宅大院」的"],"a":[1]},{"s":3,"n":7,"q":"小夏參觀某一處古代的建築物時，抄錄了其中四幅對聯。若依「聯語內容與處所功能相應」的原則推測，則甲、乙、丙、丁四處依序應是 :","o":["寢室/書房/廚房/戲臺","寢室/廚房/書房/戲臺","戲臺/廚房/書房/寢室","戲臺/書房/廚房/寢室"],"a":[2]},{"s":3,"n":8,"q":"閱讀下文，選出敘述正確的選項：太陽剛爬起來的那地方，堤防缺了一塊燦爛的金色大口，金色的光就從那裡一直流瀉過來。昨天的稻穗的頭比前天的低，而今天的比昨天還要低了。一層薄薄的輕霧像一匹很長的紗帶，又像一層不在世上的灰塵，輕飄飄地，接近靜止那樣緩慢而優美的，又更像幻覺在記憶中飄移那樣，踏著稻穗，踏著稻穗上串繫在珠絲上的露珠，而不教稻穗和露珠知道。（黃春明〈青番公的故事〉）六禮未成轉眼洞房花燭五經不讀霎時金榜題名甲琴瑟春常在芝蘭德自馨丁洗硯魚吞墨烹茶鶴避烟丙飽德飫和真福食肴仁饌義即養生乙","o":["「堤防缺了一塊燦爛的金色大口」描述堤防因年久失修而頹圮坍塌","「昨天的稻穗的頭比前天的低，而今天的比昨天還要低」暗示稻穗日漸飽滿成熟","「輕霧像一匹很長的紗帶，又像一層不在世上的灰塵」比喻黃昏暮靄的輕盈飄渺","「踏著稻穗上串繫在珠絲上的露珠，而不教稻穗和露珠知道」"],"a":[1]},{"s":3,"n":9,"q":"閱讀下文，選出與陳白沙的觀點不符的選項：陳白沙曰：「三代以降，聖賢乏人，邪說並興，道始為之不明；七情交熾，人欲橫流，道始為之不行。道不明，雖日誦萬言，博極群書，不害為未學；道不行，雖普濟群生，一匡天下，不害為私意。」（《明儒學案.白沙學案上》）","o":["博覽群書，必能明道","做學問的宗旨，在於明道與行道","道之所以不明，原因之一是缺乏聖賢","若志不在道，匡濟天下也只是滿足個人欲望而已"],"a":[0]},{"s":3,"n":10,"q":"文章中常會以一、二關鍵字，做為凸顯該段或該篇文章主旨的樞紐。閱讀下文，選出其中的關鍵字：積土成山，風雨興焉；積水成淵，蛟龍生焉；積善成德，而神明自得，聖心備焉。故不積蹞步，無以至千里；不積小流，無以成江海。（《荀子‧勸學》）","o":["山、海","神、聖","積、成","不、無"],"a":[2]},{"s":3,"n":11,"q":"下列是一段古代散文，請依文意選出排列順序最恰當的選項：世之所貴道者，書也，書不過語。甲、而世因貴言傳書， 乙、意有所隨，意之所隨者，不可以言傳也，丙、世雖貴之，我猶不足貴也， 丁、語有貴也，語之所貴者，意也，為其貴非其貴也。（《莊子‧天道》）","o":["甲丙丁乙","乙甲丁丙","丙丁乙甲","丁乙甲丙"],"a":[3]},{"s":3,"n":12,"q":"下列各「」中的書信用語，適合其使用情境的選項是：","o":["王大明寫信給任職公司的主管，結尾書寫「職王大明筆」","王大明寫信給任職公司的主管李經理，開頭書寫「李經理賜鑒」","王大明寫信給好友，在信中提及自己的父母，使用「令尊」、「令堂」","王大明寫信給高中導師耿精明，信封中間受信人的欄位書寫「耿"],"a":[1]},{"s":3,"n":13,"q":"《論語‧學而》篇中「賢賢易色」一語，歷來注解各有不同，清代學者陳澧《東塾讀書記》提及：「為人孝弟、賢賢易色、事君致身、朋友有信，五倫之事備矣。」若依此說法，則陳澧以為「賢賢易色」當指：","o":["尚賢遠佞","長幼有序","行孝色難","夫婦之道"],"a":[3]},{"s":3,"n":14,"q":"依據上文，「梓人」的主要職責為何？甲、運斤執斧乙、指揮工匠丙、設計藍圖丁、貯藏建材戊、匾額題辭","o":["甲丁","乙丙","甲丙丁","乙丙戊"],"a":[1],"p":22},{"s":3,"n":15,"q":"下列關於「」內文句的詮釋，正確的選項是：","o":["「委群材，會眾工」意謂梓人精於計算物料和工資，以求降低成本","「皆視其色，俟其言，莫敢自斷者」意謂梓人善於察言觀色，不敢獨斷","「畫宮於堵，盈尺而曲盡其制」意謂梓人所繪設計圖雖小，但精密詳備","「計其毫釐而構大廈，無進退焉」意謂梓人監督嚴格，不容"],"a":[2]},{"s":3,"n":16,"q":"許慎〈說文解字敘〉有「六書」之說，六書即：指事、象形、形聲、會意、轉注、假借。下列各組漢字，屬於同一種六書分類的選項是..","o":["刃、本、日","犬、下、公","慫、闊、筐","森、國、龍"],"a":[2]},{"s":3,"n":17,"q":"下列文句中，完全沒有錯別字的選項是..","o":["老唐誤信友人勸說，導致投資失敗，如今已到了走頭無路的地步","張三不僅工作能力好，又篤實可靠，因此備受重視，是炙手可熱的挖角對象","幾位實業家一口同聲表示，創業維艱，守成亦不易，必須戰戰兢兢，才可能鴻圖大展","考前他抱著勢在必得的決心，期待一舉金榜題名，沒想還是名落孫山，真教人為之挽惜"],"a":[1]},{"s":3,"n":18,"q":"下列各文句中「」內的詞語，用法正確的選項是：","o":["他平素「色厲內荏」，是位外剛內柔的正直長官","聽到別人犯錯時，應該抱著「哀矜而勿喜」的態度","孫君「當仁不讓」，獨吞與友人合作投資所得的利潤","父親鼓勵張生要「不恥下問」，向老師多多請益，學業才會進步"],"a":[1]},{"s":3,"n":19,"q":"下列對《荀子‧勸學》的解讀，正確的選項是：","o":["質「的」張而弓矢至焉──「的」是「之」的意思","君子生非異也，善「假」於物也──「假」是偽裝、模仿的意思","淑人君子，其儀一兮。其儀一兮，心如「結」兮──「結」用以形容心志之堅定","「青」，取之於「藍」，而「青」於「藍」──兩個「青」字和兩個「藍」字都是名詞"],"a":[2]},{"s":3,"n":20,"q":"隨著社會發展的加快，外來詞在現代漢語中的地位和作用也越來越重要，這值得我們重視。含有音譯成分的外來詞主要有：（一）純音譯，如布丁（二）半音半意譯，如千瓦（三）音譯加類名，如卡片（四）音意兼譯，如俱樂部。下列外來詞依此順序排列的選項是：","o":["嬉皮、啤酒、吉他、華爾街","吉他、華爾街、啤酒、嬉皮","吉他、嬉皮、啤酒、華爾街","啤酒、吉他、華爾街、嬉皮"],"a":[1]},{"s":3,"n":21,"q":"成語是現成的簡短有力的詞組，運用得當，可使文章生色，所以作者多樂於採用，如：甲、唉呀，不好了，阿彌陀佛，怎麼辦呢？我急得□□□□（吳濁流〈一場虛驚〉）乙、楊逵先生若是有三長兩短的話，我蒙上謀殺名作家的罪名是難免的。多麼敬愛祖父的楊翠小姐一定不能原諒我。如今回想當時的憂慮，□□□□（陳秀喜〈楊逵先生和大鄧伯花〉）丙、每一次看見你□□□□/阿爸的心多麼絞痛/孩子呀！不要忘記/一時的得意/往往是無數怨恨的種子（吳晟〈愚行〉）丁、在中篇小說〈雨〉裡面，鍾理和倒描寫了反面的地方士紳人物──羅丁瑞。「日據時代身任庄役場（鎮公所）兵事係要職，大權在握，成為一個了不起的人物，在地方上叱咤風雲，□□□□，不可一世......」（葉石濤〈新文學傳統的繼承者──鍾理和〉）上引各段文字□□□□內的成語，依序最適宜填入的選項是：","o":["心有餘悸/汗流浹背/趾高氣揚/吐氣揚眉","汗流浹背/心有餘悸/吐氣揚眉/趾高氣揚","心有餘悸/汗流浹背/吐氣揚眉/趾高氣揚","汗流浹背/心有餘悸/趾高氣揚/吐氣揚眉"],"a":[3]},{"s":3,"n":22,"q":"下引文字，依文意排列，順序最恰當的選項是：始吾幼且少，甲、是固不苟為炳炳烺烺乙、及長丙、為文章以辭為工丁、乃知文者以明道務采色，誇聲音而以為能也。（柳宗元〈答韋中立論師道書〉）","o":["丙乙丁甲","丁丙甲乙","丙甲乙丁","丁乙甲丙"],"a":[0]},{"s":3,"n":23,"q":"新詩並非全無格律可言，其取法古典詩，講求句式整齊、句尾押韻的例子時有所見。請據此推敲，下引戴望舒〈寂寞〉一詩，□□內最適宜填入的選項是：園中野草漸□□/托根於我舊時的□□/給他們披□□的綵衣/星下的盤桓從茲消隱","o":["離離/腳印/青春","緜緜/憂愁/年少","青青/懷念/繽紛","瑟瑟/創傷/斑斕"],"a":[0]},{"s":3,"n":24,"q":"以「也」字為句尾詞，《論語》、《孟子》及先秦諸子已多見，宋人散文亦好用之，其中使用「也」字形成特殊風格而最為後人所稱頌的文章是：","o":["蘇洵〈六國論〉","蘇軾〈留侯論〉","曾鞏〈墨池記〉","歐陽脩〈醉翁亭記〉"],"a":[3]},{"s":3,"n":25,"q":"人倫是中華文化的重要質素，而文人亦常在詩作中流露對人倫的真切感受。我國傳統將人倫略分為五個層次：夫婦、父子、兄弟、朋友、君臣；為了更切合實際，可以稍稍改動為：（一）夫妻（二）親子（三）手足（四）朋友（五）群己。下列詩篇，其內容符合此排序的選項是：甲、自君之出矣，羅帳咽秋風。思君如蔓草，連延不可窮（南朝‧梁‧范雲詩）乙、遊人武陵去，寶劍直千金。分手脫相贈，平生一片心（唐‧孟浩然詩）丙、孤雁不飲啄，飛鳴聲念群。誰憐一片影，相失萬重雲。望盡似猶見，哀多如更聞。野鴉無意緒，鳴噪自紛紛（唐‧杜甫詩）丁、一春簷溜不曾停，滴破空階蘚暈青。便是兒時對牀雨，絕憐老大不同聽。雁回杳杳渾無夢，鵲語啾啾似有憑。忽得遠書看百過，眼昏自起剔殘燈（宋‧劉克莊詩）戊、燈怯寒威焰不青，忽聞急雪打窗櫺。宵深未敢拋刀尺，為伴孤兒課一經（清‧汪鈴詩）","o":["甲丙乙丁戊","丙乙甲丁戊","甲戊丁乙丙","丙丁戊甲乙"],"a":[2]},{"s":3,"n":26,"q":"1959 年，潘天壽畫了一幅「誠齋詩意」（如附圖）。誠齋是南宋詩人楊萬里的別號，下列楊萬里所作七絕符合畫境的選項是：","o":["〈誠齋〉：浯溪見了紫巖回，獨笑春風儘放懷。謾向世人談昨夢，便來喚我作誠齋","〈小池〉：泉眼無聲惜細流，樹陰照水愛晴柔。小荷纔露尖尖角，早有蜻蜓立上頭","〈曉坐荷橋〉：四葉青蘋點綠池，千重翠蓋護紅衣。蜻蜓空裏元無見，只見波間仰面飛","〈秋涼晚步〉：秋氣堪悲未必然，輕寒政是可人天。綠池落盡紅蕖卻，荷葉猶開最小錢"],"a":[1]},{"s":3,"n":27,"q":"《西遊記》假借玄奘取經的史實，改寫成長篇小說，流傳中外。下列有關《西遊記》的敘述，正確的選項是：","o":["《西遊記》敘述唐僧取經的歷程，是一部歷史小說","歷史上的唐僧取經，只有孫悟空為伴；猪八戒、沙和尚和龍馬是《西遊記》添加的虛構人物","齊天大聖大鬧天宮，要玉皇大帝搬出天宮，讓他來住，並且說：「常言道：『皇帝輪流做，明年到我家。』......」這表現了民主精神","美猴王離開花果山水簾洞，參訪仙道，遇到一個樵夫，樵夫指點神仙住處說：「不遠、不遠。此山叫做靈臺方寸山。山中有座斜月三星洞。......」其中「靈臺方寸」、「斜月三星」指的都是「心」，意指學仙不必在遠，只在此心"],"a":[3]},{"s":3,"n":28,"q":"下列關於書信用語、格式、禮儀的敘述，正確的選項是：","o":["為了保障自己的隱私權，信封上不可寫出自己的姓名，最好是連姓氏都不要輕易洩露","寫信回家，稱呼自己的家人應加一「家」字，如「家嚴」、「家慈」、「家兄」、「家姊」等","為求信件順利傳遞，信封上收信人的郵遞區號務必正確填寫；發信人的郵遞區號與信件傳遞的速度無關，自可略而不寫","自謙而尊人是禮儀的基本精神。老師對學生有所教導，在書信中往往用「商量」、「討論」等語，以示謙遜；但學生仍當恪守分際，而用「請教」、「請益」等語，保持敬意"],"a":[3]},{"s":3,"n":29,"q":"關於下引文字，敘述不正確的選項是：子華使於齊，冉子為其母請粟。子曰：「與之釜。」請益。曰：「與之庾。」冉子與之粟五秉。子曰：「赤之適齊也，乘肥馬、衣輕裘。吾聞之也，君子周急不繼富。」（註：公西赤，字子華；釜、庾、秉都是量的單位）（《論語‧雍也》）","o":["「請益」是指冉子向孔子請教贈粟的多寡","孔子認為君子行事，宜雪中送炭，非錦上添花","「周急不繼富」的「周」字通「賙」字，是救濟的意思","從「乘肥馬、衣輕裘」，可知子華行裝豪華，並不窮困匱乏"],"a":[0]},{"s":3,"n":30,"q":"關於下引文字，敘述不正確的選項是：子路，人告之以有過，則喜。禹聞善言，則拜。大舜有大焉，善與人同，舍己從人，樂取於人以為善。自耕稼陶漁以至為帝，無非取於人者。取諸人以為善，是與人為善者也。故君子莫大乎與人為善。（《孟子‧公孫丑》）","o":["「大舜有大焉」，「有」同「又」，意謂舜又比子路和禹更偉大","「子路，人告之以有過，則喜」，子路喜其得聞己過而改之，是勇於改過的表現","「自耕稼陶漁以至為帝，無非取於人者」，「耕稼」謂種田，「陶漁」謂以陶器撈魚","此章言聖賢樂善之誠，並無人我的區隔，所以，別人的善可以用來充實自己，而自己的善也可施予別人"],"a":[2]},{"s":3,"n":31,"q":"關於下引文字，敘述正確的選項是：郗太傅（郗鑒）在京口，遣門生與王丞相（王導）書，求女壻。丞相語郗信：「君往東廂，任意選之。」門生歸，白郗曰：「王家諸郎，亦皆可嘉，聞來覓壻，咸自矜持。唯有一郎在牀上坦腹臥，如不聞。」郗公云：「正此好！」訪之，乃是逸少（王羲之），因嫁女與焉。（《世說新語‧雅量》）","o":["「遣門生與王丞相書」，是送書卷作為見面禮","「丞相語郗信」，是說王丞相口授回信給郗太傅","「唯有一郎在牀上坦腹臥，如不聞」，「一郎」是指王家的大少爺","「郗公云：『正此好！』」郗鑒擇王羲之為壻，是因為他不做作，是個率真的人"],"a":[3]},{"s":3,"n":32,"q":"關於下引文字，敘述不正確的選項是：一種社會所最可怕的不是民眾浮淺頑劣，因為民眾通常都是浮淺頑劣的。牠所最可怕的是沒有在浮淺卑劣的環境中而能不浮淺卑劣的人。比方英國民眾就是很沉滯頑劣的，然而在這種沉滯頑劣的社會中，偶爾跳出一二個性堅強的人，如雪萊，卡萊爾，羅素等，其特立獨行的膽與識，卻非其他民族所可多得。這是英國人力量所在的地方。路易鏗笛生曾批評日本，說她是一個沒有柏拉圖和亞理斯多德的希臘，所以不能造偉大的境界。據生物學家說，物競天擇的結果不能產生新種，須經突變（Sports）。所謂突變，是指不像同種的新裔。社會也是如此，牠能否生長滋大，就看牠有無突變式的分子；換句話說，就看十字街頭的矮人群中有沒有幾個大漢。（朱光潛〈談十字街頭〉）","o":["作者認為一個社會能否向上提升，繫於這個社會有沒有卓越的大人格","「矮人群」一詞喻浮淺卑劣之民眾；「大漢」一詞喻特立獨行有膽有識之人","從文中的觀點來看，可知日本優於英國，因為她雖沒有柏拉圖和亞理斯多德，可是民眾並不浮淺卑劣","「在浮淺卑劣的環境中而能不浮淺卑劣的人」，這種人近於顧炎武〈廉恥〉"],"a":[2]},{"s":3,"n":33,"q":"下列各組詞語「」內的字，讀音完全相同的選項是：","o":["「嗟」歎不已╱「蹉」跎時日╱山勢「嵯」峨","「貽」人笑柄/甘之如「飴」/不忍欺「紿」","鶼「鰈」情深/「喋」喋不休/最後通「牒」","深「諳」世故╱喉嚨「喑」啞╱「黯」然失色"],"a":[2]},{"s":3,"n":34,"q":"下列文句中的「以」字，意義與其他選項不同的是：","o":["《左傳.燭之武退秦師》：晉侯、秦伯圍鄭，「以」其無禮於晉，且貳於楚也","范仲淹〈岳陽樓記〉：不「以」物喜，不以己悲。居廟堂之高，則憂其民；處江湖之遠，則憂其君","曹丕〈典論論文〉：西伯幽而演《易》，周旦顯而制《禮》；不「以」隱約而弗務，不以康樂而加思","曾鞏〈墨池記〉：推王君之心，豈愛人之善，雖一能不以廢，而"],"a":[3]},{"s":3,"n":35,"q":"「互文足義」的情況之一，指篇中某一句內的上下兩個意義單位，並非個別獨立，而必須統整在一起作互補的解釋，文意始能完足。如文天祥〈正氣歌〉「雞棲鳳凰食」，意指雞和鳳凰同居共食。「雞棲」、「鳳凰食」在此句中，不是個別獨立的兩個意義單位，而必須作統整、互補的解釋。下列詩句，符合「互文足義」的選項是：","o":["杜牧〈泊秦淮〉：煙籠寒水月籠沙","晏殊〈清平樂〉：鴻雁在雲魚在水","蘇軾〈東欄梨花〉：梨花淡白柳深青","歐陽脩〈答謝景山遺古瓦硯歌〉：力彊者勝怯者敗"],"a":[0]},{"s":3,"n":36,"q":"王國維《宋元戲曲史》：「古代文學之形容事物也，率用古語，其用俗語者絕無。又所用之字數亦不甚多。獨元曲以許用襯字故，故輒以許多俗語，或以自然之聲音形容之。此自古文學上所未有也。」如《西廂記》之〈得勝令〉：驚覺我的是□□□竹影走龍蛇，虛飄飄莊周夢蝴蝶，□□□促織兒無休歇，韻悠悠砧聲兒不斷絕，□□□傷別。急煎煎好夢兒應難捨，冷清清的咨嗟，嬌滴滴玉人兒何處也？上文□□□處的詞語，依序最適合填入的選項是：","o":["顫巍巍╱絮叨叨╱痛煞煞","痛煞煞╱絮叨叨╱顫巍巍","絮叨叨╱顫巍巍╱痛煞煞","顫巍巍╱痛煞煞╱絮叨叨"],"a":[0]},{"s":3,"n":37,"q":"有些文學作品，在上句句尾與下句句首的位置，安排重複的詞語，以顯現連綿不絕的情意，如〈飲馬長城窟行〉：「青青河畔草，綿綿思遠道。遠道不可思，宿昔夢見之。夢見在我旁，忽覺在他鄉」即是。下引現代詩的表現方式類似上述情況，呈現了連續不斷的欣喜之情。其文句排序，最適當的選項是：這支歌聲最初曾在我的心中爆裂的闡發甲、當黎明躍起乙、玫瑰之綻開黎明丙、亦如盈盈的露水之綻開玫瑰丁、我就聽到溢滿林間的呼喚戊、而這呼喚也像是跟隨著一種雷鳴而來（彭邦楨〈聯想〉）","o":["甲丙乙丁戊","丙乙甲丁戊","丙乙丁戊甲","戊丁乙丙甲"],"a":[1]},{"s":3,"n":38,"q":"下列文句均與季節有關。就其所描寫的景色、情境，依春夏秋冬物候變化之先後為序，排列正確的選項是：甲、那時暄氣初消，月正圓，蟹正肥，桂花皎潔，也未陷入凜冽蕭瑟氣態，這是最值得賞樂的乙、一地李花，飄零似雪，也為我翌日晨曉推窗時牽起家國之思來，這種思念，經過日光烘托，益其溫暖爛漫，浩浩蕩蕩，明媚千萬里，天涯便也近在咫尺了丙、近前光晃晃的柏油路面，熱得實在看不到什麽了。稍遠一點的地方的景象，都給蒙在一層黃膽色的空氣的背後，他再也不敢望穿那一層帶有顔色的空氣看遠處丁、南方的黃梅天的確糟糕得可以。天，老是陰沉沉地布滿厚重的破棉絮似的雲，雨是天天下，但下得又不乾脆：有時翻江倒海下一個整天整夜，有時竟連綿到三四天戊、松濤如吼，霜月當窗，饑鼠吱吱在承塵上奔竄。我於這種時候，深感到蕭瑟的詩趣，常常獨自撥劃著爐火，不肯就睡，把自己擬諸山水畫中的人物，作種種幽邈的遐想","o":["乙丙丁戊甲","乙丁丙甲戊","丁乙丙戊甲","丁丙乙甲戊"],"a":[1]},{"s":3,"n":39,"q":"古典詩歌常見「對仗」技巧，下列詩句對仗最為工整的選項是：","o":["少婦城南欲斷腸，征人薊北空回首","洛陽游絲百丈連，黃河春冰千片穿","不見柏梁銅雀上，寧聞古時清吹音","紅泥亭子赤欄干，碧流環轉青錦湍"],"a":[0]},{"s":3,"n":40,"q":"傳統建築常懸掛楹聯，以凸顯建物主題，增添人文情趣。下列各選項中的楹聯，何者與建物主題配置不當？","o":["松聲竹聲鐘磬聲，聲聲自在；山色水色煙霞色，色色皆空──用於書院","真實不虛，大慈悲，度一切苦厄；意識無界，空色相，現五蘊光明──用於觀音祠","望重南陽，想當年羽扇綸巾，忠貞扶季漢；澤周西蜀，愛此地浣花濯錦，香火擁靈祠──用於諸葛亮祠","天下名山僧占多，也該留一二奇峰，棲吾道友；世間好語佛說盡，誰識得五千妙論，出我仙師──用於道觀"],"a":[0]},{"s":3,"n":41,"q":"白居易〈琵琶行并序〉「妝成每被秋娘妒」，乃通過側寫旁人的反應，呈現琵琶女的美麗；相較於由容貌服飾正面描寫美女的手法，有時更為高妙。下列對「美女」的敘述，也採用「側寫」的選項是：","o":["曹植〈洛神賦〉：丹脣外朗，皓齒內鮮","杜甫〈麗人行〉：態濃意遠淑且真，肌理細膩骨肉勻","李白〈于闐采花〉：明妃一朝西入胡，胡中美女多羞死","徐賢妃〈賦得北方有佳人〉：腕搖金釧響，步轉玉環鳴"],"a":[2]},{"s":3,"n":42,"q":"甲、□□的秋水深淺/怎樣測得出一尾魚的體溫/想想莫非自得其樂/泥塗之龜/畢竟要比供奉楚廟活得自由乙、我的靈魂要到□□去/去洗洗足/去濯濯纓/去飲我的黃驃馬/去聽聽伯牙的琴聲/我的靈魂要到汩羅去/去看看我的老師老屈原/問問他認不認得莎孚和但丁/再和他同吟一葉蘆葦/同食一角米粽丙、雨潤過/飛白/藍天在/裱褙整張下午/柳枝老是寫著/一個燕字/而青蟲死命地讀/蛛網那本/線裝的□□/生門何在/卦象平平上引三段現代詩，□□處依序最適合填入的選項是：","o":["屈原/滄浪/《易經》","屈原/天池/《詩經》","莊子/滄浪/《易經》","莊子/天池/《詩經》"],"a":[2]},{"s":3,"n":43,"q":"古人「字」、「號」，來由不一。下列關於古人「字」、「號」的敘述，錯誤的選項是：","o":["蘇軾自號「東坡居士」，乃因其謫居黃州，築室於東坡之故","白居易自號「醉吟先生」，乃用以呈現其放意詩酒的人生態度","韓愈字「退之」，乃因其名「愈」，而以反義的「退之」為其字","李白號「青蓮居士」，乃因其偏愛蓮花之清新脫俗，有類其詩風"],"a":[3]},{"s":3,"n":44,"q":"文學作品中人物說話的「語氣」，可呈現其性格、情緒與心情；語氣可有平淡、誠懇、欣喜、不滿、憤怒、嘲諷、譏刺、諧謔、自負、自嘲......等。下列關於說話者「語氣」的解釋，正確的選項是：","o":["〈劉姥姥〉：「劉姥姥便站起身來，高聲說道：『老劉！老劉！食量大如牛，吃個老母猪不抬頭！』」顯示出劉姥姥的自負心態","〈鴻門宴〉：「亞父受玉斗，置之地，拔劍撞而破之，曰：『唉！豎子不足與謀！奪項王天下者，必沛公也，吾屬今為之虜矣！』」顯現范增莽撞而不能顧全大局的個性","〈馮諼客孟嘗君〉：「（齊王）謝孟嘗君曰：『寡人不祥，被於宗廟之祟，沉於諂諛之臣，開罪於君。寡人不足為也，願君顧先王之宗廟，姑反國統萬人乎？』」顯現齊王因不滿孟嘗君門客太多，遂故加嘲諷的心態","〈虬髯客傳〉：「道士對弈，虬髯與靖旁侍焉。俄而文皇來，......道士一見慘然，下棋子曰：『此局全輸矣！於此失卻局哉！救無"],"a":[3]},{"s":3,"n":45,"q":"「馬蹄聲，孤獨又憂鬱地自遠至近，灑落在沈默的街上如白色的小花朵」句中，將屬於聽覺形象的馬蹄聲，巧妙比擬為視覺形象的白色小花，使無影無形的聲音，通過有形有色的花朵而具體化。下列文句將聽覺形象比擬為視覺形象的選項是：","o":["鼓聲起處，船便如一支沒羽箭，在平靜無波的長潭中來去如飛","那小高樓上即刻發出求救的燈語，一明一滅著，有如乞兒的淚珠","讀舊日友人書/乃有眾多管弦之音打從心窩裡升起/首先是一組瀏亮的喇叭/像一群藍色小鳥撲著翅膀","他在花瓶旁邊的煙灰盒中，抖掉了紙煙上的灰燼，那紅的煙火，"],"a":[2],"p":23},{"s":3,"n":46,"q":"閱讀下列文字後作答：孩子，你真是快活呀！一早晨坐在泥土裡，耍著折下來的小樹枝兒。我微笑著看你在那裡耍弄那根折下來的小樹枝兒。我正忙著算帳，一小時一小時在那裡加疊數字。也許你在看我，心想：「這種好沒趣的遊戲，竟把你一早晨的好時間浪費掉了！」孩子，我忘了聚精會神玩耍樹枝與泥餅的方法了。我尋求貴重的玩具，收集金塊與銀塊。你呢，無論找到什麼便去做你的快樂的遊戲；我呢，卻把我的時間與力氣都浪費在那些我永不能得到的東西上。我在我的脆薄的獨木船裡掙扎著，要航過欲望之海，竟忘了我也是在那裡做遊戲了。（泰戈爾《新月集.玩具》）依據上文文意，下列敘述錯誤的選項是：","o":["「我」羨慕孩子能隨時隨地盡情快樂的遊戲，感歎自己早已失去這種心情","「我」明白自己的玩具貴重，懊悔自己常浪費時間精力在其他無謂的追求上，而忘了專注於金錢遊戲","本文旨在透過孩子與「我」的對比，表達類似蘇軾〈臨江仙〉「長恨此身非我有，何時忘卻營營」的感慨","作者以「我」駕著脆薄的獨木船航過欲望之海，比喻成人陷溺於"],"a":[1],"p":23},{"s":3,"n":47,"q":"閱讀下列文字後作答：邊韶字孝先，陳留浚儀人也。以文章知名，教授數百人。韶口辯，曾晝日假臥，弟子私嘲之曰：「邊孝先，腹便便。懶讀書，但欲眠。」韶潛聞之，應時對曰：「邊為姓，孝為字。腹便便，五經笥。但欲眠，思經事。寐與周公通夢，靜與孔子同意。師而可嘲，出何典記？」嘲者大慚。（《後漢書.邊韶傳》）依據上文，下列敘述不當的選項是：","o":["邊韶不僅飽讀詩書，擅長文章，且口才流利，富機智反應","文中「寐與周公通夢，靜與孔子同意」，暗用《論語》孔子曰「久矣，吾不復夢見周公」的典故","「腹便便」讀為「腹ㄆㄧㄢˊㄆㄧㄢˊ」，學生本用以嘲笑邊韶身材肥胖，邊韶則用以自喻博學多聞","文中邊韶說「師而可嘲，出何典記」，目的在考核學生熟讀經典"],"a":[3],"p":23},{"s":3,"n":48,"q":"閱讀下列文字後作答：趙襄主學御於王於期，俄而與於期逐，三易馬而三後。襄主曰：「子之教我御，術未盡也。」對曰：「術已盡，用之則過也。凡御之所貴，馬體安於車，人心調於馬，而後可以進速致遠。今君後則欲逮臣，先則恐逮於臣。夫誘道爭遠，非先則後也。而先後心皆在於臣，上何以調於馬？此君之所以後也。」（《韓非子.喻老》）文中以學習駕馭車馬為例，主要在闡明：","o":["快馬加鞭，進速致遠，才能成功","時時競逐，有先後心，方能致勝","誘道爭遠，非先則後，無須計較","調御自如，忘懷得失，始能致遠"],"a":[3],"p":23},{"s":3,"n":1,"q":"下列文句，何者完全無錯別字？","o":["歐陽脩主張作文應明道至用","歐陽脩的散文平易流暢，情韻綿藐","歐陽脩善長詩詞，風格清麗婉約","信義行於君子，而刑戮施於小人"],"a":[3]},{"s":3,"n":2,"q":"下列各組引號中的文字，意義或作用相同的是：","o":["以君子之難能，「期」小人之尤者以必能其囚及「期」而卒自歸，無後者","不逆「情」以干譽上賊下之「情」","太宗之為此，「所以」求此名也安知夫縱之去也，不意其必來以冀免，「所以」縱之乎（","刑入「於」死者，乃罪大惡極「於」茲六年矣"],"a":[3]},{"s":3,"n":3,"q":"「而」字作連詞用，可籠統分為順接和轉接兩種，下列何者屬於轉接？","o":["不苟幸生，「而」視死如歸","蓋恩德入人之深「而」移人之速","意其必免「而」復來","是君子之所難，「而」小人之所易也"],"a":[3]},{"s":3,"n":4,"q":"下列「之」字，何者不是指「大辟囚」？","o":["縱而來歸而赦「之」","可偶一為「之」爾","施恩德以臨「之」","意其必來而縱「之」"],"a":[1]},{"s":3,"n":5,"q":"縱囚論中發揮統攝作用的關鍵詞（文眼）是：","o":["縱","常","賊","恩德"],"a":[1]},{"s":3,"n":6,"q":"下列文句所述的觀點，何者為作者藉助「或曰」造出來的假設？","o":["寧以義死，不苟幸生，此又君子之尤難者也","是君子之所難，而小人之所易也","罪大惡極，誠小人矣，及施恩德以臨之，可使變而為君子","縱而來歸，殺之無赦。而又縱之，而又來，則可知為恩德之致爾"],"a":[2]},{"s":3,"n":7,"q":"縱囚論有「破」（駁斥），有「立」（立論），作者所要駁斥的世俗見解是：","o":["唐太宗「以君子之難能，期小人之尤者以必能」","唐太宗施恩德，使小人變為君子","唐太宗縱囚之舉是「上下交相賊」","唐太宗立法施政本於人情"],"a":[1]},{"s":3,"n":8,"q":"下列有關縱囚論的敘述，何者顯然有誤？","o":["採破題法，文章一開頭就直接針對唐太宗縱囚之舉加以敘議","性質屬論說文中的史論","是有名的翻案文章","採先「破」後「立」的手法，作者的主張出現在篇末"],"a":[0]},{"s":3,"n":9,"q":"左忠毅公軼事一文中，左公曰：「他日繼吾志事，惟此生耳！」下文何事可以為呼應？","o":["史公為除不潔者，冒死入廠獄見左公","史公流涕述獄中事以語人曰：「吾師肺肝，皆鐵石所鑄造也！」","史公奉檄抗賊，日夜憂勤，不遑休息，或勸以少休，公曰：「吾上恐負朝廷，下恐愧吾師也。」","史公日後常躬造左公第，候太公、太母起居，拜夫人於堂上"],"a":[2]},{"s":3,"n":10,"q":"左忠毅公軼事一文中下列文句，何者可用以表示左光斗及史可法之師生情誼？","o":["及試，吏呼名，至史公，公瞿然注視","國家之事，糜爛至此，老夫已矣","每有警，輒數月不就寢，使將士更休","史公治兵，往來桐城，必躬造左公第"],"a":[3]},{"s":3,"n":11,"q":"左忠毅公軼事所記，應以左公事蹟為主，而末半篇卻專記史公之事，乃因：","o":["方苞欲在此軼事中，補正史之不足","史公之功蹟勝於左公","左公已逝，故續寫史公之事","藉史公映襯左公之情操及識人之明"],"a":[3]},{"s":3,"n":12,"q":"承上題，在章法上謂之：","o":["平提側注法","開門見山法","冒題法","映帶法"],"a":[3]},{"s":3,"n":13,"q":"「千眄萬睞巧將你引渡」，句中「引渡」與下列哪個詞語相呼應","o":["膨脹","匍匐","換胎","從從容容"],"a":[3]},{"s":3,"n":14,"q":"下列詩句何者最能表現余光中對故國或傳統文化的孺慕之情","o":["猶帶著后土依依的祝福在時光以外奇異的光中熟著","千眄萬睞巧將你引渡笑對靈魂在白玉裡流轉","一隻苦瓜，不再是澀苦日磨月磋琢出深孕的清瑩","你便向那片肥沃匍匐用蒂用根索她的恩液"],"a":[3]},{"s":3,"n":15,"q":"白玉苦瓜一詩深具藝術上的意義，而下列有關說明何者錯誤 ?","o":["「日磨月磋琢出深孕的清瑩」可用以說明一切藝術的創造過程","「那一年的豐收像一口要吸盡古中國餵了又餵的乳漿完美的圓膩啊酣然而飽」是說明物質條件豐厚方能產生完美的藝術","「那觸覺，不斷向外膨脹充實每一粒酪白的葡萄直到瓜尖，仍翹著當日的新鮮」是強調藝術從頭到尾都是文化的產物與表現","「在時光以外奇異的光中熟著，一個自足的宇宙」是說由於完美，藝術品已超越時光，而成為永恆的"],"a":[1]},{"s":3,"n":16,"q":"白玉苦瓜","o":["作者龍應台","運用傳統的寄託手法，詠人以抒情","句句不離苦瓜，句句又不單寫苦瓜","以「苦」寫其形，從「瓜」寫其神"],"a":[2]},{"s":3,"n":17,"q":"「你便向那片肥沃匍匐用蒂用根索她的恩液」句中「那片肥沃」意涵豐富，所指稱的不包括下列何者","o":["皇天后土的祝福","母親的胸脯","中華文化","九州輿圖"],"a":[0]},{"s":3,"n":18,"q":"「皮靴踩過，馬蹄踩過重噸戰車的履帶踩過」以上詩句所要描述的與下列何者最相近","o":["中國啊中國何時我們才停止爭吵","中國中國你令我早衰","鐵絲網是一種帶刺的鄉愁無論向南走或是向北走","想起一個民族，怎樣在同一個旋律裡咀嚼流亡"],"a":[3]},{"s":3,"n":19,"q":"余光中作詩慣用倒裝手法，下列何者不屬之","o":["只留下隔玻璃這奇蹟難信","千眄萬睞將你引渡","似悠悠醒自千年的大寐","不幸呢還是大幸這嬰孩"],"a":[1]},{"s":3,"n":20,"q":"「久朽了，你的前身」，「你的前身」可以泛指","o":["藝術的素材","藝術家的生命","古老的文明","前世的生活"],"a":[0]},{"s":3,"n":21,"q":" 謠）」，這首詩中，從母親翻衣服過渡到窗外的山，請問其憑藉為何？","o":["歌聲從窗外傳到窗內","母親的眼光望向窗外","衣服與山的顏色皆由藍、綠二色形成層次","時光的流逝"],"a":[2]},{"s":3,"n":68,"q":"下列各組「」中的字，前後音義皆相同的是：","o":["一朝蒙霧露，「分」作溝中瘠/自「分」已死久矣","術者，因「任」而授官，循名而責實/百鳥豈無母？爾獨哀怨深；應是母慈重，使爾悲不「任」","天下雲集而響應，贏糧而「景」從/返「景」入深林，復照青苔上","撒鹽空中「差」可擬/母微笑曰：病少「差」矣"],"a":[0]},{"s":3,"n":69,"q":"下列「適」字的意義，何者與「適彼樂土」的「適」字相同？","o":["削足「適」履","「適」得其反","無「適」也，無莫也","子「適」衛，冉有僕"],"a":[3]},{"s":3,"n":70,"q":"下列書信的提稱詞，有誤的是：","o":["硯右：用於同學","鈞座：用於軍政界","禮席：用於弔唁","青鑒：用於長輩"],"a":[3]},{"s":3,"n":71,"q":"下列詩詞，歌詠對象為屈原的共有幾首？不肯迂回入醉鄉，乍吞忠梗沒滄浪。至今祠畔猿啼月，了了猶疑恨楚王滿朝皆醉不容醒，眾濁如何擬獨清。江上流人真浪死，誰知浸潤誤深誠蒼藤古木幾經春，舊祀祠堂小水濱。行客謾陳三酎酒，大夫元是獨醒人讒勝禍難防，沉冤信可傷。本圖安楚國，不是怨懷王。廟古碑無字，洲晴蕙有香。獨醒人尚笑，誰與奠椒漿","o":["一首","二首","三首","四首"],"a":[3]},{"s":3,"n":72,"q":"《論語》：「君子之德，風；小人之德，草；草上之風，必偃。」句中「君子」係指「為政者」，下列各句之「君子」，與此意義相同的是：","o":["君子喻於義，小人喻於利","君子固窮，小人窮斯濫矣","君子泰而不驕，小人驕而不泰","君子學道則愛人，小人學道則易使"],"a":[3]},{"s":3,"n":73,"q":"下列各句「」中的成語，使用最恰當的是：","o":["他雖然不聰明，但是「千慮一得」，所說的話也有值得參考的地方","國家一旦有難，只要每個人「築室道謀」，那麼國家就能轉危為安","做學生要「不恥下問」，不懂的就儘量問老師，自然就能日起有功","遇到棘手的事情，我們只要「抱薪救火」，問題自能迎刃而解"],"a":[0]},{"s":3,"n":74,"q":"下列各組「」內的詞語，那些都是顯貴、官宦的代稱？","o":["吳宮花草埋幽徑，晉代「衣冠」成古丘（李白〈登金陵鳳凰臺〉）/邂逅得所從，「幅巾」起南陽（王安石〈諸葛武侯〉）","中原亂，「簪纓」散，幾時收（朱敦儒〈相見歡〉）/紅顏棄「軒冕」，白首臥松雲（李白〈贈孟浩然〉）","「冠蓋」滿京華，斯人獨憔悴（杜甫〈夢李白〉）/不知戰國官榮者，誰似「陶朱」得始終（汪遵〈五湖〉）","鬢髮已斑白，衣綬方「朱紫」（白居易〈有感〉）/「金槌」擊政後，玉斗碎增前（閻寬〈詠史〉）"],"a":[1]},{"s":3,"n":75,"q":"下列祠廟之對聯，所指稱的人物，正確的是：","o":["千秋冤獄莫須有，青山有幸埋忠骨/百戰忠魂歸去來，白鐵無辜鑄佞臣──文天祥","千里而來，何必曰利，亦有仁義而已矣/百世之下，莫不興起，況于親炙之者乎──孔子","明月皓無邊，安排鐵板銅琶，我欲唱大江東去/春風睡正美，迢遞珠崖瓊島，更誰憐孤鶴南飛──蘇軾","可託六尺之軀，可寄百里之命，君子人與，君子人也/隱居以求其志，行義以達其道，吾聞其語，吾見其人──辛棄疾"],"a":[2]},{"s":3,"n":76,"q":"以上諸說，各為那一家的思想？","o":["儒家、法家、墨家、道家","法家、墨家、道家、儒家","道家、墨家、法家、儒家","法家、儒家、道家、墨家"],"a":[2],"p":25},{"s":3,"n":77,"q":"本文的主旨是：","o":["感慨聖賢稀有難遇","感慨聖賢不被重視","勸戒交友應當謹慎","感慨亂世難逢善人"],"a":[2],"p":26},{"s":3,"n":78,"q":"下列何者有誤：","o":["疏闊：不被重視","不世：非常難得","播越：居無定所","款狎：情投意合"],"a":[0]},{"s":3,"n":79,"q":"文中「是以與善人居，如入芝蘭之室，久而自芳也；與惡人居，如入鮑魚之肆，久而自臭也」，語近下列何者：","o":["見善，修然必以自信，見不善，愀然必以自省也","常人貴遠賤近，向聲背實，又患闇於自見","積土成山，風雨興焉，積水成淵，蛟龍生焉，積善成德，而神明自得","蓬生麻中，不扶自直，白沙在涅，與之俱黑"],"a":[3]},{"s":3,"n":80,"q":"墨子悲於染絲，是因為：","o":["人性本惡，其善者偽也","感嘆人近善則善，近惡則惡","世人交相攻訐，無有寧日","摩頂放踵，世人不解其苦辛"],"a":[1]},{"s":3,"n":81,"q":"所謂「不刊之論」是指：","o":["立論正確，不容改動","立論淺陋，不該刊載","新著初成，尚未公開","不便刊行，秘密傳閱"],"a":[0]},{"s":3,"n":82,"q":"「不惑之年」，是指：","o":["三十歲","四十歲","五十歲","六十歲"],"a":[1]},{"s":3,"n":83,"q":"「篳路藍縷」通常用來形容：","o":["捉襟見肘","創業維艱","風塵僕僕","疲於奔命"],"a":[1]},{"s":3,"n":84,"q":"下列成語那一組沒有「消極保守」的意涵？","o":["蹈常襲故，墨守成規","守株待兔，不識時務","奉行故事，步人後塵","明正典刑，懲惡勸善"],"a":[3]},{"s":3,"n":85,"q":"下列成語沒有錯別字的是：","o":["響譽國際","引恨黃泉","泉以暴治暴","備受爭議"],"a":[3]},{"s":3,"n":86,"q":"「雖善無徵」的「無徵」，其意是：","o":["不可辨別","不可設問","不可質疑","不可考證"],"a":[3],"p":27},{"s":3,"n":87,"q":"「雖善不尊」，意謂：","o":["雖善而不在尊位","雖善而不能尊德","雖善而不可尊賢","雖善而不別尊卑"],"a":[0]},{"s":3,"n":88,"q":"「故君子之道，本諸身」，意謂：","o":["所以君臨天下人，必須以自己的優質為根本","所以君臨天下人，必須以自己的權柄為根本","所以君臨天下人，必須以自己的生命為根本","所以君臨天下人，必須以自己的德性為根本"],"a":[3]},{"s":3,"n":89,"q":"「建諸天地而不悖」，意謂：","o":["建立守則而不懈怠","建立禮儀而不拘泥","建立大道而不背逆","建立律法而不錯誤"],"a":[2]},{"s":3,"n":90,"q":"「質諸鬼神而無疑」之「質」，意同以下何句之「質」？","o":["「文帝問釋之秦之敝，具以質言」","「質直而好義」","「質之在旁」","「君子義以為質」"],"a":[2]},{"s":3,"n":91,"q":"下列各詞語，完全沒有錯別字的選項是..","o":["相輔相承","離鄉背景","故步自封","搧風點火"],"a":[3]},{"s":3,"n":92,"q":"下列各詞語中皆有「稱」字，當「適合」解的是..","o":["「稱」心如意","「稱」兄道弟","「稱」薪而爨","「稱」觴上壽"],"a":[0]},{"s":3,"n":93,"q":"下列引號中的字，解釋正確的是..","o":["同仇敵「愾」：恨怒","求全「責」備：處罰","民胞物「與」：親近","矯俗「干」名：觸犯"],"a":[0]},{"s":3,"n":94,"q":"下列各文句引號內的成語，使用正確的選項是..","o":["他在「而立之年」，竟然老來得子，顯得非常開心","他不問什麼叫道德，只是「信口開河」，造謠生事","他對社會的貢獻真是「罄竹難書」，實在令人佩服","他們倆從小一起長大，真是「忘年之交」的好朋友"],"a":[1]},{"s":3,"n":95,"q":"下列文句，解說正確的是：","o":["桃李不言，下自成蹊：比喻事有定數，不必強求","十目所視，十手所指：形容為惡之人深受大眾所不齒","不憤不啟，不悱不發：說明知與行必須並重，不可以偏廢","月暈而風，礎潤而雨：比喻從某些徵兆可以推知將會發生的事情"],"a":[3]},{"s":3,"n":96,"q":"千里之行，始於□□：","o":["濫觴","眼前","足下","毫釐"],"a":[2]},{"s":3,"n":97,"q":"上無片瓦，下無□□之地：","o":["安床","立錐","繫馬","容身"],"a":[1]},{"s":3,"n":98,"q":"黃鐘毀棄，□□雷鳴：","o":["瓦釜","甕缶","管弦","鑼鼓"],"a":[0]},{"s":3,"n":99,"q":"燕雀安知□□之志：","o":["鷹犬","驍駿","龍虎","鴻鵠"],"a":[3]},{"s":3,"n":90,"q":"失之東隅，收之□□：","o":["絲麻","南畝","桑榆","西垣"],"a":[2]},{"s":4,"n":1,"q":"「異端虛無寂滅之教」，意謂：","o":["大道之外，崇尚農家、雜家之教","大道之外，崇尚墨家、道家之教","大道之外，崇尚名家、法家之教","大道之外，崇尚道家、佛家之教"],"a":[3],"p":28},{"s":4,"n":2,"q":"「其他權謀術數」的「權謀」，是指：","o":["陰陽權變","智計謀略","陰謀權詐","讖緯之學"],"a":[2]},{"s":4,"n":3,"q":"「充塞仁義者」，意謂：","o":["超出仁義者","推測仁義者","輔助仁義者","堵絕仁義者"],"a":[3]},{"s":4,"n":4,"q":"「晦盲否塞」，意謂：","o":["風雨如晦","薄暮冥冥","峰迴路轉","昏暗不通"],"a":[3]},{"s":4,"n":5,"q":"「反覆沉痼」，意謂：","o":["變常無定，積弊至重","變化多端，除弊更新","變數過多，不免有弊","轉暗為明，風清弊絕"],"a":[0]},{"s":4,"n":6,"q":"「而小儒規規焉」，意謂：","o":["而小儒道聽塗說","而小儒見識淺小","而小儒德薄能鮮","而小儒樂道人短"],"a":[1],"p":29},{"s":4,"n":7,"q":"「以君臣之義，無所逃於天地之間」，意謂：","o":["認為君臣之義是相得益彰的","認為君臣之義是天地排斥的","認為君臣之義是傳世久遠的","認為君臣之義是天經地義的"],"a":[3]},{"s":4,"n":8,"q":"「猶謂湯、武不當誅之」之「猶」，和下列何句之「猶」意思相同：","o":["「猶緣木而求魚也」","「宋榮子猶然笑之」","「馮先生甚貧，猶有一劍耳」","「君子蓋猶猶爾」"],"a":[2]},{"s":4,"n":9,"q":"「而妄傳伯夷、叔齊無稽之事」，意謂：","o":["而盛傳伯夷、叔齊不可質疑之事","而亂傳伯夷、叔齊不可考證之事","而好傳伯夷、叔齊不可相信之事","而紛傳伯夷、叔齊不可揭示之事"],"a":[1]},{"s":4,"n":10,"q":"「視兆人萬姓崩潰之血肉」的「兆人萬姓」，是指：","o":["文武百官","市井小民","廣大人民","官民皂隸"],"a":[2]},{"s":4,"n":11,"q":"此段話，「學校」是代表：","o":["公義","自由","平等","法律"],"a":[0],"p":30},{"s":4,"n":12,"q":"「養士」是學校的：","o":["大事","一事","兼事","奉事"],"a":[1]},{"s":4,"n":13,"q":"「天子之所是未必是，天子之所非未必非」是指要有對於是非的：","o":["隨附","堅持","不問","默認"],"a":[1]},{"s":4,"n":14,"q":"此段話的「天下」是指：","o":["全國","世界","全民","社會"],"a":[2],"p":31},{"s":4,"n":15,"q":"「天下為主」的「主」字，意義是：","o":["考慮","建議","領導","參考"],"a":[2]},{"s":4,"n":16,"q":"本篇之主旨應為：","o":["傷心石井之今非昔比，變成枯井，無人飲用","憑弔鄭成功當年驅荷反清的功業","遺憾鄭成功未能獨立建國成為真王","感慨石井地方開發過度，延平遺跡已難辨識"],"a":[1],"p":32},{"s":4,"n":17,"q":"第二句之「故老」意指：","o":["老朋友","老故事","故園和老地方的省稱","年老多閱歷的人"],"a":[3]},{"s":4,"n":18,"q":"「有明」一詞意指：","o":["明朝","有待天明，即期待出頭天","等待明天會更好","有明教恩仇難解之事"],"a":[0]},{"s":4,"n":19,"q":"有關五、六兩句「不信...咸知...」的敘述，下列何者正確？","o":["鄭成功家一門忠烈，效忠明朝","鄭芝龍亦為海上豪傑，開闢台灣","大家都知鄭成功才是真正的英雄人物","誰知道鄭經守土有責，也是英雄"],"a":[2]},{"s":4,"n":20,"q":"末句「俯仰江山落照中」所言「江山」實指：","o":["大唐江山已一去不返，不能恢復","大陸河山因距離遙遠，無法望見","眼前台灣之山河大地，令人唏噓","故國神遊亦美好無限，值得陶醉"],"a":[2]},{"s":4,"n":21,"q":"孔子曳杖而歌曰：「泰山其頹兮，梁木其壞乎，哲人其萎乎」，此歌之意在感嘆：","o":["時光飛逝","天地異變","賢人喪亡","惡人作亂"],"a":[2]},{"s":4,"n":22,"q":"「誇飾」是文學作品常使用的寫作手法，下列選項中，未使用誇飾法的是：","o":["五臟六腑裏，像熨斗熨過，無一處不伏貼；三萬六千個毛孔，像吃了人參果，無一個毛孔不暢快","今也天下之人怨惡其君，視之如寇讎，名之為獨夫，固其所也","見二蟲鬥草間，觀之，興正濃，忽有龐然大物，拔山倒樹而來，蓋一癩蛤蟆","歌吹為風，粉汗為雨，羅紈之盛，多於隄畔之草"],"a":[1]},{"s":4,"n":23,"q":"下列那一句中「為」字的意義，和其他三者不同？","o":["仲尼曰：「始作俑者，其無後乎！」「為」其象人而用之也（《孟子.梁惠王》）","神仙之說，所謂「為」蛇畫足（全祖望〈梅花嶺記〉）","余思粥，擔者即「為」買米煮之，果腹而歸（沈復〈閒情記趣〉）","善「為」我辭焉（《論語.雍也篇》）"],"a":[0]},{"s":4,"n":24,"q":"下列敘述何者正確？","o":["「他寫這篇文章，只為文過飾非而已。」句中兩個「文」字，音同義異","「媽媽對我常去同學家叨擾，嘮叨不已。」句中兩個「叨」字，音義皆異","「這棟大樓如期興建完成，業主非常高興。」句中兩個「興」字，音義皆同","「桂冠詩人的作品是一時之冠。」句中兩個「冠」字，音異義同"],"a":[1]},{"s":4,"n":25,"q":"下列各組「」內的字，所指色系完全不同的是：","o":["「碧」海青天╱金魄「翠」玉","青紅「皂」白╱「玄」端章甫","「縞」衣白冠╱唇若塗「朱」","「緇」衣青燈╱「黔」首黎民"],"a":[2]},{"s":4,"n":26,"q":"下列各組「」內的字，意義前後相同的是：","o":["縱一葦之所「如」，凌萬頃之茫然╱聲聲宛轉，「如」新鶯出谷","會「數」而禮勤，物薄而情厚╱勝負之「數」，存亡之理","寄身於翰墨，「見」意於篇籍╱時窮節乃「見」，一一垂丹青","如得其情，則哀「矜」而勿喜╱「矜」寡孤獨廢疾者，皆有所養"],"a":[2]},{"s":4,"n":27,"q":"「水色山光皆畫本╱□□□□是詩情」—這副懸掛在庭園的對聯，□□□□處最適合填入的是：","o":["花香鳥語","萬紫千紅","樓前花草","星辰日月"],"a":[0]},{"s":4,"n":28,"q":"下列各組句子中，「」內的字義，都作「賣」解的是：","o":["守羊無食，何不「貨」羊糴米（《南史.卞彬傳》）/有鄉人「貨」梨於市，頗甘芳（《聊齋志異.種梨》）","嫗以釵授婦，使姑質錢「市」米，三日外請復相見（《聊齋志異.王成》）/願為「市」鞍馬，從此替爺征（〈木蘭詩〉）","有錢但「沽」酒，莫買南山田（利登〈沽酒詩〉）/有美玉於斯，韞匵而藏諸？求善賈而「沽」諸（《論語.子罕》）","雖撤屋伐木、雇妻「鬻」子，僅可供給催租吏卒酒食之費（《五代史平話.梁史.卷上》）/置於市，賈十倍，人爭「鬻」之，予貿得其一（劉基〈賣柑者言〉）"],"a":[0]},{"s":4,"n":29,"q":"清代台灣詩人陳尚恂七言律詩：「誰家老圃影橫斜，曳杖尋秋感鬢華。便擬古梅探雪海，難攜片石上星槎。重陽野外無停屐，薄暮城頭有斷笳。待得王郎來送酒，陶公三徑已開花」，請問下列詩句中的季節，何者與此詩不同？","o":["停車坐愛楓林晚，霜葉紅於二月花","遙知兄弟登高處，遍插茱萸少一人","菡萏香消翠葉殘，西風愁起綠波間","山山綠遍相思樹，正是江南草長時"],"a":[3]},{"s":4,"n":30,"q":"下列詞語由少而長依序排列，正確的是：","o":["垂髫/弱冠/而立/強仕","總角/襁褓/及笄/而立","弱冠/束髮/不惑/黃髮","襁褓/垂髫/耳順/弱冠"],"a":[0]},{"s":4,"n":31,"q":"歸隱是中國文人常有的選擇，下列那一個選項，含有「勸人歸隱」之意？","o":["聖代無隱者，英靈盡來歸。遂令東山客，不得顧採薇","鳥獸不可與同群，吾非斯人之徒與而誰與","鳳兮鳳兮，何德之衰？往者不可諫，來者猶可追。已而已而，今之從政者殆而","聖主常徵賢，群公每舉德。願謝山中人，迴車首歸躅"],"a":[2]},{"s":4,"n":32,"q":"古詩十九首：「生年不滿百，常懷千歲憂。晝短苦夜長，何不秉燭遊。為樂當及時，何能待來茲」，詩中所傳達的人生觀與下列何者相近？","o":["南箕北有斗，牽牛不負軛。良無盤石固，虛名復何益","願飛安得翼，欲濟河無梁。向風長嘆息，斷絕我中腸","出西門，步念之。今日不做樂，當待何時","豈不常勤苦，羞與黃雀群。何時當來儀，將須聖明君"],"a":[2]},{"s":4,"n":33,"q":"下列各組詞語皆與時間有關的是：","o":["千慮一得/朝三暮四/日上三竿","一日三秋 望"],"a":[1]},{"s":8,"n":57,"q":"下列敘述，正確的是：甲、李珣<南鄉子>以旁觀者所見，描寫南國夏日風光乙、朱敦儒<相見歡>寫金陵城上欣賞秋色之樂，內容與詞牌名相合丙、<木蘭詩>多類疊句，反覆詠嘆，具有北方民歌色彩丁、張繼<楓橋夜泊>明指旅客夜宿的地點，以「落」「愁」暗寓亡國之痛戊、<庭中有奇樹>隔句協韻，對仗整齊，是一首懷念親友的五律己、陳子昂<登幽州臺歌>是一首樂府詩，登樓望遠，對宇宙人生興起感慨","o":["乙戊","甲丁","丙己","甲丙"],"a":[3]},{"s":8,"n":58,"q":"下列各句的解釋，何者正確？","o":["去惡如農夫之務去草焉—鼓勵大家要效法農夫努力耕作","天外飛來一筆—比喻人說話天花亂墜，花言巧語","得失無動於衷—不論成功或失敗，都不會動心","生也有涯而知也無涯—學問和生命都有一定的限制，所以要好好把握"],"a":[2]},{"s":8,"n":59,"q":"有一句諺語說：「人生就像下一盤棋。」而西方人對這句話又作了三點注釋：贏不了，和不了，而又不能下下，這樣一來，人生好像變得是對命運作一種無可奈何的博鬥，這是很消極的講法；事實上，「人生就像下一盤棋」這句話告訴我們的應該是：要時時抱著謹慎、專心的態度來迎接下一個時辰，為將來作最好的布局。因為生命的結束。並不是代表棋局的結束。對一個放棄為理想奮鬥的人而言，他早就已經出局了；而對一個已經完成畢生心願、達到理想目標的人來說，他就已經是下贏這盤棋。「朝聞道，夕死可矣」，並不是說一定要死。人一生中的成就，是可以持續的，生命本來就綿延不斷。名作家契訶夫曾經這樣說：「快要枯死的小草，還在拚命地、熱心地對別人說，它是無罪的，只是太陽無情地想要把它曬死，但它還是堅持生命的熱情和欲望，說自己還年輕，要不是太陽的炙熱，它還是很美麗的。」各位朋友！生命可以是燦爛的，只要您從燦爛的角度去看，希望您能在您的棋局裡，有出眾的表現。下列哪句話和本文意旨最不相關？","o":["人生多美好","哀莫大於心死","人的生命可以「死而不死」","快樂之權操之在己"],"a":[2]},{"s":8,"n":60,"q":"各句所反映的季節，何者與其它三者不同？","o":["千里鶯啼綠映紅，水村山郭酒旗風","停車坐愛楓林晚，霜葉紅於二月花","易水蕭蕭西風冷，滿坐衣冠似雪","寒蟬淒切，對長亭晚，驟雨初歇"],"a":[0]},{"s":8,"n":61,"q":"下列各句，何者沒有錯別字？","o":["戀人相視總是含情默默，一切盡在不言中","經過老師的講解後，我終於壑然開朗，心中不再有疑問了","做任何事都要堅持到最後一刻，否則功虧一匱，仍然失敗","他說話總喜歡掉弄玄虛，結果惹來不必要的麻煩"],"a":[3]},{"s":8,"n":62,"q":"由上文可知，出國旅遊而又不知當地電壓規格時，最好使用哪一種充電座？","o":["A型","B型","C型","D型"],"a":[3]},{"s":8,"n":63,"q":"下列各句，何者所描寫的時間與本詩最接近？","o":["旭日高升之後，市聲喧騰，鳥兒就沉默了","晚霞悄悄為湖心的春秋雙塔影像染上色彩","半昧不明的曙色裡，樹影在窗，鳥聲未起","無須警告我夜有多深，該打四鼓或三更了"],"a":[3],"p":56},{"s":8,"n":64,"q":"精靈將錯字修改後，下列哪一文句中還有錯字？","o":["一列沒有車次的貨車","戴著不詳的貨物","從火車時刻表外","闖過夢的平交道請翻頁繼續作答"],"a":[1],"p":56},{"s":8,"n":65,"q":"下列各組「」內的讀音，何者兩兩相同？","o":["「懾」人心魄/「躡」手躡腳","滋味甘「醇」/「諄」諄教誨","疏「浚」河道/如期「竣」工","「稗」官野史 /「禆」益良多"],"a":[2]},{"s":8,"n":66,"q":"下列詞語，何者與陶淵明〈桃花源記〉：「乃不知有漢，無論魏晉」的「無論」意義相同？","o":["不論","不管","遑論","無關"],"a":[2]},{"s":8,"n":67,"q":"下列文句「」內詞義的解釋，何者正確？","o":["諸葛亮〈出師表〉：斟酌損益，進盡忠言；「斟酌」意謂權衡考慮","丘遲〈與陳伯之書〉：聞鳴鏑而股戰，對穹廬以屈膝；「戰」意謂戰鬥","司馬遷〈鴻門之宴〉：今入關，財物無所取，婦女無所「幸」；「幸」意謂獲得幸福","蘇軾〈留侯論〉：太史公疑子房以為魁梧奇偉，而其狀貌乃如婦人女子，「不稱」其志氣； 「不稱」意謂不稱許"],"a":[0]},{"s":8,"n":68,"q":"閱讀下文，並推斷科學家以何者分析事物？ 科學
