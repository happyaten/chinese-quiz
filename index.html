為君下","o":["舟車勞頓之苦","富貴成空之苦","夫妻新婚之樂","友情真摯之樂"],"a":[3]},{"s":8,"n":81,"q":"閱讀下文，並推斷「」內文句的涵義是什麼？ 曾幾何時，「一分鐘九十字的效率，取代紙上耕耘的筆跡」，過目即忘的冷漠，取代永誌於心的感動。（ 李欣頻《誠品副作用》）","o":["電子新聞取代報紙","電話通訊取代書信","電腦打字取代手寫","電動字幕取代海報"],"a":[2]},{"s":8,"n":82,"q":"下列詩句，何者沒有動詞？","o":["北斗七星高","哥舒夜帶刀","至今窺牧馬","不敢過臨洮"],"a":[0]},{"s":8,"n":83,"q":"下列文句的「使」，何者具有「派遣」的涵義？","o":["「使」民敬忠以勸，如之何","「使」君有婦，羅敷有夫","若「使」燭之武見秦君，師必退","不宜偏私，「使」內外異法也"],"a":[2]},{"s":8,"n":84,"q":"下列文句，何者沒有「倘若......，則......」的涵義？","o":["四維不張，國乃滅亡","不憤，不啟；不悱，不發","德之不修，學之不講，聞義不能徙，不善不能改","君子三年不為禮，禮必壞；三年不為樂，樂必崩"],"a":[2]},{"s":8,"n":85,"q":"下列文句，何者沒有使用「譬喻」的修辭技巧？","o":["你的瘦骨宛如長河落日，我的浮思則如大漠孤煙","下午剛下過一陣雨，日頭已斜西，夏雲還連袂遊蕩未肯散","雨點貫串做絲，無數麻瘢似的水渦，隨生隨滅，息息不停","過去的日子如輕煙，被微風吹散了；如薄霧，被初陽蒸融了"],"a":[1]},{"s":8,"n":86,"q":"下列文句，何者使用「以具體事物比擬具體事物」的修辭技巧？","o":["大清早，妻就拿著菜籃子撿拾滿滿一籃子蟬聲回來","鄉農額角上疊疊的深皺，像極了海岸上那層層疊疊的沖積岩層","在火車上這樣張望，心裡正有一種歲月悠悠沉鬱，壓在那裡，不由分說","我們渾樸的天真是像含羞草似的嬌柔，一經同伴的抵觸，他就捲了起來"],"a":[1]},{"s":8,"n":87,"q":"下列關於先秦諸子學說的敘述，何者不正確？","o":["韓非思想以「法」為重，是法家集大成者","孔子雖身處亂世，卻始終懷抱仁民愛物的理想","莊子認為必須擺脫名利的束縛，才能獲得精神的自由","孟子師事於孔子，莊子受業於老子，韓非從學於荀子"],"a":[3]},{"s":8,"n":88,"q":"閱讀下文，並推斷何者為其歌詠的人物？ 不肯過江東，玉帳匆匆，至今草木懷英雄，唱著虞兮當日曲，便舞東風。（ 辛棄疾〈浪淘沙〉）","o":["周瑜","宋江","項羽","諸葛亮"],"a":[2]},{"s":8,"n":89,"q":"閱讀下文，並推斷內應該是哪一本小說？ 唐代文學家韓愈記敘自己苦讀的情形是焚膏油以繼晷，這種夜以繼日的勤奮精神，我是無法學習的，因為深夜讀書一想起中的鬼狐世界，就覺得氣氛詭異，擔心冷不防從背後的木櫃，伸出一隻手來。","o":["《紅樓夢》","《聊齋誌異》","《三國演義》","《儒林外史》"],"a":[1]},{"s":8,"n":90,"q":"閱讀下文，並依序為「甲」、「乙」選擇恰當的詩人。唐代是詩歌的盛世，不僅作詩成為自天子以至庶人的全民運動，詩壇更是名家輩出。「甲」以寫田園景色、隱逸生活為主，但因仕途不順，時抒發懷才不遇之感，是盛唐田園詩的重要作家。「乙」早年懷抱以詩歌改革政治的理想，以新樂府寫諷諭詩，是中唐社會寫實詩的健將。","o":["孟浩然/白居易","孟浩然/杜甫","王維/白居易","王維/杜甫"],"a":[0]},{"s":8,"n":91,"q":"依據上文，下列詞語何者最適合形容佛印？","o":["慧黠幽默","慈悲為懷","逆來順受","發憤忘食"],"a":[0],"p":57},{"s":8,"n":92,"q":"蘇軾、黃庭堅、佛印三人所吟的四言短詩，「天何言哉」、「得其所哉」、「人焉廋哉」均引用古代經典的文句。下列關於他們用典的敘述，何者正確？","o":["黃庭堅引用「得其所哉」，意在形容漁獲豐富，人民安居樂業","蘇軾引用「天何言哉」，意在感慨去日苦多，只能無語對蒼天","佛印引用「人焉廋哉」，意在譏諷蘇、黃欺瞞朋友，隱匿佳餚","蘇、黃用典強調美景重於美食，佛印用典則強調美食重於美景"],"a":[2]},{"s":8,"n":93,"q":"依據此詩，下列詩句「」內詞義的解釋，何者不正確？","o":["城春草木「深」；「深」意謂沈落","「烽火」連三月；「烽火」意謂戰爭","「國破」山河在；「國破」意謂長安淪陷","「感時」花濺淚；「感時」意謂感嘆時局"],"a":[0],"p":58},{"s":8,"n":94,"q":"依據此詩，「白頭搔更短，渾欲不勝簪」隱含作者心中最深沈的憂慮是什麼？","o":["家國動盪，百姓流離","時運不濟，前途茫然","官場失意，升遷無望","田園荒蕪，生活貧困"],"a":[0],"p":58},{"s":8,"n":95,"q":"下列關於此詩「格律、風格、文體」的敘述，何者正確？","o":["屬於五言古詩","沒有對仗句法","風格浪漫飄逸","深、心、金、簪押韻"],"a":[1],"p":58},{"s":8,"n":96,"q":"依據上文，下列韻文，何者產生最晚？","o":["楚辭","五言絕句","五言古詩","七言律詩"],"a":[1],"p":59},{"s":8,"n":97,"q":"依據上文，何者是「一切文體所以由盛轉衰」的原因？","o":["作家缺乏危機意識","豪傑之士江郎才盡","舊體習套難以突破","格律鬆散流於空洞"],"a":[0],"p":59},{"s":8,"n":98,"q":"下列關於此詩主旨的敘述，何者正確？","o":["抒發悲天憫人的胸懷","呈顯寂寞空虛的心靈","表現自信狂傲的性格","展露少不經事的稚氣"],"a":[3],"p":60},{"s":8,"n":99,"q":"下列關於此詩寫作技巧的敘述，何者正確？","o":["以「長嗥」代指恆常的嘆息","藉「涼風颯颯」表達內心的空虛","以「天地戰慄」襯託狼嗥的氣勢","藉「先知」形容「獨來獨往」的個性"],"a":[3],"p":60},{"s":8,"n":100,"q":"依據上文，作者特別舉出哪一個例子，證明其他人也喜愛鄉村生活？","o":["鄉民喜愛冬天的陽光與空氣","城市工人無奈的滯留都市","家人在火爐邊享受天倫之樂","富翁享受鄉村奢侈的樂趣"],"a":[1],"p":61},{"s":8,"n":101,"q":"依據上文，作者主要運用何種寫作技巧，支持冬天應住鄉村的論點？","o":["鮮明對比","生動譬喻","感性抒情","明褒暗貶"],"a":[2],"p":61},{"s":9,"n":1,"q":"下列各組詞語「」內的字，讀音完全相同的選項是：","o":["「嗟」歎不已╱「蹉」跎時日╱山勢「嵯」峨","「貽」人笑柄/甘之如「飴」/不忍欺「紿」","鶼「鰈」情深/「喋」喋不休/最後通「牒」","深「諳」世故╱喉嚨「喑」啞╱「黯」然失色"],"a":[2]},{"s":9,"n":2,"q":"下列文句中的「以」字，意義與其他選項不同的是：","o":["《左傳.燭之武退秦師》：晉侯、秦伯圍鄭，「以」其無禮於晉，且貳於楚也","范仲淹〈岳陽樓記〉：不「以」物喜，不以己悲。居廟堂之高，則憂其民；處江湖之遠，則憂其君","曹丕〈典論論文〉：西伯幽而演《易》，周旦顯而制《禮》；不「以」隱約而弗務，不以康樂而加思","曾鞏〈墨池記〉：推王君之心，豈愛人之善，雖一能不以廢，而因以及乎其跡邪？其亦欲推其事「以」勉學者邪"],"a":[3]},{"s":9,"n":3,"q":"「互文足義」的情況之一，指篇中某一句內的上下兩個意義單位，並非個別獨立，而必須統整在一起作互補的解釋，文意始能完足。如文天祥〈正氣歌〉「雞棲鳳凰食」，意指雞和鳳凰同居共食。「雞棲」、「鳳凰食」在此句中，不是個別獨立的兩個意義單位，而必須作統整、互補的解釋。下列詩句，符合「互文足義」的選項是：","o":["杜牧〈泊秦淮〉：煙籠寒水月籠沙","晏殊〈清平樂〉：鴻雁在雲魚在水","蘇軾〈東欄梨花〉：梨花淡白柳深青","歐陽脩〈答謝景山遺古瓦硯歌〉：力彊者勝怯者敗"],"a":[0]},{"s":9,"n":4,"q":"王國維《宋元戲曲史》：「古代文學之形容事物也，率用古語，其用俗語者絕無。又所用之字數亦不甚多。獨元曲以許用襯字故，故輒以許多俗語，或以自然之聲音形容之。此自古文學上所未有也。」如《西廂記》之〈得勝令〉：驚覺我的是□□□竹影走龍蛇，虛飄飄莊周夢蝴蝶，□□□促織兒無休歇，韻悠悠砧聲兒不斷絕，□□□傷別。急煎煎好夢兒應難捨，冷清清的咨嗟，嬌滴滴玉人兒何處也？上文□□□處的詞語，依序最適合填入的選項是：","o":["顫巍巍╱絮叨叨╱痛煞煞","痛煞煞╱絮叨叨╱顫巍巍","絮叨叨╱顫巍巍╱痛煞煞","顫巍巍╱痛煞煞╱絮叨叨"],"a":[0]},{"s":9,"n":5,"q":"有些文學作品，在上句句尾與下句句首的位置，安排重複的詞語，以顯現連綿不絕的情意，如〈飲馬長城窟行〉：「青青河畔草，綿綿思遠道。遠道不可思，宿昔夢見之。夢見在我旁，忽覺在他鄉」即是。下引現代詩的表現方式類似上述情況，呈現了連續不斷的欣喜之情。其文句排序，最適當的選項是：這支歌聲最初曾在我的心中爆裂的闡發甲、當黎明躍起乙、玫瑰之綻開黎明丙、亦如盈盈的露水之綻開玫瑰丁、我就聽到溢滿林間的呼喚戊、而這呼喚也像是跟隨著一種雷鳴而來（彭邦楨〈聯想〉）","o":["甲丙乙丁戊","丙乙甲丁戊","丙乙丁戊甲","戊丁乙丙甲"],"a":[1]},{"s":9,"n":6,"q":"下列文句均與季節有關。就其所描寫的景色、情境，依春夏秋冬物候變化之先後為序，排列正確的選項是：甲、那時暄氣初消，月正圓，蟹正肥，桂花皎潔，也未陷入凜冽蕭瑟氣態，這是最值得賞樂的乙、一地李花，飄零似雪，也為我翌日晨曉推窗時牽起家國之思來，這種思念，經過日光烘托，益其溫暖爛漫，浩浩蕩蕩，明媚千萬里，天涯便也近在咫尺了丙、近前光晃晃的柏油路面，熱得實在看不到什麽了。稍遠一點的地方的景象，都給蒙在一層黃膽色的空氣的背後，他再也不敢望穿那一層帶有顔色的空氣看遠處丁、南方的黃梅天的確糟糕得可以。天，老是陰沉沉地布滿厚重的破棉絮似的雲，雨是天天下，但下得又不乾脆：有時翻江倒海下一個整天整夜，有時竟連綿到三四天戊、松濤如吼，霜月當窗，饑鼠吱吱在承塵上奔竄。我於這種時候，深感到蕭瑟的詩趣，常常獨自撥劃著爐火，不肯就睡，把自己擬諸山水畫中的人物，作種種幽邈的遐想","o":["乙丙丁戊甲","乙丁丙甲戊","丁乙丙戊甲","丁丙乙甲戊"],"a":[1]},{"s":9,"n":7,"q":"古典詩歌常見「對仗」技巧，下列詩句對仗最為工整的選項是：","o":["少婦城南欲斷腸，征人薊北空回首","洛陽游絲百丈連，黃河春冰千片穿","不見柏梁銅雀上，寧聞古時清吹音","紅泥亭子赤欄干，碧流環轉青錦湍"],"a":[0]},{"s":9,"n":8,"q":"傳統建築常懸掛楹聯，以凸顯建物主題，增添人文情趣。下列各選項中的楹聯，何者與建物主題配置不當？","o":["松聲竹聲鐘磬聲，聲聲自在；山色水色煙霞色，色色皆空──用於書院","真實不虛，大慈悲，度一切苦厄；意識無界，空色相，現五蘊光明──用於觀音祠","望重南陽，想當年羽扇綸巾，忠貞扶季漢；澤周西蜀，愛此地浣花濯錦，香火擁靈祠──用於諸葛亮祠","天下名山僧占多，也該留一二奇峰，棲吾道友；世間好語佛說盡，誰識得五千妙論，出我仙師──用於道觀"],"a":[0]},{"s":9,"n":9,"q":"白居易〈琵琶行并序〉「妝成每被秋娘妒」，乃通過側寫旁人的反應，呈現琵琶女的美麗；相較於由容貌服飾正面描寫美女的手法，有時更為高妙。下列對「美女」的敘述，也採用「側寫」的選項是：","o":["曹植〈洛神賦〉：丹脣外朗，皓齒內鮮","杜甫〈麗人行〉：態濃意遠淑且真，肌理細膩骨肉勻","李白〈于闐采花〉：明妃一朝西入胡，胡中美女多羞死","徐賢妃〈賦得北方有佳人〉：腕搖金釧響，步轉玉環鳴"],"a":[2]},{"s":9,"n":10,"q":"甲、□□的秋水深淺/怎樣測得出一尾魚的體溫/想想莫非自得其樂/泥塗之龜/畢竟要比供奉楚廟活得自由乙、我的靈魂要到□□去/去洗洗足/去濯濯纓/去飲我的黃驃馬/去聽聽伯牙的琴聲/我的靈魂要到汩羅去/去看看我的老師老屈原/問問他認不認得莎孚和但丁/再和他同吟一葉蘆葦/同食一角米粽丙、雨潤過/飛白/藍天在/裱褙整張下午/柳枝老是寫著/一個燕字/而青蟲死命地讀/蛛網那本/線裝的□□/生門何在/卦象平平上引三段現代詩，□□處依序最適合填入的選項是：","o":["屈原/滄浪/《易經》","屈原/天池/《詩經》","莊子/滄浪/《易經》","莊子/天池/《詩經》"],"a":[2]},{"s":9,"n":11,"q":"古人「字」、「號」，來由不一。下列關於古人「字」、「號」的敘述，錯誤的選項是：","o":["蘇軾自號「東坡居士」，乃因其謫居黃州，築室於東坡之故","白居易自號「醉吟先生」，乃用以呈現其放意詩酒的人生態度","韓愈字「退之」，乃因其名「愈」，而以反義的「退之」為其字","李白號「青蓮居士」，乃因其偏愛蓮花之清新脫俗，有類其詩風之故"],"a":[3]},{"s":9,"n":12,"q":"文學作品中人物說話的「語氣」，可呈現其性格、情緒與心情；語氣可有平淡、誠懇、欣喜、不滿、憤怒、嘲諷、譏刺、諧謔、自負、自嘲......等。下列關於說話者「語氣」的解釋，正確的選項是：","o":["〈劉姥姥〉：「劉姥姥便站起身來，高聲說道：『老劉！老劉！食量大如牛，吃個老母猪不抬頭！』」顯示出劉姥姥的自負心態","〈鴻門宴〉：「亞父受玉斗，置之地，拔劍撞而破之，曰：『唉！豎子不足與謀！奪項王天下者，必沛公也，吾屬今為之虜矣！』」顯現范增莽撞而不能顧全大局的個性","〈馮諼客孟嘗君〉：「（齊王）謝孟嘗君曰：『寡人不祥，被於宗廟之祟，沉於諂諛之臣，開罪於君。寡人不足為也，願君顧先王之宗廟，姑反國統萬人乎？』」顯現齊王因不滿孟嘗君門客太多，遂故加嘲諷的心態","〈虬髯客傳〉：「道士對弈，虬髯與靖旁侍焉。俄而文皇來，......道士一見慘然，下棋子曰：『此局全輸矣！於此失卻局哉！救無路矣！"],"a":[3]},{"s":9,"n":13,"q":"「馬蹄聲，孤獨又憂鬱地自遠至近，灑落在沈默的街上如白色的小花朵」句中，將屬於聽覺形象的馬蹄聲，巧妙比擬為視覺形象的白色小花，使無影無形的聲音，通過有形有色的花朵而具體化。下列文句將聽覺形象比擬為視覺形象的選項是：","o":["鼓聲起處，船便如一支沒羽箭，在平靜無波的長潭中來去如飛","那小高樓上即刻發出求救的燈語，一明一滅著，有如乞兒的淚珠","讀舊日友人書/乃有眾多管弦之音打從心窩裡升起/首先是一組瀏亮的喇叭/像一群藍色小鳥撲著翅膀","他在花瓶旁邊的煙灰盒中，抖掉了紙煙上的灰燼，那紅的煙火，就越紅了，好像一朵小花似的，和他的袖口相距離著"],"a":[2],"p":62},{"s":9,"n":14,"q":"閱讀下列文字後作答：孩子，你真是快活呀！一早晨坐在泥土裡，耍著折下來的小樹枝兒。我微笑著看你在那裡耍弄那根折下來的小樹枝兒。我正忙著算帳，一小時一小時在那裡加疊數字。也許你在看我，心想：「這種好沒趣的遊戲，竟把你一早晨的好時間浪費掉了！」孩子，我忘了聚精會神玩耍樹枝與泥餅的方法了。我尋求貴重的玩具，收集金塊與銀塊。你呢，無論找到什麼便去做你的快樂的遊戲；我呢，卻把我的時間與力氣都浪費在那些我永不能得到的東西上。我在我的脆薄的獨木船裡掙扎著，要航過欲望之海，竟忘了我也是在那裡做遊戲了。（泰戈爾《新月集.玩具》）依據上文文意，下列敘述錯誤的選項是：","o":["「我」羨慕孩子能隨時隨地盡情快樂的遊戲，感歎自己早已失去這種心情","「我」明白自己的玩具貴重，懊悔自己常浪費時間精力在其他無謂的追求上，而忘了專注於金錢遊戲","本文旨在透過孩子與「我」的對比，表達類似蘇軾〈臨江仙〉「長恨此身非我有，何時忘卻營營」的感慨","作者以「我」駕著脆薄的獨木船航過欲望之海，比喻成人陷溺於既危險又充滿誘惑的遊戲中，無法自拔，卻仍汲汲追求"],"a":[1],"p":62},{"s":9,"n":15,"q":"閱讀下列文字後作答：邊韶字孝先，陳留浚儀人也。以文章知名，教授數百人。韶口辯，曾晝日假臥，弟子私嘲之曰：「邊孝先，腹便便。懶讀書，但欲眠。」韶潛聞之，應時對曰：「邊為姓，孝為字。腹便便，五經笥。但欲眠，思經事。寐與周公通夢，靜與孔子同意。師而可嘲，出何典記？」嘲者大慚。（《後漢書.邊韶傳》）依據上文，下列敘述不當的選項是：","o":["邊韶不僅飽讀詩書，擅長文章，且口才流利，富機智反應","文中「寐與周公通夢，靜與孔子同意」，暗用《論語》孔子曰「久矣，吾不復夢見周公」的典故","「腹便便」讀為「腹ㄆㄧㄢˊㄆㄧㄢˊ」，學生本用以嘲笑邊韶身材肥胖，邊韶則用以自喻博學多聞","文中邊韶說「師而可嘲，出何典記」，目的在考核學生熟讀經典的能力，而學生無法回答，故「嘲者大慚」"],"a":[3],"p":62},{"s":9,"n":16,"q":"閱讀下列文字後作答：趙襄主學御於王於期，俄而與於期逐，三易馬而三後。襄主曰：「子之教我御，術未盡也。」對曰：「術已盡，用之則過也。凡御之所貴，馬體安於車，人心調於馬，而後可以進速致遠。今君後則欲逮臣，先則恐逮於臣。夫誘道爭遠，非先則後也。而先後心皆在於臣，上何以調於馬？此君之所以後也。」（《韓非子.喻老》）文中以學習駕馭車馬為例，主要在闡明：","o":["快馬加鞭，進速致遠，才能成功","時時競逐，有先後心，方能致勝","誘道爭遠，非先則後，無須計較","調御自如，忘懷得失，始能致遠"],"a":[3],"p":62},{"s":9,"n":17,"q":"下列各「」中的書信用語，適合其使用情境的選項是：","o":["王大明寫信給任職公司的主管，結尾書寫「職王大明筆」","王大明寫信給任職公司的主管李經理，開頭書寫「李經理賜鑒」","王大明寫信給好友，在信中提及自己的父母，使用「令尊」、「令堂」","王大明寫信給高中導師耿精明，信封中間受信人的欄位書寫「耿精明老師台啟」"],"a":[1]},{"s":9,"n":18,"q":"下列各選項中，「」內字音三者全同的是：","o":["神「僊」眷侶╱緣「慳」一面╱「緘」默以對","視如「瑰」寶╱「畦」畎相望╱「跬」步不休","打通經「絡」╱暗行賄「賂」╱「犖」犖大者","雨「霽」天青╱黍「稷」稻粱╱按圖索「驥」"],"a":[3]},{"s":9,"n":19,"q":"下列文句中的「幸」字，意義與其他選項不同的是：","o":["（張）良曰：始臣起下邳，與上會留，此天以臣授陛下，陛下用臣計，「幸」而時中；臣願封留足矣，不敢當三萬戶","四年之間，奔走不暇，未知明年又在何處，豈懼竹樓之易朽乎？「幸」後之人與我同志，嗣而葺之，庶斯樓之不朽也","（周）瑜曰：先生之言，甚合吾意。但今軍中正缺箭用，敢煩先生監造十萬枝箭，以為應敵之具。此係公事，先生「幸」勿推卻","當此時，彭越數反梁地，絕楚糧食。項王患之，為高俎，置太公"],"a":[0]},{"s":9,"n":20,"q":"下列文句「」內的兩個字，是由動詞並列組成一個詞組的選項是：","o":["博聞彊志，明于「治亂」，嫻于辭令","公子聞所在，乃「間步」往，從此兩人游，甚歡","人情有所不能忍者，匹夫「見辱」，拔劍而起，挺身而鬥，此不足為勇也","獨韓愈奮不顧流俗，犯笑侮，收召後學，作〈師說〉，因抗顏而"],"a":[3]},{"s":9,"n":21,"q":"古人言談、行文常使用「謙詞」，以示自我謙抑。下列文句「」內的詞語，屬於謙詞的選項是：","o":["句踐之困於會稽而歸，「臣妾」於吳者，三年而不倦","若舍鄭以為「東道主」，行李之往來，共其乏困，君亦無所害","今南方已定，兵甲已足，當獎率三軍，北定中原，庶竭「駑鈍」，攘除姦凶，興復漢室，還于舊都","( 孟嘗君 ）謝曰：文倦於事，憒於憂，而性懧愚，沉於國家之事，開罪於先生。先生「不羞」，乃有意欲為收責於薛乎"],"a":[2]},{"s":9,"n":22,"q":"甲、有個美國友人來信說：孩子幼小時□在你腳尖上，長大了□在你心尖上。（琦君《桂花雨‧媽媽，給你快樂》）乙、秋陽似酒，雖稍嫌辛辣，卻已是老炭文火，靜靜□著他的世界。他的世界在這秋日的午後，慢慢□熟。（劉大任〈秋陽似酒〉）丙、米亞屋裡□滿百香果又酸又甜的蜜味，像金紅色火山岩漿□出窗縫、門縫，從陽臺電梯流瀉直下灌滿寓樓。（朱天文〈世紀末的華麗〉）上引各文，前後兩個□都是動詞，並且是相同的字。根據各文文意，依序最適合填入□內的選項是：","o":["立/烘/飄","踮/燜/浮","繫/烤/漲","踩/燉/溢"],"a":[3]},{"s":9,"n":23,"q":"下列文字，依文意排列，順序最恰當的選項是：「看哪，這樣的雲彩和天色！甲、過一會你才明白乙、宇宙的深處乃在這山狀雲彩的邊緣及狹灣處─純潔與秩序的至高無上之象徵丙、黑暗的柔軟的只是雲彩丁、其實，宇宙的神祕與深度不是雲彩與黑暗可以表現出來的戊、第一眼你可能會認為黑暗處就是深的地方深度只有在光明、寧靜的地方才能找到。」（赫塞《玻璃珠遊戲》）","o":["乙戊甲丁丙","乙丙戊甲丁","戊甲丙乙丁","丙戊丁甲乙"],"a":[2]},{"s":9,"n":24,"q":"閱讀下列現代詩後作答：「打開自己珍藏的詩稿發現只有無題詩三首╱一首我拿起來一口一口吃下╱一首拿給妻為冬日的生活點火╱另一首我想，只有寄給你」（落蒂〈淒涼〉）有關本詩，解讀不當的選項是：","o":["「自己珍藏的詩稿」，指的是詩人自己所寫的詩作","「一首我拿起來一口一口吃下」，意指詩人稱許此詩充滿滋味，耐人咀嚼","「一首拿給妻為冬日的生活點火」，意指詩人有時亦不得不為應付現實生活而低頭","「另一首我想，只有寄給你」，在「我想」之後特別加一逗點，音節略有停頓，更可見下句的「你」應是詩人心目中極重要的一"],"a":[1]},{"s":9,"n":25,"q":"閱讀下列文字後作答：孔子明王道，干七十餘君，莫能用，故西觀周室，論史記舊聞，興於魯而次《春秋》。上記隱（公），下至哀（公）之獲麟。......七十子之徒，口受其傳指，為有所刺譏褒諱挹損之文辭，不可以書見也。魯君子左丘明，懼弟子人人異端，各安其意，失其真，故因孔子史記，具論其語，成《左氏春秋》。（《史記‧十二諸侯年表‧序》）根據上述《史記》文字，下列敘述，正確的選項是：","o":["據上下文意，司馬遷認為《左氏春秋》無法闡釋《春秋經》的旨意","文中「論史記舊聞」的「史記」，泛指古代史書；「孔子史記」則指《春秋》","「人人異端」的「異端」，意同《論語》中孔子所說「攻乎異端，斯害也已」的「異端」","文中「為有所刺譏褒諱挹損之文辭，不可以書見也」，可用以說"],"a":[1]},{"s":9,"n":26,"q":"中國語文基於形、音、義的種種特質，形成別具美感的對仗聯句。下列不符對聯條件的選項是：","o":["風自涼經松越峭；月原明映水逾清","非關因果方為善；不計科名始讀書","海納百川，有容乃大；壁立千仞，無欲則剛","韓侯一將壇，諸葛三分漢；功名紙半張，富貴十年限"],"a":[3]},{"s":9,"n":27,"q":"下列七言詩作，依內容判讀，分類不當的選項是：","o":["柳花深巷午雞聲，桑葉尖新綠未成。坐睡覺來無一事，滿窗晴日看蠶生─屬田園詩","洞房昨夜停紅燭，待曉堂前拜舅姑。妝罷低聲問夫婿，畫眉深淺入時無─屬閨怨詩","烽火城西百尺樓，黃昏獨坐海風秋。更吹羌笛關山月，無那金閨萬里愁─屬邊塞詩","千里鶯啼綠映紅，水村山郭酒旗風。南朝四百八十寺，多少樓臺"],"a":[1]},{"s":9,"n":28,"q":"中國古典詩歌有一種「竹枝詞」，其格律寬鬆自由，用語淺近自然，內容多描寫民間風土或男女豔情，富於民歌情調；唐以後的竹枝詞且多以七言四句為定式。依據以上敘述，試判讀下列選項何者並非竹枝詞：","o":["山桃紅花滿上頭，蜀江春水拍山流。花紅易衰似郎意，水流無限似儂愁","滿天梅雨近端陽，竹葉隔宵裹粽忙。一朵榴花兩枝艾，大家兒女學新妝","春水初添新店溪，溪流停蓄綠玻璃。香魚上釣剛三寸，斗酒雙柑去聽鸝","無事經年別遠公，帝城鐘曉憶西峰。爐煙銷盡寒燈晦，童子開門"],"a":[3]},{"s":9,"n":29,"q":"以下為兩首元曲：甲、楚霸王，漢高皇，龍爭虎鬥幾戰場。爭弱爭強，天喪天亡，成敗豈尋常？一個福相催先到咸陽，一個命將衰自刎烏江。江山空寂寞，宮殿久荒涼。君試詳，都一枕夢黃粱。（馬謙齋〈塞兒令‧楚漢遺事〉）乙、登樓北望思王粲，高臥東山憶 ，悶來長鋏為誰彈？當年射虎，將軍何在？冷凄凄霜凌古岸。（張可久〈賣花聲‧客況〉）下列敘述，錯誤的選項是：","o":["甲之「都一枕夢黃粱」，用「南柯一夢」的典故","乙之「高臥東山」，所憶的對象是謝安","乙之「悶來長鋏為誰彈」，用「馮諼客孟嘗君」的典故","乙之「射虎將軍」，指漢代名將李廣"],"a":[0]},{"s":9,"n":30,"q":"民間故事、古典小說往往歌頌浪漫的愛情故事。下列有關人物、情節的敘述，正確的選項是：","o":["《薛丁山征西》敘述大唐公主樊梨花才貌雙全，以拋繡球的方式招薛丁山將軍為駙馬","「梁祝故事」敘述梁山伯、祝英台由同窗結為夫妻，卻因家長反對而被迫離異，雙雙殉情化蝶","《白蛇傳》敘述蛇精白素貞化為美女，下嫁許仙，後與法海和尚鬥法，水漫金山寺，遂遭囚禁於雷峰塔下","《紅樓夢》敘述賈寶玉與表妹林黛玉真心相愛，卻因王熙鳳、薛"],"a":[2]},{"s":9,"n":31,"q":"下列敘述，符合文中內涵與旨意的選項是：","o":["對盜戶的招安優撫，實即反映出官府的腐敗昏聵","官府對爭訟的雙方，一定問明是非曲直，以示公正無私","文中以盜戶形容狐為虎作倀，脅迫官府，魅惑良民的景況","盜戶因為想取得訴訟勝算，因此在訴訟時，多先陳上戶籍證明"],"a":[0],"p":64},{"s":9,"n":32,"q":"狐被捉後大呼「我盜戶也！」聞者無不匿笑，原因是：","o":["懼損官府威嚴，不敢公然恥笑","狐鋌而走險，淪為盜戶，令人竊笑","狐想冒用盜戶之名，取得寬恕，令人啼笑皆非","官府聘術士捉狐燒狐，流於怪力亂神，聞者哭笑不得"],"a":[2]},{"s":9,"n":33,"q":"根據上引兩段文字，下列敘述，錯誤的選項是：","o":["甲、乙兩段文字中，作為動詞用的「卿」字共有 7個","「庾卿之不置」的「卿」和「卿自君我」的「君」字，詞性不同","文中所有「卿卿」的第一個「卿」字都是動詞，第二個「卿」字都是名詞","「庾卿之不置」的「之」字和「誰當卿卿」的第二個「卿」字，"],"a":[1],"p":65},{"s":9,"n":34,"q":"由上引兩段文字內容判斷，下列敘述，正確的選項是：","o":["魏晉時期稱呼對方為「卿」，是一種下對上或卑對尊的敬稱","庾子嵩因為王太尉敬稱他為「君」，故堅持稱呼王太尉為「卿」","《世說新語》將乙段文字置於〈惑溺〉篇，反映當時人對女性堅持自我主張的不以為然","王太尉對庾子嵩稱他為「卿」一事的態度，和王安豐對妻子稱他為「卿」的態度相同，都由反對轉為接受"],"a":[2],"p":65},{"s":9,"n":35,"q":"許慎〈說文解字敘〉有「六書」之說，六書即：指事、象形、形聲、會意、轉注、假借。下列各組漢字，屬於同一種六書分類的選項是..","o":["刃、本、日","犬、下、公","慫、闊、筐","森、國、龍"],"a":[2]},{"s":9,"n":36,"q":"下列文句中，完全沒有錯別字的選項是..","o":["老唐誤信友人勸說，導致投資失敗，如今已到了走頭無路的地步","張三不僅工作能力好，又篤實可靠，因此備受重視，是炙手可熱的挖角對象","幾位實業家一口同聲表示，創業維艱，守成亦不易，必須戰戰兢兢，才可能鴻圖大展","考前他抱著勢在必得的決心，期待一舉金榜題名，沒想還是名落孫山，真教人為之挽惜"],"a":[1]},{"s":9,"n":37,"q":"下列各文句中「」內的詞語，用法正確的選項是：","o":["他平素「色厲內荏」，是位外剛內柔的正直長官","聽到別人犯錯時，應該抱著「哀矜而勿喜」的態度","孫君「當仁不讓」，獨吞與友人合作投資所得的利潤","父親鼓勵張生要「不恥下問」，向老師多多請益，學業才會進步"],"a":[1]},{"s":9,"n":38,"q":"下列對《荀子‧勸學》的解讀，正確的選項是：","o":["質「的」張而弓矢至焉──「的」是「之」的意思","君子生非異也，善「假」於物也──「假」是偽裝、模仿的意思","淑人君子，其儀一兮。其儀一兮，心如「結」兮──「結」用以形容心志之堅定","「青」，取之於「藍」，而「青」於「藍」──兩個「青」字和兩個「藍」字都是名詞"],"a":[2]},{"s":9,"n":39,"q":"隨著社會發展的加快，外來詞在現代漢語中的地位和作用也越來越重要，這值得我們重視。含有音譯成分的外來詞主要有：（一）純音譯，如布丁（二）半音半意譯，如千瓦（三）音譯加類名，如卡片（四）音意兼譯，如俱樂部。下列外來詞依此順序排列的選項是：","o":["嬉皮、啤酒、吉他、華爾街","吉他、華爾街、啤酒、嬉皮","吉他、嬉皮、啤酒、華爾街","啤酒、吉他、華爾街、嬉皮"],"a":[1]},{"s":9,"n":40,"q":"成語是現成的簡短有力的詞組，運用得當，可使文章生色，所以作者多樂於採用，如：甲、唉呀，不好了，阿彌陀佛，怎麼辦呢？我急得□□□□（吳濁流〈一場虛驚〉）乙、楊逵先生若是有三長兩短的話，我蒙上謀殺名作家的罪名是難免的。多麼敬愛祖父的楊翠小姐一定不能原諒我。如今回想當時的憂慮，□□□□（陳秀喜〈楊逵先生和大鄧伯花〉）丙、每一次看見你□□□□/阿爸的心多麼絞痛/孩子呀！不要忘記/一時的得意/往往是無數怨恨的種子（吳晟〈愚行〉）丁、在中篇小說〈雨〉裡面，鍾理和倒描寫了反面的地方士紳人物──羅丁瑞。「日據時代身任庄役場（鎮公所）兵事係要職，大權在握，成為一個了不起的人物，在地方上叱咤風雲，□□□□，不可一世......」（葉石濤〈新文學傳統的繼承者──鍾理和〉）上引各段文字□□□□內的成語，依序最適宜填入的選項是：","o":["心有餘悸/汗流浹背/趾高氣揚/吐氣揚眉","汗流浹背/心有餘悸/吐氣揚眉/趾高氣揚","心有餘悸/汗流浹背/吐氣揚眉/趾高氣揚","汗流浹背/心有餘悸/趾高氣揚/吐氣揚眉"],"a":[3]},{"s":9,"n":41,"q":"上文以圖、文並置的方式，主要是為了使讀者了解：","o":["人類左腦語言區的演化過程","人類左腦語言區的各種失調病症","「失讀症」肇因於大腦訊息傳遞障礙","「失讀症」肇因於發聲部位的功能失常"],"a":[0],"p":66},{"s":9,"n":42,"q":"依據上引圖、文，下列關於人類「左腦語言區」的敘述，何者正確？","o":["主要分為三區：枕葉、頂葉、顳葉","威尼基區受傷，會使視覺皮質的功能產生障礙","角迴的功能是將「理解的語言」轉換成「說出來的語言」","閱讀和寫字時，語言區必須和視覺皮質、運動皮質相配合"],"a":[0],"p":66},{"s":9,"n":43,"q":"綜合上引圖、文的說明，病人J.O.的症狀，主要係肇因於左腦某個部分功能受損，則文中處應填入的是：","o":["視覺皮質","視覺皮質到角迴間的神經通路","威尼基區","布羅卡區到運動皮質間"],"a":[1],"p":66}]}</script>
<script id="data-phys" type="application/json">{"id":"phys8-ch3","name":"國二理化 第三章 波動與聲音","source":"段考複習講義","sections":["3-1 波的結構（例題）","3-2 聲波的產生與傳播（例題）","3-3 聲波的反射與超聲波（例題）","進階計算題型（例題）","段考精選練習題"],"passages":[],"questions":[{"s":0,"n":1,"q":"某波的週期為 0.25 s，頻率為多少？","o":["0.25 Hz","4 Hz","2.5 Hz","25 Hz"],"a":[1],"e":"f = 1/T = 1/0.25 = 4 Hz。"},{"s":0,"n":2,"q":"某波的頻率為 8 Hz，週期為多少？","o":["8 s","0.8 s","0.125 s","0.25 s"],"a":[2],"e":"T = 1/f = 1/8 = 0.125 s。"},{"s":0,"n":3,"q":"某繩波的週期為 0.5 s，10 s 內可以產生幾個完整波？","o":["5 個","20 個","10 個","50 個"],"a":[1],"e":"先求頻率 f = 1/0.5 = 2 Hz（每秒 2 個波），總波數 N = f × t = 2 × 10 = 20 個。\n口訣：已知週期用「總時間 ÷ 週期」；已知頻率用「頻率 × 總時間」。"},{"s":0,"n":4,"q":"某波的頻率為 5 Hz，波長為 20 cm，波速為多少？","o":["4 m/s","0.25 m/s","1 m/s","100 m/s"],"a":[2],"e":"v = fλ = 5 × 20 = 100 cm/s = 1 m/s。注意 100 是 cm/s，不是 m/s。"},{"s":0,"n":5,"q":"某繩波波形顯示，1.5 個完整波的總長度為 150 cm，每個完整波需要 0.125 s。波速為多少？","o":["8 m/s","12 m/s","0.8 m/s","1.2 m/s"],"a":[0],"e":"第一步：波長 λ = 150 ÷ 1.5 = 100 cm = 1 m。\n第二步：頻率 f = 1/T = 1/0.125 = 8 Hz。\n第三步：波速 v = fλ = 8 × 1 = 8 m/s。"},{"s":0,"n":6,"q":"某彈簧縱波中，密部中心到相鄰疏部中心的距離為 10 cm，波長為多少？","o":["5 cm","10 cm","20 cm","40 cm"],"a":[2],"e":"相鄰密部中心與疏部中心相隔半個波長：λ/2 = 10 cm，所以 λ = 20 cm。"},{"s":0,"n":7,"q":"某繩波原本頻率為 4 Hz，波長為 20 cm。後來改以 8 Hz 振動，繩子條件不變。新的波長和波速各為多少？","o":["10 cm，80 cm/s","40 cm，160 cm/s","10 cm，160 cm/s","20 cm，80 cm/s"],"a":[0],"e":"原波速 v = 4 × 20 = 80 cm/s。介質不變，波速仍是 80 cm/s。\n新波長 λ′ = v/f′ = 80/8 = 10 cm。頻率加倍，波長減半。"},{"s":1,"n":1,"q":"氣溫為 15°C 時，空氣中的聲速約為多少？（v = 331 + 0.6t）","o":["331 m/s","340 m/s","346 m/s","349 m/s"],"a":[1],"e":"v = 331 + 0.6 × 15 = 331 + 9 = 340 m/s。"},{"s":1,"n":2,"q":"使用公式 v = 331 + 0.6t 估算，氣溫 20°C 時的空氣聲速約為多少？","o":["331 m/s","343 m/s","351 m/s","340 m/s"],"a":[1],"e":"v = 331 + 0.6 × 20 = 331 + 12 = 343 m/s。\n聲速和聲音大小、音調高低無關，只和介質與溫度有關。"},{"s":1,"n":3,"q":"聲音在空氣中以 340 m/s 傳播，經過 3 s 可以傳多遠？","o":["113 m","510 m","1020 m","2040 m"],"a":[2],"e":"s = v × t = 340 × 3 = 1020 m。這題是單程傳播，不用除以 2。"},{"s":1,"n":4,"q":"某聲波頻率為 170 Hz，在空氣中的波速為 340 m/s，波長為多少？","o":["0.5 m","2 m","510 m","57800 m"],"a":[1],"e":"λ = v/f = 340/170 = 2 m。"},{"s":2,"n":1,"q":"某人在空曠處對著山壁喊叫，2 s 後聽到回聲。聲速為 340 m/s，他與山壁的距離為多少？","o":["170 m","340 m","680 m","1360 m"],"a":[1],"e":"2 s 是來回的總時間，單程 d = v × t ÷ 2 = 340 × 2 ÷ 2 = 340 m。"},{"s":2,"n":2,"q":"某人對著山壁喊叫，3 s 後聽到回聲。聲速為 340 m/s，他與山壁的距離為多少？","o":["340 m","510 m","1020 m","1530 m"],"a":[1],"e":"d = 340 × 3 ÷ 2 = 510 m。"},{"s":2,"n":3,"q":"探測船發出超聲波，1.6 s 後收到海底的反射訊號。海水中的聲速為 1500 m/s，海底深度為多少？","o":["600 m","937.5 m","1200 m","2400 m"],"a":[2],"e":"1.6 s 是往返總時間，單程深度 d = 1500 × 1.6 ÷ 2 = 1200 m。\n回聲時間越長，海底越深；越短，海底越淺。"},{"s":3,"n":1,"q":"某人在兩座峭壁之間發聲，離較近的峭壁 600 m。第一聲回聲與第二聲回聲相差 2 s，聲速為 340 m/s。兩座峭壁之間的總距離為多少？","o":["940 m","1540 m","1880 m","1200 m"],"a":[1],"e":"第一步：兩側距離差 Δd = v × Δt ÷ 2 = 340 × 2 ÷ 2 = 340 m。\n第二步：到較遠峭壁 d₂ = 600 + 340 = 940 m。\n第三步：總距離 D = 600 + 940 = 1540 m。"},{"s":3,"n":2,"q":"某人在兩座峭壁之間發聲，1.5 s 後聽到第一聲回聲，再過 1 s 聽到第二聲回聲。聲速為 340 m/s，兩座峭壁相距多少？","o":["425 m","595 m","680 m","850 m"],"a":[2],"e":"第一聲：t₁ = 1.5 s，d₁ = 340 × 1.5 ÷ 2 = 255 m。\n第二聲：總時間 t₂ = 1.5 + 1 = 2.5 s，d₂ = 340 × 2.5 ÷ 2 = 425 m。\n兩峭壁間距 D = 255 + 425 = 680 m。"},{"s":3,"n":3,"q":"站在兩座峭壁之間發聲，甲峭壁的回聲每隔 2 s 回到耳朵，乙峭壁的回聲每隔 3 s 回到耳朵。聽到第 2 聲回聲後，再過多久會聽到第 3 聲回聲？","o":["1 s","2 s","3 s","0.5 s"],"a":[0],"e":"甲壁回聲：2 s、4 s、6 s…；乙壁回聲：3 s、6 s、9 s…\n合併排序：第 1 聲 2 s（甲）、第 2 聲 3 s（乙）、第 3 聲 4 s（甲）。\n所以第 2 聲到第 3 聲相隔 4 − 3 = 1 s。"},{"s":3,"n":4,"q":"某船以 15 m/s 的速率遠離冰山，鳴笛 6 s 後收到回聲。聲速為 335 m/s，鳴笛時船與冰山的距離為多少？","o":["960 m","1005 m","1050 m","1920 m"],"a":[0],"e":"聲音路程 S聲 = 335 × 6 = 2010 m；船走的距離 S船 = 15 × 6 = 90 m。\n船遠離用「減」：2x = 2010 − 90 = 1920 m，x = 960 m。"},{"s":3,"n":5,"q":"某船以 34 m/s 的速率朝懸崖前進，鳴笛 6 s 後收到回聲。聲速為 337 m/s，鳴笛時船與懸崖的距離為多少？","o":["909 m","1011 m","1113 m","2226 m"],"a":[2],"e":"聲音路程 S聲 = 337 × 6 = 2022 m；船走的距離 S船 = 34 × 6 = 204 m。\n船靠近用「加」：2x = 2022 + 204 = 2226 m，x = 1113 m。"},{"s":3,"n":6,"q":"某船鳴笛時距離山壁 720 m，並等速遠離山壁，6 s 後收到回聲。聲速為 340 m/s，船速為多少？","o":["20 m/s","60 m/s","100 m/s","220 m/s"],"a":[2],"e":"遠離公式：2x = (v聲 − v船) × t\n2 × 720 = (340 − v船) × 6 → 240 = 340 − v船 → v船 = 100 m/s。"},{"s":3,"n":7,"q":"某人看到遠方爆炸的火光後，4.4 s 才聽到爆炸聲。空氣聲速為 340 m/s，爆炸處距離多遠？","o":["748 m","1496 m","2992 m","77 m"],"a":[1],"e":"光速遠大於聲速，光的傳播時間可忽略。d ≈ v × t = 340 × 4.4 = 1496 m。這是單程，不用除以 2。"},{"s":3,"n":8,"q":"100 m 賽跑中，終點裁判聽到槍聲才按碼表，測得成績為 13.00 s。聲速為 340 m/s，選手實際成績約為多少？","o":["12.71 s","13.00 s","13.29 s","13.59 s"],"a":[2],"e":"聲音傳到終點要 t聲 = 100 ÷ 340 ≈ 0.294 s，這段時間選手已經在跑，碼表記錄偏短。\n實際成績 = 13.00 + 0.294 ≈ 13.29 s（要「加上」）。"},{"s":4,"n":1,"q":"小明上下抖動一條繩子，看到波形沿繩子向前移動。下列敘述何者正確？","o":["繩子上的每一點都隨波形向前移動","波只能傳遞物質，不能傳遞能量","波傳播時，主要是將能量向外傳遞","只要有波，就一定需要空氣作為介質"],"a":[2],"e":"波傳播時介質只在原處振動，傳遞的是能量。"},{"s":4,"n":2,"q":"甲波的介質振動方向與波的傳播方向垂直；乙波的兩個方向平行。甲、乙分別屬於哪一種波？","o":["甲為縱波，乙為橫波","甲為橫波，乙為縱波","甲、乙都是橫波","甲、乙都是縱波"],"a":[1],"e":"振動與傳播方向垂直者為橫波，平行者為縱波。"},{"s":4,"n":3,"q":"某橫波的振幅為 3 cm。波峰到波谷的垂直距離為多少？","o":["1.5 cm","3 cm","6 cm","9 cm"],"a":[2],"e":"波峰到波谷的垂直距離 = 2 × 振幅 = 2 × 3 = 6 cm。"},{"s":4,"n":4,"q":"某波每秒產生 8 個完整波。此波的週期為何？","o":["0.125 s","0.25 s","4 s","8 s"],"a":[0],"e":"每秒 8 個波表示頻率 f = 8 Hz，週期 T = 1/f = 1/8 = 0.125 s。"},{"s":4,"n":5,"q":"某波的頻率為 5 Hz，波長為 0.4 m。波速為多少？","o":["0.08 m/s","2 m/s","5.4 m/s","12.5 m/s"],"a":[1],"e":"v = fλ = 5 × 0.4 = 2 m/s。"},{"s":4,"n":6,"q":"某波在固定介質中傳播，波速保持不變。當頻率增加為原來的 2 倍時，波長如何變化？","o":["增加為 2 倍","減少為一半","保持不變","增加為 4 倍"],"a":[1],"e":"波速固定時 λ = v/f，波長與頻率成反比，頻率變 2 倍則波長變 1/2。"},{"s":4,"n":7,"q":"小華敲擊音叉，音叉振動並發出聲音。下列敘述何者正確？","o":["聲音是由物體振動產生","聲音可以在真空中傳播","聲音傳播時，空氣整體一路移動到聽者耳邊","聲音只可以在氣體中傳播"],"a":[0],"e":"發聲體必振動；聲音是力學波，需要介質，可在固體、液體、氣體中傳播。"},{"s":4,"n":8,"q":"空氣溫度為 20°C，使用公式 v = 331 + 0.6t 估算聲速約為多少？","o":["331 m/s","340 m/s","343 m/s","355 m/s"],"a":[2],"e":"v = 331 + 0.6 × 20 = 331 + 12 = 343 m/s。"},{"s":4,"n":9,"q":"某人在山谷中喊叫，1.5 s 後聽到回聲。設聲速為 340 m/s，人與山壁距離約為多少？","o":["127.5 m","255 m","340 m","510 m"],"a":[1],"e":"1.5 s 為往返時間，單程距離 d = 340 × 1.5 ÷ 2 = 255 m。"},{"s":4,"n":10,"q":"聲納發出超聲波後，2 s 收到海底反射聲。海水聲速為 1500 m/s，海底深度為多少？","o":["750 m","1500 m","3000 m","6000 m"],"a":[1],"e":"d = v × t ÷ 2 = 1500 × 2 ÷ 2 = 1500 m。"},{"s":4,"n":11,"q":"醫院使用高頻聲波觀察人體內部器官影像。下列敘述何者正確？","o":["超聲波是電磁波，不需要介質","超聲波頻率高於人耳通常能聽見的範圍（> 20000 Hz）","超聲波只能在真空中傳播","超聲波的頻率低於 20 Hz"],"a":[1],"e":"超聲波是頻率 > 20000 Hz 的力學聲波，需要介質。"},{"s":4,"n":12,"q":"甲聲音的頻率高於乙聲音，但甲聲音的振幅較小。下列判斷何者最適當？","o":["甲的音調較高","甲一定比較大聲","乙的音調一定較高","只要振幅較小，頻率就一定較低"],"a":[0],"e":"音調看頻率（甲頻率高，音調高）；響度看振幅（甲振幅小，比較小聲）。"},{"s":4,"n":13,"q":"鋼琴與小提琴演奏相同音高、相同音量的音符，人仍能分辨兩種樂器。主要原因為何？","o":["兩者一定有不同的傳播速度","兩者的音色（波形）不同","兩者一定有不同的音調","兩者都沒有振動"],"a":[1],"e":"發聲體材質結構不同，波形不同，所以音色不同。"},{"s":4,"n":14,"q":"某物體受到外力作用，當外力頻率接近物體的固有頻率時，物體振幅明顯劇烈增大。此現象稱為什麼？","o":["反射","折射","共鳴","迴響"],"a":[2],"e":"外力頻率等於或接近固有頻率時振幅增大，稱為共鳴（共振）。"},{"s":4,"n":15,"q":"某船以 10 m/s 的速度遠離山壁，鳴笛 6 s 後聽到回聲。聲速為 340 m/s，鳴笛時船與山壁距離為多少？","o":["990 m","1020 m","1050 m","2100 m"],"a":[0],"e":"船遠離：x = (v聲 − v船) × t ÷ 2 = (340 − 10) × 6 ÷ 2 = 330 × 3 = 990 m。"},{"s":4,"n":16,"q":"某船以 20 m/s 的速度朝山壁前進，鳴笛 5 s 後收到回聲。聲速為 340 m/s，鳴笛時船與山壁距離為多少？","o":["800 m","850 m","900 m","1800 m"],"a":[2],"e":"船靠近：x = (v聲 + v船) × t ÷ 2 = (340 + 20) × 5 ÷ 2 = 900 m。"},{"s":4,"n":17,"q":"兩聲音在同溫空氣中傳播，甲頻率為 262 Hz（中央 C），乙頻率為 524 Hz（高音 C）。甲、乙波長比（λ甲 : λ乙）為何？","o":["1 : 1","1 : 2","2 : 1","4 : 1"],"a":[2],"e":"同介質聲速相同，波長與頻率成反比：λ甲 : λ乙 = f乙 : f甲 = 524 : 262 = 2 : 1。"},{"s":4,"n":18,"q":"終點裁判聽到 100 m 外的起跑槍聲才按碼表記時，測得成績為 12.00 s。設聲速為 340 m/s，修正後實際成績約為多少？","o":["11.71 s","12.00 s","12.29 s","12.94 s"],"a":[2],"e":"聲音傳播時間 t聲 = 100 ÷ 340 ≈ 0.294 s，實際時間 = 12.00 + 0.294 ≈ 12.29 s。"}]}</script>
<script id="data-math" type="application/json">{"id":"math8-a","name":"八上數學 練習卷","source":"高雄楷模書院練習卷","math":true,"sections":["根式的運算","畢氏定理","因式分解"],"passages":[],"questions":[{"s":0,"n":1,"q":"若 \\(\\sqrt7+\\sqrt7=\\sqrt N\\)，則 \\(N=\\)？","o":["7","14","28","42"],"a":[2],"e":"\\(\\sqrt7+\\sqrt7=2\\sqrt7=\\sqrt{4\\times7}=\\sqrt{28}\\)，所以 \\(N=28\\)。"},{"s":0,"n":2,"q":"化簡 \\((\\sqrt7+\\sqrt5)^2(\\sqrt5-\\sqrt7)^2=\\)？","o":["4","0","2","−4"],"a":[0],"e":"\\(=[(\\sqrt5+\\sqrt7)(\\sqrt5-\\sqrt7)]^2=[(\\sqrt5)^2-(\\sqrt7)^2]^2=(5-7)^2=(-2)^2=4\\)"},{"s":0,"n":3,"q":"設 \\(A=(\\sqrt7+\\sqrt3)(\\sqrt7-\\sqrt3)\\)，\\(B=\\sqrt3\\times\\sqrt7\\)，\\(C=\\sqrt3+\\sqrt7\\)，則 A、B、C 的大小關係為何？","o":["A＞B＞C","C＞B＞A","B＞A＞C","B＞C＞A"],"a":[3],"e":"\\(A=(\\sqrt7)^2-(\\sqrt3)^2=7-3=4=\\sqrt{16}\\)，\\(B=\\sqrt{21}\\)，\\(C=\\sqrt3+\\sqrt7\\)。\n\\(A^2=16\\)，\\(B^2=21\\)，\\(C^2=10+2\\sqrt{21}\\)。\n因為 \\(4<\\sqrt{21}<5\\)，所以 \\(18<C^2<20\\)，得 \\(B^2>C^2>A^2\\)，即 \\(B>C>A\\)。"},{"s":0,"n":4,"q":"若 \\(\\sqrt3=a\\)，\\(\\sqrt{30}=b\\)，則 \\(\\sqrt{2.7}=\\)？","o":["\\(\\dfrac{b-a}{10}\\)","\\(\\dfrac{b-a}{\\sqrt{10}}\\)","\\(\\dfrac{3}{10}b\\)","\\(\\dfrac{3}{10}a\\)"],"a":[2],"e":"\\(\\sqrt{2.7}=\\sqrt{\\dfrac{270}{100}}=\\dfrac{\\sqrt{270}}{10}=\\dfrac{3\\sqrt{30}}{10}=\\dfrac{3}{10}b\\)"},{"s":0,"n":5,"q":"化簡 \\(\\sqrt{2^6\\times3^7\\times5^9\\times7^9\\times11^{12}}=\\)？","o":["\\(2^6\\times3^7\\times5^8\\times7^9\\times11^{11}\\)","\\(2^2\\times3^2\\times5^3\\times7^3\\times11^4\\sqrt3\\)","\\(2^3\\times3^3\\times5^4\\times7^4\\times11^6\\)","\\(2^3\\times3^3\\times5^4\\times7^4\\times11^6\\sqrt{3\\times5\\times7}\\)"],"a":[3],"e":"\\(=\\sqrt{(2^3)^2\\times(3^3)^2\\times3\\times(5^4)^2\\times5\\times(7^4)^2\\times7\\times(11^6)^2}\\)\n\\(=2^3\\times3^3\\times5^4\\times7^4\\times11^6\\sqrt{3\\times5\\times7}\\)"},{"s":0,"n":6,"q":"已知 \\(a=\\sqrt6+2\\)，\\(b=\\sqrt6-2\\)，則 \\(a^2+ab+b^2\\) 的值是多少？","o":["16","18","22","24"],"a":[2],"e":"\\(a+b=2\\sqrt6\\)，\\(ab=(\\sqrt6)^2-2^2=2\\)。\n\\(a^2+ab+b^2=(a+b)^2-ab=(2\\sqrt6)^2-2=24-2=22\\)"},{"s":0,"n":7,"q":"若 \\(\\sqrt x\\) 與 \\(\\sqrt3\\) 是同類方根，則 x 可能為下列何數？","o":["9","27","18","63"],"a":[1],"e":"\\(\\sqrt9=3\\)，\\(\\sqrt{27}=3\\sqrt3\\)，\\(\\sqrt{18}=3\\sqrt2\\)，\\(\\sqrt{63}=3\\sqrt7\\)。\n只有 \\(3\\sqrt3\\) 與 \\(\\sqrt3\\) 是同類方根。"},{"s":0,"n":8,"q":"由查表知 \\(\\sqrt{23}\\approx4.796\\)，\\(\\sqrt{230}\\approx15.166\\)，求 \\(\\sqrt{2.3}\\approx\\)？","o":["4.796","0.4796","15.166","1.5166"],"a":[3],"e":"\\(\\sqrt{2.3}=\\sqrt{\\dfrac{230}{100}}=\\dfrac{\\sqrt{230}}{10}\\approx\\dfrac{15.166}{10}=1.5166\\)"},{"s":0,"n":9,"q":"若 \\(\\sqrt{10+10+10+10+10+10+10+10+10}=\\sqrt{10}+\\sqrt{10}+\\cdots=a\\times\\sqrt{10}\\)，則 \\(a=\\)？","o":["3","5","7","9"],"a":[0],"e":"原式 \\(=\\sqrt{9\\times10}=\\sqrt{3^2\\times10}=3\\sqrt{10}\\)，所以 \\(a=3\\)。"},{"s":0,"n":10,"q":"化簡 \\(\\sqrt{72}-\\sqrt{18}+\\sqrt{27}-\\sqrt{75}=\\)？","o":["\\(\\sqrt6\\)","\\(-3\\sqrt2\\)","\\(3\\sqrt2-2\\sqrt3\\)","\\(-2\\sqrt2+3\\sqrt3\\)"],"a":[2],"e":"原式 \\(=6\\sqrt2-3\\sqrt2+3\\sqrt3-5\\sqrt3=3\\sqrt2-2\\sqrt3\\)"},{"s":0,"n":11,"q":"已知 \\(\\sqrt{71200}\\approx266.833281\\)，若 \\(\\sqrt x\\approx2.668332\\)，則下列哪個數最接近 x？","o":["7120","712","71.2","7.12"],"a":[3],"e":"\\(\\sqrt x\\approx2.668332\\approx\\dfrac{1}{100}\\times266.833281\\approx\\dfrac{1}{100}\\times\\sqrt{71200}\\)\n兩邊平方：\\(x\\approx\\dfrac{1}{10000}\\times71200=7.12\\)"},{"s":0,"n":12,"q":"下列哪一個選項裡的兩個根式是同類方根？","o":["\\(7\\sqrt3\\) 與 \\(3\\sqrt7\\)","\\(\\sqrt8\\) 與 \\(-2\\sqrt2\\)","\\(\\sqrt{125}\\) 與 \\(\\sqrt{50}\\)","\\(\\sqrt{18}\\) 與 \\(\\sqrt{12}\\)"],"a":[1],"e":"(B) \\(\\sqrt8=2\\sqrt2\\)，與 \\(-2\\sqrt2\\) 同類。\n(C) \\(\\sqrt{125}=5\\sqrt5\\)，\\(\\sqrt{50}=5\\sqrt2\\)；(D) \\(\\sqrt{18}=3\\sqrt2\\)，\\(\\sqrt{12}=2\\sqrt3\\)，都不同類。"},{"s":0,"n":13,"q":"若 \\(\\dfrac{2}{\\sqrt{13}-\\sqrt{11}}=a\\sqrt{13}+b\\sqrt{11}\\)，則 \\(a+b=\\)？","o":["0","1","2","3"],"a":[2],"e":"\\(\\dfrac{2}{\\sqrt{13}-\\sqrt{11}}=\\dfrac{2(\\sqrt{13}+\\sqrt{11})}{(\\sqrt{13}-\\sqrt{11})(\\sqrt{13}+\\sqrt{11})}=\\dfrac{2(\\sqrt{13}+\\sqrt{11})}{2}=\\sqrt{13}+\\sqrt{11}\\)\n\\(a=1\\)，\\(b=1\\)，\\(a+b=2\\)。"},{"s":0,"n":14,"q":"已知 \\(\\sqrt5\\approx2.236\\)、\\(\\sqrt{10}\\approx3.162\\)、\\(\\sqrt{50}\\approx7.071\\)，請計算 \\(\\sqrt{0.4}\\) 的值約為多少？","o":["0.6324","0.8324","1.0324","1.2324"],"a":[0],"e":"\\(\\sqrt{0.4}=\\sqrt{\\dfrac25}=\\sqrt{\\dfrac{10}{25}}=\\dfrac{\\sqrt{10}}{5}\\approx\\dfrac{3.162}{5}=0.6324\\)"},{"s":0,"n":15,"q":"下列哪一個算式的結果最大？","o":["\\(\\left(\\sqrt{\\dfrac85}\\right)^2\\)","\\(\\sqrt{\\dfrac{3}{16}}\\div\\sqrt{\\dfrac13}\\)","\\(\\sqrt7\\div\\sqrt{\\dfrac{7}{25}}\\)","\\(\\sqrt{\\dfrac65}\\times\\sqrt{\\dfrac{10}{3}}\\)"],"a":[2],"e":"(A) \\(\\dfrac85\\)\n(B) \\(\\sqrt{\\dfrac{3}{16}\\times3}=\\sqrt{\\dfrac{9}{16}}=\\dfrac34\\)\n(C) \\(\\sqrt{7\\times\\dfrac{25}{7}}=\\sqrt{25}=5\\)\n(D) \\(\\sqrt{\\dfrac65\\times\\dfrac{10}{3}}=\\sqrt4=2\\)\n最大的是 (C)。"},{"s":0,"n":16,"q":"設 \\(\\sqrt{150}=12.2474\\)，若 \\(\\sqrt x=1.22474\\)，則 \\(x=\\)？","o":["15000","1500","15","1.5"],"a":[3],"e":"\\(\\sqrt x=\\dfrac{12.2474}{10}=\\dfrac{\\sqrt{150}}{10}\\)，兩邊平方：\\(x=\\dfrac{150}{100}=1.5\\)"},{"s":0,"n":17,"q":"計算 \\(3\\sqrt5-3\\sqrt{12}-\\sqrt{80}+3\\sqrt3-\\sqrt{48}+4\\sqrt{125}=\\)？（化簡為最簡根式）","o":["\\(-\\sqrt5-3\\sqrt3-\\sqrt{48}+4\\sqrt{125}\\)","\\(-19\\sqrt3-7\\sqrt5\\)","\\(\\sqrt{77}\\)","\\(19\\sqrt5-7\\sqrt3\\)"],"a":[3],"e":"原式 \\(=3\\sqrt5-6\\sqrt3-4\\sqrt5+3\\sqrt3-4\\sqrt3+20\\sqrt5=19\\sqrt5-7\\sqrt3\\)"},{"s":0,"n":18,"q":"利用附表求 \\(\\sqrt{0.15}\\) 的近似值為何？\n\\(\\begin{array}{c|c|c} N & N^2 & \\sqrt N\\\\\\hline 15 & 225 & 3.872\\\\ 16 & 256 & 4.000\\\\ 17 & 289 & 4.123\\end{array}\\)","o":["225","3.872","2.25","0.3872"],"a":[3],"e":"\\(\\sqrt{0.15}=\\sqrt{\\dfrac{15}{100}}=\\dfrac{\\sqrt{15}}{10}\\approx\\dfrac{3.872}{10}=0.3872\\)"},{"s":0,"n":19,"q":"\\((\\sqrt7+\\sqrt5)^8(\\sqrt7-\\sqrt5)^7\\) 的值與下列何者相同？","o":["−2","\\(128\\sqrt7+128\\sqrt5\\)","2","\\(128\\sqrt7-128\\sqrt5\\)"],"a":[1],"e":"\\(=(\\sqrt7+\\sqrt5)\\times[(\\sqrt7+\\sqrt5)(\\sqrt7-\\sq \) 是因式。"},{"s":2,"n":23,"q":"下列何者為 \\((x-y)(x-y-5)-24\\) 的因式？","o":["\\(x-y-2\\)","\\(x-y-3\\)","\\(x-y-6\\)","\\(x-y-8\\)"],"a":[3],"e":"設 \\(x-y=a\\)，原式 \\(=a(a-5)-24=a^2-5a-24=(a+3)(a-8)=(x-y+3)(x-y-8)\\)"},{"s":2,"n":24,"q":"多項式 \\(33x^2-x-14\\) 可因式分解成 \\((3x-a)(bx+c)\\)，其中 a、b、c 均為整數，求 \\(a+b+c\\) 的值為何？","o":["16","20","23","43"],"a":[1],"e":"\\(33x^2-x-14=(3x-2)(11x+7)\\)，所以 \\(a=2\\)，\\(b=11\\)，\\(c=7\\)，\\(a+b+c=20\\)。"},{"s":2,"n":25,"q":"利用因式分解 \\(9x^4-37x^2+4\\) 的結果，將 \\(9\\times31^4-37\\times31^2+4\\) 寫成標準分解式，則下列何者正確？","o":["\\(2^2\\times3\\times11\\times23\\times29\\times47\\)","\\(2^3\\times3\\times13\\times23\\)","\\(2^2\\times3\\times13\\times23\\times29\\times47\\)","\\(2^3\\times3\\times11\\times23\\times29\\times47\\)"],"a":[3],"e":"\\(9x^4-37x^2+4=(9x^2-1)(x^2-4)=(3x+1)(3x-1)(x+2)(x-2)\\)\n代入 \\(x=31\\)：\\((94)(92)(33)(29)=2\\times47\\times2^2\\times23\\times3\\times11\\times29=2^3\\times3\\times11\\times23\\times29\\times47\\)"}]}</script>
<script>
// 把測驗卷文字整理成 {sections, passages, questions}
function parseQuiz(src){
  const NONASCII='[^\\x00-\\x7f]';
  const TR={'﹝':'(','﹞':')','〔':'(','〕':')','［':'(','］':')','【':'(','】':')'};
  const norm=l=>{
    l=l.normalize('NFKC').replace(/　/g,' ').replace(/[﹝﹞〔〕［］【】]/g,c=>TR[c]).replace(/\s+$/,'');
    const s=l.trim();
    if(s){const r=(s.match(/ /g)||[]).length/s.length;
      if(r>0.25) l=l.replace(/(?<=[^\x00-\x7f]) +(?=[^\x00-\x7f])/g,'');
      if(r>0.35) l=l.replace(/(?<=[^\x00-\x7f]) +(?=[\x00-\x7f])|(?<=[\x00-\x7f]) +(?=[^\x00-\x7f])/g,'');}
    return l.replace(/(?<=[^\x00-\x7f]) (?=[^\x00-\x7f])/g,'');
  };
  let lines=src.replace(/\r/g,'').split('\n').map(norm);
  // 去掉每頁重複的頁首頁尾與頁碼
  const freq={};lines.forEach(l=>{const k=l.trim();if(k.length>5)freq[k]=(freq[k]||0)+1});
  lines=lines.filter(l=>{const k=l.trim();return !(freq[k]>=3&&!/^\(?[A-Da-d]\)/.test(k))&&!/^[-—\s]*第?\s*\d+\s*頁[-—\s]*$/.test(k)&&!/^-?\s*\d+\s*-?$/.test(k)});
  const QA=/^\s*\(\s*([A-Da-d1-4#](?:[.,、 ]*[A-Da-d])*)\s*\)\s*\.?\s*(\d[\d ]{0,4}?)\s*[.、](?!\d+\s*[A-Za-z%°(])\s*/;
  const QA2=/^\s*\(\s*([A-Da-d1-4#](?:[.,、 ]*[A-Da-d])*)\s*\)\s*\.?\s*(\d{1,3})\s*(?=[^\x00-\x7f(])/;
  const QN=/^\s*(\d{1,3})\s*[.、]\s*(?!\d)/;
  const SEC=/^\s*(第\s*[一二三四五六七八九十百\d]+\s*[回卷單元部分課章節]+|[一二三四五六七八九十]+、\s*(?:單選題|選擇題|多選題|題組)[^\n]{0,20})\s*$/;
  const KEYHEAD=/^\s*[\(]?(?:參考)?(?:答案|解答)[\)]?\s*[:：]?\s*(.*)$/;
  const items=[]; let cur=null, inKey=false, anyQ=false;
  const keyLines=[];
  for(const ln of lines){
    let m;
    if((m=ln.match(SEC))){items.push({t:'sec',name:m[1].replace(/\s/g,'')});cur=null;inKey=false;continue}
    if(anyQ&&(m=ln.match(KEYHEAD))&&ln.trim().length<60&&!QA.test(ln)){inKey=true;cur=null;keyLines.push({sec:items.filter(i=>i.t==='sec').length,text:m[1]});continue}
    if(inKey){
      if(/^[\s\dA-Da-d.、:：,，()\-~～ ]+$/.test(ln)){keyLines[keyLines.length-1].text+=' '+ln;continue}
      inKey=false;
    }
    if((m=ln.match(QA))){cur={t:'q',ans:m[1],n:parseInt(m[2].replace(/ /g,'')),body:[ln.slice(m[0].length)]};items.push(cur);anyQ=true;continue}
    if((m=ln.match(QA2))&&cur&&cur.t==='q'){const n=+m[2];if(n-cur.n>0&&n-cur.n<=2){cur={t:'q',ans:m[1],n,body:[ln.slice(m[0].length)]};items.push(cur);continue}}
    if((m=ln.match(/^\s*第\s*(\d{1,3})\s*題\s*/))){cur={t:'q',ans:null,n:+m[1],body:[ln.slice(m[0].length)]};items.push(cur);anyQ=true;continue}
    if((m=ln.match(QN))){cur={t:'q',ans:null,n:+m[1],body:[ln.slice(m[0].length)]};items.push(cur);anyQ=true;continue}
    if(cur) cur.body.push(ln); else items.push({t:'text',line:ln});
  }
  const marker=i=>{const L='ABCD'[i],l=L.toLowerCase(),d=String(i+1);
    return new RegExp(`\\(\\s*[${L}${l}${d}]\\s*\\)\\s*\\.?\\s*|(?<![A-Za-z(])${L}\\s*[.)]\\s*|(?<![\\d(])${d}\\)\\s*|(?<![A-Za-z(])${L}(?=[ \\n]|[^\\x00-\\x7f])\\s*`,'g')};
  const noWS=s=>s.replace(/\s/g,'');
  function splitOpts(body){
    let text='';const offs=[];
    for(const b of body){offs.push(text.length);text+=b.trim()+'\n'}
    const pos=[];let p=0;
    for(let i=0;i<4;i++){
      let mk=marker(i);mk.lastIndex=p;let m=mk.exec(text);
      if(!m&&i===3){mk=marker(2);mk.lastIndex=p;m=mk.exec(text)}
      if(!m) return null;
      pos.push([m.index,m.index+m[0].length]);p=m.index+m[0].length;
    }
    const opts=[0,1,2].map(i=>text.slice(pos[i][1],pos[i+1][0]));
    const ds=pos[3][1];
    const TAIL=/(?:解題關鍵|解析|詳解|說明)\s*[:：]|(?:正確)?答案\s*[:：]?\s*\(?[A-Da-d]\)?(?![A-Za-z])/g;
    TAIL.lastIndex=ds;const tm=TAIL.exec(text);
    if(tm){
      const tail=text.slice(tm.index);
      const am=tail.match(/^(?:(?:解題關鍵|解析|詳解|說明)\s*[:：]\s*([\s\S]*?))?(?:正確)?答案\s*[:：]?\s*\(?([A-Da-d])\)?(?![A-Za-z])/);
      let after, exp='', ans=null;
      if(am&&am[0].length<600){exp=(am[1]||'').trim();ans=am[2];after=tm.index+am[0].length}
      else{const e=text.indexOf('\n',tm.index);exp=text.slice(tm.index,e).replace(/^[^:：]*[:：]/,'').trim();after=e}
      const lineEnd=text.indexOf('\n',after);
      opts.push(text.slice(ds,tm.index));
      const clean=s=>s.replace(/\s*\n\s*/g,'').trim().replace(/[。.;；]+$/,'').trim();
      return {stem:text.slice(0,pos[0][0]).replace(/\s*\n\s*/g,'').trim(),opts:opts.map(clean),rest:text.slice(lineEnd<0?text.length:lineEnd).split('\n'),ans,exp:exp.replace(/\s*\n\s*/g,'')};
    }
    let k=0;offs.forEach((o,i)=>{if(o<=ds)k=i});
    let end=text.indexOf('\n',ds);
    const dmax=Math.max(...opts.map(o=>noWS(o).length))*1.6+8;
    while(k+1<body.length&&noWS(text.slice(ds,end)).length<dmax&&body[k].trim().length>=32&&!/[。？]$/.test(body[k].trim())
      &&!/^\s*(※|▲|依上文|閱讀|\(?[甲乙丙丁]\)?[、.])/.test(body[k+1])&&body[k+1].trim()
      &&(body[k+1].trim().length<20||noWS(text.slice(ds,end)).length+body[k+1].trim().length<=dmax)){
      k++;end=text.indexOf('\n',offs[k]);
    }
    opts.push(text.slice(ds,end));
    const clean=s=>s.replace(/\s*\n\s*/g,'').trim().replace(/[。.;；]+$/,'').trim();
    return {stem:text.slice(0,pos[0][0]).replace(/\s*\n\s*/g,'').trim(),opts:opts.map(clean),rest:text.slice(end).split('\n')};
  }
  const REF=/文中|上文|此詩|本詩|詩中|本文|作者|上引|上列|上述|依據|此文|這首|文章|該文|此段|這段|此詞|引文|根據上|上段|本段|文意|全文|主旨|此篇|本篇|篇中|這篇|短文|此則|詞中|曲中|本詞|此曲|句中/;
  const sections=[],passages=[],questions=[],fails=[];
  let pending=[],curP=null,sec=-1,seenQ=false;
  const flush=()=>{
    let t=pending.map(x=>x.trim()).filter(Boolean);pending=[];
    t=t.filter(x=>!/^(依上文回答.*|閱讀下文.*|▲.*回答.*題)$/.test(x));
    if(t.join('').length>=40){passages.push(t.join('\n'));curP=passages.length-1;return true}
    return false;
  };
  for(const it of items){
    if(it.t==='sec'){flush();sections.push(it.name);sec=sections.length-1;curP=null;continue}
    if(it.t==='text'){pending.push(it.line);continue}
    if(sec<0){sections.push('全部題目');sec=0}
    if(!seenQ){seenQ=true;if(pending.join('').match(/姓名|班級|座號|得分|考試時間/))pending=[]}
    let r=splitOpts(it.body);
    if(r&&(r.opts.some(o=>o.length>220)||r.stem.length>600||r.opts.filter(o=>!o).length>1)) r=null;
    if(!r){fails.push({sec:sections[sec],n:it.n,text:it.body.join(' ').slice(0,120)});continue}
    let first=false;
    if(pending.length) first=flush();
    let p=null;
    if(curP!=null&&(REF.test(r.stem)||(first&&!r.stem.startsWith('下列')&&passages[curP].length<1500))) p=curP; else curP=null;
    let a=[];
    if(!it.ans&&r.ans) it.ans=r.ans;
    if(it.ans&&it.ans!=='#') a=[...new Set([...it.ans].filter(c=>/[A-Da-d1-4]/.test(c)).map(c=>/\d/.test(c)?+c-1:'ABCD'.indexOf(c.toUpperCase())))].sort();
    const q={s:sec,n:it.n,q:r.stem.replace(/^.{0,24}?題目(?:情境|敘述)\s*[:：]\s*/,''),o:r.opts,a};
    if(r.exp) q.e=r.exp;
    if(p!=null) q.p=p;
    questions.push(q);
    pending.push(...r.rest);
  }
  // 卷末答案表：如「1.B 2.C」或「1-5 BCADA」
  keyLines.forEach(k=>{
    const map={};
    const t=k.text.normalize('NFKC');
    let m;const re1=/(\d{1,3})\s*[.、:：]?\s*\(?([A-Da-d])\)?/g;
    while((m=re1.exec(t))) map[+m[1]]='ABCD'.indexOf(m[2].toUpperCase());
    const re2=/(\d{1,3})\s*[-~～]\s*(\d{1,3})\s*[:：]?\s*([A-Da-d]{2,})/g;
    while((m=re2.exec(t))){const s=+m[1];[...m[3]].forEach((c,i)=>map[s+i]='ABCD'.indexOf(c.toUpperCase()))}
    const sIdx=Math.max(0,k.sec-1);
    questions.forEach(q=>{if(!q.a.length&&(q.s===sIdx||sections.length<=1)&&map[q.n]!=null)q.a=[map[q.n]]});
  });
  const FW={',':'，',':':'：',';':'；','?':'？','!':'！','(':'（',')':'）'};
  const fw=t=>t.replace(/(?<=[^\x00-\x7f])[,:;?!()]|[,:;?!()](?=[^\x00-\x7f])/g,c=>FW[c]);
  questions.forEach(q=>{q.q=fw(q.q);q.o=q.o.map(fw);if(q.e)q.e=fw(q.e)});
  // 去掉沒有題目的段落，重新編號
  const used=[...new Set(questions.map(q=>q.s))].sort((a,b)=>a-b);
  questions.forEach(q=>{q.s=used.indexOf(q.s)});
  return {sections:used.map(i=>sections[i]),passages:passages.map(fw),questions,fails};
}


</script>
<script>
const BUILTIN=(()=>{const d=JSON.parse(document.getElementById('data').textContent);return {id:'builtin',name:'國文選擇題 3000 題',source:'朱源葆博士彙編',...d}})();
const BUILTINS=[BUILTIN,...['data-phys','data-math'].map(id=>JSON.parse(document.getElementById(id).textContent))];
const BKEY='quiz-banks-v1', SKEY='quiz-state-v2';
let banks=[];
try{banks=JSON.parse(localStorage.getItem(BKEY)||'[]')}catch(e){}
let store={banks:{},fs:18,mode:'seq',size:0,cur:'builtin'};
try{Object.assign(store,JSON.parse(localStorage.getItem(SKEY)||'{}'))}catch(e){}
try{const old=JSON.parse(localStorage.getItem('zh-quiz-v1')||'null');
  if(old&&!store.banks.builtin){store.banks.builtin={wrong:old.wrong||{},done:old.done||{}};['fs','mode','size'].forEach(k=>{if(old[k]!=null)store[k]=old[k]})}}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(store))}catch(e){}}
function saveBanks(){try{localStorage.setItem(BKEY,JSON.stringify(banks));return true}catch(e){return false}}
const allBanks=()=>[...BUILTINS,...banks];
let B; // current bank
function useBank(id){
  B=allBanks().find(b=>b.id===id)||BUILTIN; store.cur=B.id;
  B.questions.forEach((q,i)=>{q.id=i});
  if(!store.banks[B.id]) store.banks[B.id]={wrong:{},done:{}};
  save();
}
const prog=()=>store.banks[B.id];
function applyFs(){document.documentElement.style.setProperty('--fs',store.fs+'px')}
applyFs(); useBank(store.cur);
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hasAns=q=>q.a&&q.a.length>0;
const L='ABCD';
let S=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function clearFoot(){document.getElementById('foot')?.remove()}
// 數學題用 MathJax 排版（只在需要時載入）
let mathReady=null;
function typeset(){
  if(!B.math) return;
  if(!mathReady){
    window.MathJax={tex:{inlineMath:[['\\(','\\)']]},svg:{fontCache:'global'},startup:{typeset:false}};
    mathReady=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js';s.onload=()=>MathJax.startup.promise.then(ok);s.onerror=no;document.head.appendChild(s)});
  }
  mathReady.then(()=>MathJax.typesetPromise([app])).catch(()=>{});
}

function home(){
  S=null; window.scrollTo(0,0); clearFoot();
  const Q=B.questions, pr=prog();
  const bySec=B.sections.map(()=>[]);Q.forEach(q=>bySec[q.s]&&bySec[q.s].push(q));
  const wrongN=Object.keys(pr.wrong).length, doneAll=Q.filter(q=>pr.done[q.id]).length;
  const noAns=Q.filter(q=>!hasAns(q)).length;
  let html=`<h1>${esc(B.name)}</h1>
  <div class="sub">共 ${Q.length} 題${B.sections.length>1?`・分 ${B.sections.length} 部分`:''}${B.source?`・${esc(B.source)}`:''}　已作答 ${doneAll} 題</div>
  <div class="banks" role="tablist" aria-label="題庫">
    <button class="chip add" id="addBank">＋ 匯入測驗卷</button>
    ${allBanks().map(b=>`<button class="chip" data-bank="${esc(b.id)}" aria-pressed="${b.id===B.id}">${esc(b.name)}</button>`).join('')}
  </div>
  <div class="section-label">出題方式</div>
  <div class="seg" id="mode">
    <button class="chip" data-v="seq" aria-pressed="${store.mode==='seq'}">依題號順序</button>
    <button class="chip" data-v="rand" aria-pressed="${store.mode==='rand'}">隨機打亂</button>
  </div>
  <div class="section-label">每次題數</div>
  <div class="seg" id="size">
    ${[[10,'10 題'],[20,'20 題'],[50,'50 題'],[0,'全部']].map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${store.size===v}">${l}</button>`).join('')}
  </div>
  <div class="section-label">選擇範圍</div>
  <div class="rounds">
    <button class="round all" data-r="all"><b>全部混合</b><span>從 ${Q.filter(hasAns).length} 題中抽題</span></button>
    <button class="round wrong" data-r="wrong" ${wrongN?'':'disabled'}><b>錯題複習</b><span>${wrongN?`目前 ${wrongN} 題答錯過`:'還沒有錯題'}</span></button>`;
  if(B.sections.length>1) B.sections.forEach((name,i)=>{
    const qs=bySec[i];const d=qs.filter(q=>pr.done[q.id]).length;
    if(!qs.length) return;
    html+=`<button class="round" data-r="${i}"><b>${esc(name)}</b><span>${qs.length} 題・已做 ${d}</span><div class="bar"><i style="width:${d/qs.length*100}%"></i></div></button>`;
  });
  html+=`</div>
  <div class="section-label">字體大小</div>
  <div class="seg" id="fs">${[[16,'小'],[18,'中'],[21,'大'],[24,'特大']].map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${store.fs===v}">${l}</button>`).join('')}</div>
  <p class="note">${noAns?`有 ${noAns} 題原檔沒有附答案，作答時會標示「原檔未附答案」，不計入分數。`:''}題目由檔案自動整理，作答紀錄和匯入的題庫只存在這台裝置的瀏覽器裡。
  <br><button class="linkbtn" id="reset">清除這個題庫的作答紀錄</button>${!BUILTINS.includes(B)?`　<button class="danger" id="del">刪除這個題庫</button>`:''}</p>`;
  app.innerHTML=html;
  app.querySelectorAll('[data-bank]').forEach(b=>b.onclick=()=>{useBank(b.dataset.bank);home()});
  app.querySelector('[data-bank][aria-pressed="true"]')?.scrollIntoView({inline:'nearest',block:'nearest'});
  document.getElementById('addBank').onclick=importView;
  app.querySelectorAll('#mode .chip').forEach(b=>b.onclick=()=>{store.mode=b.dataset.v;save();home()});
  app.querySelectorAll('#size .chip').forEach(b=>b.onclick=()=>{store.size=+b.dataset.v;save();home()});
  app.querySelectorAll('#fs .chip').forEach(b=>b.onclick=()=>{store.fs=+b.dataset.v;save();applyFs();home()});
  app.querySelectorAll('.round').forEach(b=>b.onclick=()=>start(b.dataset.r));
  const confirmBtn=(el,label,fn)=>{el.onclick=()=>{if(el.dataset.c)fn();else{el.dataset.c=1;el.textContent=label}}};
  confirmBtn(document.getElementById('reset'),'再按一次確認清除',()=>{store.banks[B.id]={wrong:{},done:{}};save();home()});
  const del=document.getElementById('del');
  if(del) confirmBtn(del,'再按一次確認刪除',()=>{banks=banks.filter(b=>b.id!==B.id);delete store.banks[B.id];saveBanks();useBank('builtin');home()});
}

function start(r){
  const Q=B.questions, pr=prog();
  let pool,label;
  if(r==='all'){pool=Q.filter(hasAns);label='全部混合'}
  else if(r==='wrong'){pool=Q.filter(q=>pr.wrong[q.id]);label='錯題複習'}
  else {pool=Q.filter(q=>q.s==+r);label=B.sections[+r]}
  if(store.mode==='rand'||r==='all') pool=shuffle(pool);
  if(store.size&&pool.length>store.size){
    if(store.mode==='seq'&&r!=='all'&&r!=='wrong'){
      let i=pool.findIndex(q=>!pr.done[q.id]); if(i<0)i=0;
      const all=pool; pool=all.slice(i,i+store.size);
      if(pool.length<store.size) pool=pool.concat(all.slice(0,store.size-pool.length));
    } else pool=pool.slice(0,store.size);
  }
  S={label,list:pool,i:0,ans:[]};
  renderQ();
}

function renderQ(){
  window.scrollTo(0,0);
  const q=S.list[S.i];
  const scored=S.ans.filter(a=>a&&a.scored), right=scored.filter(a=>a.ok).length;
  let h=`<div class="top"><button class="iconbtn" id="back" aria-label="回首頁">← 首頁</button>
    <div class="prog"><div class="bar"><i style="width:${S.i/S.list.length*100}%"></i></div>
    <small><span>${esc(S.label)}　第 ${S.i+1} / ${S.list.length} 題</span><span>答對 ${right} / ${scored.length}</span></small></div></div>`;
  if(q.p!=null) h+=`<details class="passage" open><summary>閱讀文章</summary><div>${esc(B.passages[q.p])}</div></details>`;
  h+=`<div class="qmeta">${B.sections.length>1?esc(B.sections[q.s])+'・':''}第 ${q.n} 題</div><p class="stem">${esc(q.q)}</p>${q.img?`<img class="fig" src="${q.img}" alt="題目附圖">`:''}<div class="opts">`;
  q.o.forEach((o,k)=>{h+=`<button class="opt" data-k="${k}"><span class="k">${L[k]}</span><span class="t">${esc(o||'（原檔此選項空白）')}</span></button>`});
  h+=`</div><div id="fb"></div>`;
  app.innerHTML=h;
  document.getElementById('back').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  let f=document.getElementById('foot');
  if(!f){f=document.createElement('div');f.id='foot';f.className='foot';document.body.appendChild(f)}
  f.innerHTML=`<div class="in"><button class="secondary" id="skip">跳過</button><button class="primary" id="next" disabled>請點選答案</button></div>`;
  document.getElementById('skip').onclick=next;
  document.getElementById('next').onclick=next;
  typeset();
}

function pick(k){
  const q=S.list[S.i], pr=prog();
  if(S.ans[S.i])return;
  const scored=hasAns(q), ok=scored&&q.a.includes(k);
  S.ans[S.i]={k,ok,scored};
  pr.done[q.id]=1;
  if(scored){ if(ok) delete pr.wrong[q.id]; else pr.wrong[q.id]=1; }
  save();
  app.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true;
    if(scored&&q.a.includes(i)) b.classList.add('ok');
    else if(i===k) b.classList.add(scored?'bad':'ok');
    else b.classList.add('dim');
  });
  const fb=document.getElementById('fb');
  const ansTxt=scored?q.a.map(i=>L[i]).join('、'):'';
  fb.innerHTML=!scored?`<div class="fb na">原檔未附這題的答案，這題不計分。</div>`
    : ok?`<div class="fb ok">答對了！正確答案是 ${ansTxt}</div>`:`<div class="fb bad">答錯了，正確答案是 ${ansTxt}</div>`;
  if(q.e) fb.innerHTML+=`<div class="exp"><b>解析</b>${esc(q.e)}</div>`;
  const nb=document.getElementById('next');
  nb.disabled=false; nb.textContent=S.i+1<S.list.length?'下一題 →':'看成績';
  document.getElementById('skip').hidden=true;
  typeset();
  fb.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function next(){ S.i++; if(S.i<S.list.length) renderQ(); else result(); }

function result(){
  window.scrollTo(0,0); clearFoot();
  const scored=S.ans.map((a,i)=>({a,q:S.list[i]})).filter(x=>x.a&&x.a.scored);
  const right=scored.filter(x=>x.a.ok).length, wrong=scored.filter(x=>!x.a.ok);
  const pct=scored.length?Math.round(right/scored.length*100):0;
  let h=`<div class="top"><button class="iconbtn" id="back">← 首頁</button></div>
  <h2>${esc(S.label)}　成績</h2>
  <div style="margin:18px 0 6px" class="score">${pct}<small> 分</small></div>
  <div class="sub">答對 ${right} 題・答錯 ${wrong.length} 題${S.list.length>scored.length?`・未作答或不計分 ${S.list.length-scored.length} 題`:''}</div>
  <div class="section-label">答錯的題目</div><div class="review">`;
  if(!wrong.length) h+=`<div class="empty">這次全部答對，太厲害了！</div>`;
  wrong.forEach(({a,q})=>{h+=`<div class="rv"><p>${B.sections.length>1?esc(B.sections[q.s])+' ':''}${q.n}. ${esc(q.q)}</p>
    <div class="a">你選 <span class="y">${L[a.k]}　${esc(q.o[a.k])}</span><br>正解 <span class="c">${q.a.map(i=>L[i]+'　'+esc(q.o[i])).join('<br>')}</span></div>${q.e?`<div class="exp"><b>解析</b>${esc(q.e)}</div>`:''}</div>`});
  h+=`</div>`;
  app.innerHTML=h;
  document.getElementById('back').onclick=home;
  const f=document.createElement('div');f.id='foot';f.className='foot';
  f.innerHTML=`<div class="in"><button class="secondary" id="home2">回首頁</button>${wrong.length?'<button class="primary" id="redo">重做這次答錯的題目</button>':'<button class="primary" id="again">再來一組</button>'}</div>`;
  document.body.appendChild(f);
  document.getElementById('home2').onclick=home;
  const redo=document.getElementById('redo'); if(redo) redo.onclick=()=>{S={label:'錯題重做',list:wrong.map(x=>x.q),i:0,ans:[]};renderQ()};
  const again=document.getElementById('again'); if(again) again.onclick=home;
  typeset();
}

/* ---------- 匯入測驗卷 ---------- */
const loaded={};
function loadScript(src){return loaded[src]||(loaded[src]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('無法載入讀檔工具，請確認網路連線'));document.head.appendChild(s)}))}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function pdfText(buf){
  await loadScript(PDFJS+'pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
  const doc=await pdfjsLib.getDocument({data:buf,isEvalSupported:false}).promise;
  let out=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent();
    const rows=[];
    tc.items.forEach(it=>{if(!it.str)return;const y=it.transform[5],x=it.transform[4];
      let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,items:[]};rows.push(r)}r.items.push({x,s:it.str})});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>out.push(r.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join('')));
  }
  return out.join('\n');
}
async function docxText(buf){
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js');
  return (await mammoth.extractRawText({arrayBuffer:buf})).value;
}
async function fileText(file){
  const name=file.name.toLowerCase(), buf=await file.arrayBuffer();
  if(name.endsWith('.pdf')) return pdfText(buf);
  if(name.endsWith('.docx')) return docxText(buf);
  if(name.endsWith('.doc')) throw new Error('舊版 Word（.doc）檔讀不到，請在 Word 另存成 .docx 或 .txt 再上傳');
  let t=new TextDecoder('utf-8').decode(buf);
  if((t.match(/\uFFFD/g)||[]).length>5){try{t=new TextDecoder('big5').decode(buf)}catch(e){}}
  return t;
}

let IMP=null;
function importView(){
  S=null; window.scrollTo(0,0); clearFoot();
  IMP={text:'',name:'',result:null};
  app.innerHTML=`<div class="top"><button class="iconbtn" id="back">← 返回</button></div>
  <h2>匯入測驗卷</h2>
  <div class="sub">上傳檔案或貼上題目文字，會自動整理成可以點選作答的題庫。</div>
  <div class="section-label">題庫名稱</div>
  <div class="field"><input type="text" id="bankName" placeholder="例如：八年級國文第一次段考" maxlength="40"></div>
  <div class="section-label">上傳檔案</div>
  <label class="drop" id="drop" for="file"><b>點這裡選擇檔案</b><span>支援 .txt、.docx（Word）、.pdf（需為文字型 PDF，掃描圖片無法辨識）</span></label>
  <input type="file" id="file" accept=".txt,.text,.docx,.pdf,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
  <div class="or">或直接貼上題目文字</div>
  <div class="field"><textarea id="paste" placeholder="把題目整份複製後貼在這裡"></textarea></div>
  <div id="impStatus"></div>
  <div id="impPrev"></div>
  <details class="fmt"><summary>題目要長什麼樣子才能辨識？</summary>
  <pre>每題用題號開頭，選項用 (A)(B)(C)(D) 或 A. B. C. D. 標示，答案可以寫在題號前面：
(B)1. 「子夜」相當於什麼時間？
(A)晚上九點 (B)晚上十一點到凌晨一點 (C)凌晨三點 (D)早上五點

也可以把答案放在最後：

2. ……
答案：1.C 2.A 3.B
或　答案：1-5 CABDA

用「第一回」「第二單元」這類標題分段，會自動分成不同部分；題目前面的閱讀文章也會一起帶出來。</pre></details>`;
  const foot=document.createElement('div');foot.id='foot';foot.className='foot';
  foot.innerHTML=`<div class="in"><button class="primary" id="doParse" disabled>先上傳檔案或貼上文字</button></div>`;
  document.body.appendChild(foot);
  document.getElementById('back').onclick=home;
  const fileIn=document.getElementById('file'), drop=document.getElementById('drop'), paste=document.getElementById('paste'), nameIn=document.getElementById('bankName');
  const btn=document.getElementById('doParse');
  const setReady=()=>{btn.disabled=!IMP.text.trim();btn.textContent=IMP.text.trim()?'整理題目':'先上傳檔案或貼上文字'};
  const status=(cls,msg)=>{document.getElementById('impStatus').innerHTML=msg?`<div class="status ${cls}">${msg}</div>`:''};
  async function takeFile(f){
    if(!f) return;
    status('info',`正在讀取「${esc(f.name)}」…`);
    try{
      const t=await fileText(f);
      if(!t.trim()) throw new Error('這個檔案讀不到文字。如果是掃描的 PDF，請改用文字檔或 Word 檔');
      IMP.text=t; paste.value=t.slice(0,20000)+(t.length>20000?'\n…（以下省略顯示，整理時會用完整內容）':'');
      if(!nameIn.value) nameIn.value=f.name.replace(/\.(txt|text|pdf|docx)$/i,'').replace(/\.pdf$/i,'').slice(0,40);
      status('ok',`已讀取「${esc(f.name)}」，共 ${t.length.toLocaleString()} 字。按下方「整理題目」。`);
      IMP.fromFile=true; document.getElementById('impPrev').innerHTML=''; IMP.result=null; setReady();
    }catch(e){status('err',esc(e.message||'讀取失敗'))}
  }
  fileIn.onchange=()=>takeFile(fileIn.files[0]);
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on')}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on')}));
  drop.addEventListener('drop',e=>takeFile(e.dataTransfer.files[0]));
  paste.oninput=()=>{IMP.text=paste.value;IMP.fromFile=false;IMP.result=null;document.getElementById('impPrev').innerHTML='';setReady()};
  btn.onclick=()=>{
    if(IMP.result){saveImport();return}
    const r=parseQuiz(IMP.text);
    if(!r.questions.length){status('err','找不到任何題目。請確認每題有題號，選項用 (A)(B)(C)(D) 標示，可以展開下方說明看範例。');return}
    IMP.result=r;
    const withA=r.questions.filter(hasAns).length;
    status(withA?'ok':'info',`整理出 ${r.questions.length} 題${r.sections.length>1?`（${r.sections.length} 部分）`:''}，其中 ${withA} 題有答案${r.passages.length?`，${r.passages.length} 篇閱讀文章`:''}。${withA<r.questions.length?`沒有答案的 ${r.questions.length-withA} 題可以作答但不計分。`:''}${r.fails.length?`另有 ${r.fails.length} 段有題號但不是四選一的選擇題（例如講義內文、計算例題），已略過。`:''}${r.questions.some(q=>q.e)?'有附解析的題目，答完會顯示解析。':''}`);
    const sample=r.questions.slice(0,3).map(q=>`<div class="prev"><p>${q.n}. ${esc(q.q)}</p><ol>${q.o.map((o,i)=>`<li class="${q.a.includes(i)?'c':''}">${L[i]}　${esc(o)}</li>`).join('')}</ol></div>`).join('');
    const fails=r.fails.length?`<div class="section-label">略過的題目（前 5 題）</div>`+r.fails.slice(0,5).map(f=>`<div class="prev"><ol><li>${esc(f.sec)} 第 ${f.n} 題：${esc(f.text)}…</li></ol></div>`).join(''):'';
    document.getElementById('impPrev').innerHTML=`<div class="section-label">前幾題預覽</div><div class="review">${sample}</div>${fails}`;
    btn.textContent='儲存題庫並開始';
  };
  function saveImport(){
    const r=IMP.result;
    const name=nameIn.value.trim()||`我的題庫 ${banks.length+1}`;
    const bank={id:'b'+Date.now().toString(36),name,source:'自行匯入',sections:r.sections,passages:r.passages,questions:r.questions.map(({s,n,q,o,a,p,e})=>Object.assign({s,n,q,o,a},p!=null?{p}:{},e?{e}:{}))};
    banks.push(bank);
    if(!saveBanks()){banks.pop();status('err','這台裝置的瀏覽器儲存空間不夠，請先刪除用不到的題庫再試一次。');return}
    useBank(bank.id); home();
  }
}

document.addEventListener('keydown',e=>{
  if(!S||!S.list[S.i]) return;
  const m={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3}[e.key.toLowerCase()];
  if(m!=null&&!S.ans[S.i]) pick(m);
  else if(e.key==='Enter'&&S.ans[S.i]) next();
});
home();
</script>
</body>
